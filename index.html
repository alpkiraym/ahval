daha yukarıysa (ercah kavle göre) fesih yok."}]},{"t":"Evliliğin İspatı ile Eşlerin Hak ve Ödevleri","intro":"Evlilik akdinde şer'i ispat yolları (ikrar, beyyine, yeminden nükûl); kadının ödevleri, kocanın ödevleri ve eşler arasındaki müşterek haklar.","s":[{"h":"Evliliğin ispat ve ikrarı","b":[{"k":"p","x":"Evlilik akdindeki şer'i ispat yolları üçtür: İkrar, beyyine ve yeminden nükul."},{"k":"d","t":"İkrar","x":"Bir kimsenin kendisiyle ilgili olup, başkasına ait bulunan bir hakkı haber vermesidir. Karşıtı \"inkar\"dır. Aleyhine hukuki neticeler husule getirilebilen maddi veya hukuki bir vakıanın doğruluğunu tasdiktir. İkrar bir vakıaya taalluk eder ve bu vakıanın başka delillerle ispatına hacet olmadan doğru sayılmasına hüccettir."},{"k":"d","t":"Beyyine","x":"Delil, şahit, bir davayı ispat için ortaya konulan hüccet. İki şahit ya da bir şahit ve yemin."},{"k":"d","t":"Nukûl ani'l-yemin","x":"Davalı ya da davacının kendisine yöneltilen yemine yanaşmaması, yemin etmekten kaçınması. Yemin etmekten kaçınan kimseye \"nâkil\" denir."}]},{"h":"Kadının ödevleri (erkeğin hakları)","b":[{"k":"p","x":"Ayet-i kerimede Allah Teala kadın için gerekli olan şeyleri beyan etmiştir: \"Erkekler, kadınların koruyup kollayıcılarıdırlar. Çünkü Allah, insanların kimini kiminden üstün kılmıştır. Bir de erkekler kendi mallarından harcamakta (ve ailenin geçimini sağlamakta)dırlar. İyi kadınlar, itaatkardırlar. Allah'ın (kendilerini) koruması sayesinde onlar da \"gayb\"ı korurlar. (Evlilik yükümlülüklerini reddederek) başkaldırdıklarını gördüğünüz kadınlara öğüt verin, onları yataklarında yalnız bırakın. (Bunlar fayda vermez de mecbur kalırsanız) onları (hafifçe) dövün. Eğer itaat ederlerse, artık onların aleyhine başka bir yol aramayın. Şüphesiz Allah, çok yücedir, çok büyüktür.\""},{"k":"p","x":"Bu ayet-i kerime ile kadının kocasına itaatini, kocanın te'dib hakkını ve kadının üzerinde \"kavvam\" oluşunu istidlal ederiz."},{"k":"sc","q":"İtaat nedir?","x":"Kadının kendisi için hazırlanan evde kocasıyla beraber oturması, Allah'ın nehyettikleri hariç onun emirlerine uyması, evinden kocasının izni olmadan çıkmaması ve hiç kimseyi onun izni olmadan eve almamasıdır."},{"k":"h","x":"Kadının kocasının evinde oturma şartları (4)"},{"k":"n","n":1,"x":"Mehr-i muacceli ödemesi gerekir."},{"k":"n","n":2,"x":"Ev kadının statüsüne uygun olmalı."},{"k":"n","n":3,"x":"Evde kadın canını ve malını güvende hissedecek."},{"k":"n","n":4,"x":"Koca güvenilir biri olacak."},{"k":"h","x":"Kadının kocasının emirlerine imtisalinin tahakkuk şartları (3)"},{"k":"n","n":1,"x":"Emir evliliğe dair işlerden olacak. Kocanın şahsi işleri olmaz."},{"k":"n","n":2,"x":"Emir şeriate uygun olacak."},{"k":"n","n":3,"x":"Kocanın karısına karşı görevlerini yerine getirmesi gerekir."},{"k":"h","x":"Kadının kocasının evinden izinsiz çıkmaması için şartlar (2)"},{"k":"n","n":1,"x":"Mehr-i muacceli ödemesi gerekir."},{"k":"n","n":2,"x":"Sıla-i rahme engel olunmaması gerekir."},{"k":"h","x":"Kocanın te'dib hakkı"},{"k":"p","x":"Üç mertebedir."},{"k":"steps","x":["Şefkat ve yumuşaklıkla nasihat eder.","Yatağında mehcur bırakır.","Acı vermeyecek şekilde vurmak."]},{"k":"not","x":"Zarar vermek amacıyla yapılan vurma sonucunda Hanefiler kadının tazir cezası vermesi için hakime başvurulabileceğini, Malikiler başvurunun boşama amacını teşmil edebileceğini söylemişlerdir."},{"k":"h","x":"Diğer ödevler"},{"k":"li","x":"**Kocanın yatağına icabet etmesi gerekir:** Hayız ve nifas gibi şer'i bir mani olması müstesnadır. Buhari rivayeti şöyledir: \"Bir adam karısını yatağına davet eder de karısı gelmez ve erkek ona dargın / kızgın olarak gecelerse, melekler o kadına sabaha kadar lânet ederler.\""},{"k":"li","x":"**Kadının nefsini kocasının ve kendisinin şerefine halel gelmeyecek biçimde koruması gerekir:** Kocanın kalbinde şüphe uyandıracak herhangi bir şey yapmamalıdır."},{"k":"li","x":"**Kadın kocasının malını kendi malı gibi koruması gerekir.**"},{"k":"tbl","r":[["Konu","Şart sayısı","Şartlar"],["**Kocanın evinde oturma**","4","Mehr-i muacceli alması, evin statüsüne uygunluğu, can ve mal güvenliği, kocanın güvenilirliği"],["**Kocanın emirlerine uyma**","3","Emir evlilikle ilgili, şeriate uygun; koca da görevlerini yerine getirmeli"],["**Evden izinsiz çıkmama**","2","Mehr-i muacceli alması, sıla-i rahme engel olunmaması"]]}]},{"h":"Kocanın ödevleri (kadının hakları)","b":[{"k":"p","x":"Bu ödevler çok olup burada mühim olanları zikredeceğiz:"},{"k":"li","x":"**Koca mehr-i muacceli duhulden evvel vermelidir:** Duhul olsa da bu hak düşmez. Nikah esnasında konuşulmayan mehr-i müaccelin mikdarı o yörenin örfüdür ve ona göre hemen ödenmelidir. Mehr-i muacceli almayan kadın izinsiz dışarı çıkabilir."},{"k":"li","x":"**Kadının it'am, kisve ve sükna ihtiyaçları karşılanmalıdır.**"},{"k":"li","x":"**Kocanın eşleri varsa aralarında adil davranmalıdır.** Nafaka ve barınma gibi."},{"k":"li","x":"**Kadının anne-babasına izinsiz haftada bir kere gitmesine müdahele edilmemelidir.** Bunun dışındaki mahremlerine senede bir de olsa gidebilmelidir. Her ay gidebileceği de söylenmiştir."},{"k":"li","x":"**Kocanın, kadının kendi malındaki tasarrufuna karışmaması gerekir.** Koca mala dokunamaz karısı vekalet vermediği müddetçe. Eğer ki koca bu malı izinsiz almışsa, gasbetmiş olur. Şer'i şerife göre malı iade etmesi gerekir. Yanında telef olduysa misli malsa mislini kıyemi ise kıymetini öder."},{"k":"li","x":"**Koca, kadına evin işlerinden bir iş için harcama yapmasını istememelidir.** Hatta koca karısını yemek pişirme, elbisesini dikme gibi işlerle de sorumlu tutamaz. Kadın kendi rızası ile yapıyorsa ne âlâ."}]},{"h":"Eşler arasındaki müşterek haklar","b":[{"k":"p","x":"En önemlileri dört tanedir:"},{"k":"n","n":1,"x":"**Adab-ı muaşerete riayet:** «وَلَهُنَّ مِثْلُ الَّذِي عَلَيْهِنَّ بِالْمَعْرُوفِ»"},{"k":"n","n":2,"x":"Hürmet-i musahara riayet."},{"k":"n","n":3,"x":"Evlilik yolu ile birbirlerine mirasçı olurlar."},{"k":"n","n":4,"x":"İstimta' haklarına riayet."}]}],"ht":[{"s":0,"x":"Evliliğin üç ispat yolu: ikrar (karşıtı inkâr), beyyine (iki şahit ya da bir şahit ve yemin), yeminden nükûl (yemin etmekten kaçınan: nâkil)."},{"s":1,"x":"Kadının ödevleri: itaat (evde oturmak, şer'e aykırı olmayan emirlere uymak, izinsiz çıkmamak, izinsiz kimseyi eve almamak), yatağa icabet (hayız-nifas hariç), iffetini ve kocanın malını korumak."},{"s":1,"x":"Şart sayıları: evde oturma 4, emre uyma 3, izinsiz çıkmama 2. Te'dib üç mertebe: nasihat → yatakta mehcur bırakmak → acı vermeden vurmak."},{"s":2,"x":"Kocanın ödevleri: mehr-i muacceli duhulden önce vermek (miktarı konuşulmamışsa örf), it'âm-kisve-süknâ, eşler arasında adalet, kadının anne-babasını haftada bir izinsiz ziyaretine engel olmamak (diğer mahremler yılda bir, bir görüşe göre ayda bir), kadının malına karışmamak (izinsiz alırsa gasptır), ev işi ve harcama yüklememek."},{"s":3,"x":"Müşterek dört hak: âdâb-ı muâşeret, hürmet-i musâhara, karşılıklı mirasçılık, istimta'."}]},{"t":"Mehir","intro":"Mehrin tanımı, delilleri ve nev'ileri; en azı ve en çoğu; mehre müteallik haklar; muaccel ve müeccel mehir; mehr-i müsemma ve mehr-i misil; mehrin tamamının, yarısının vacip olduğu ve düştüğü durumlar; halvet ve müt'a.","s":[{"h":"Mehir","b":[{"k":"d","t":"Mehir","x":"Nikâh akdinin («الوطء») sonucu olarak kocanın karısına ödemek zorunda olduğu para veya maldır."},{"k":"p","x":"«الوطء» kelimesiyle iki şey kastedilebilir. Birincisi \"sahih akdin kendisi\" ikincisi ise \"zifaf\". Zifaf, fasid evlilik akdinde mehrin vacip olduğu şeydir. Bundan dolayı fasid evlilikte duhulden evvel eşler ayrılırsa mehirden bir şey gerekmez. Çünkü ne sahih akid vardır ne de duhul..."},{"k":"p","x":"Mehrin akid esnasında zikri sıhhat şartı değildir. Bilakis mehrin ismi konulmasa da akid sahih olur. Yine mehrin yokluğu üzere anlaşsalar da bu böyledir. Mehir, sadaka, nihle, feriza, tavl, hiba, ecr, ukr, nikah gibi isimlerle de isimlendirilir."}]},{"h":"Mehrin vücubiyetinin delilleri","b":[{"k":"li","x":"**Kitap:** \"Kadınlara mehirlerini (bir görev olarak) gönül hoşluğuyla verin.\"; \"(Savaş esiri olarak) sahip olduklarınız hariç, evli kadınlar (da size) haram kılındı. (Bunlar) üzerinize Allah'ın emri olarak yazılmıştır. Bunların dışında kalanlar ise, iffetli yaşamak ve zina etmemek şartıyla mallarınızla (mehirlerini verip) istemeniz size helal kılındı. Onlardan (nikahlanıp) faydalanmanıza karşılık sabit bir hak olarak kendilerine mehirlerini verin. Mehir belirlendikten sonra, onunla ilgili olarak uzlaştığınız şeyler konusunda size günah yoktur.\""},{"k":"li","x":"**Sünnet:** Bu konuda bir çok hadis vardır: \"Eğer bir kimse bir kadının mehri için kavrulmuş un veya kuru hurma verirse muhakkak (kadını kendine) helâl kılmıştır\" buyurmuşlardır."},{"k":"li","x":"**İcma':** İslam uleması sahabe zamanından günümüze kadar bu konuda icma' etmişlerdir."}]},{"h":"Mehir kocaya vaciptir","b":[{"k":"p","x":"Erkeğin evin geçimini sağlaması kadının evin idaresiyle meşgul olması kadim insanlık tarihiyle yaşıttır. Bundan dolayı tüm ekonomik teklifler erkeğe vaciptir. Mehir, nafaka ve bu nev'ilerden tamamı böyledir. Bu doğal taksim insan fıtratına uygundur."}]},{"h":"Mehrin nev'ileri","b":[{"k":"p","x":"Mehir Müslümanlar için mütekavvim mallardan olurken gayr-i müslimlerde mütekavvim maldan mehir olmaz. Bunun delili \"mallarınızla aramanız\" mealindeki ayet-i kerimedir."},{"k":"p","x":"Mehrin altın ve gümüşten, akardan, menkul mallardan ve mütekavvim mallardan elde edilen menfaatlerden olması sahihtir. Ancak meyte, akıtılmış kan, şarap, domuz gibi şeylerden mehir verilmez. Bunlar ilk ikisi mal değil son ikisi ise mal olup mütekavvim değildir. Eğer erkek akid esnasında mehir olmayan şeyleri zikretmişse akid sahih tesmiye fasittir yani sanki hiç bir şey zikredilmemiş gibidir."}]},{"h":"Akidde mehrin tesmiyesi vacip değildir","b":[{"k":"p","x":"Mehir evlilik akdinin rükunlarından değildir. Akdin sıhhat şartı için onun zikredilmesi şart değildir. Bunun delili «لَا جُنَاحَ عَلَيْكُمْ إِنْ طَلَّقْتُمُ النِّسَاءَ مَا لَمْ تَمَسُّوهُنَّ أَوْ تَفْرِضُوا لَهُنَّ فَرِيضَةً» ayetidir."}]},{"h":"Mehrin en azı ve en çoğu","b":[{"k":"p","x":"Hanefilere göre mehri 10 dirhemin altına vermek caiz değildir. Bunun ölçüsü 7 miskaldir. Hanefiler şu hadisi delil gösterirler: \"Mehir 10 dirhemden aşağı olmaz\" Eğer bu miktardan az olursa Ebu Hanife ve imameyne göre tesmiye sahih olmaz, kocanın 10 dirhemi ödemesi gerekir. İmam Züfer'e göre mehir, mehr-i misle dönüşür."},{"k":"not","x":"Bunun ölçüsü ile ihtilaflar vardır. Müellifin söylediğine göre bazı araştırmacılar günümüzde Mısır kuruşlarından 25 kuruşa müsavi olduğunu söylemişlerdir."},{"k":"p","x":"İmam Malik'e göre, altın miktarından verilecek mehir dinarın 1/4'ünden, gümüşten ise 1/3'ünden az olamaz. Eğer akid esnasında belirtilen bu miktarlardan daha azı tesmiye edilmişse miktarı tamamlamak ve talakla akdi bozmak hususunda muhayyerdir. Talakı tercih ederse mehrin yarısını ödemek zorundadır."},{"k":"p","x":"İmam Şafii ve Ahmed b. Hanbel'e göre, mehrin azının sınırı yoktur. Semen olan her şeyden mehir olur. Delilleri \"Kim bir kadının mehri için iki avuç dolusu sevîk veya hurma verse kadını helâl etmiş olur\""},{"k":"p","x":"Mehrin üst sınırının olmayışı icma' ile sabittir. Şeriat kocanın karısına dilediği ölçüde mehir vermesine mani olmaz. Bununla beraber sünnet olan erkeğin kadına verdiği mehirde mübalağa yapmamasıdır. Allah Resulü (sav) şöyle buyurmuşlardır: \"Evlenmenin en hayırlısı, en kolay ve külfetsiz olandır.\" Konuyla ilgili bir çok uyarı vardır."},{"k":"tbl","r":[["Görüş sahibi","Mehrin en azı","Az tesmiye edilirse"],["**Hanefiler (Ebû Hanîfe ve İmameyn)**","10 dirhem (7 miskal)","Tesmiye sahih olmaz, 10 dirhem ödenir"],["**İmam Züfer**","10 dirhem","Mehr-i misle dönüşür"],["**İmam Mâlik**","Altından dinarın 1/4'ü, gümüşten 1/3'ü","Koca tamamlamak ile talak arasında muhayyer; talakta yarım mehir"],["**İmam Şâfiî ve Ahmed b. Hanbel**","Sınırı yok; semen olan her şey","—"]]}]},{"h":"Akdin gereği","b":[{"k":"p","x":"Akidle beraber mehr-i misil gerekir. Eğer tesmiye anında sussalar, mehir yok deseler, gayr-i mütekavvim malı mehir diye zikretseler tüm bu durumlarda aslına döneriz. Bu da mehr-i misildir. Bu Ebu Hanife'nin görüşü olup imameyn mehr-i müsemmaya dönüşeceğini söylemişlerdir."},{"k":"d","t":"Mehr-i sır","x":"İnsanların önünde övünmek için gizli mehirden bambaşka bir mehrin zikredilmesidir."},{"k":"p","x":"Mehirde aleniyet var olduğu için bu mehrin verilmesi gerekir."}]},{"h":"Mehre müteallik haklar","b":[{"k":"h","x":"1. İbtida durumu"},{"k":"p","x":"Üç hak vardır."},{"k":"li","x":"**Allah hakkı:** Mehir ortadan kaldırılamaz ve 7 miskalden de az olamaz."},{"k":"li","x":"**Kadının hakkı:** Veli kadının mehrini mehr-i misilden az olarak belirleyemez. (Kadının veli tarafından evlendirilmesindeki hükümlere tabidir.)"},{"k":"li","x":"**Velinin hakkı:** Kadın kendisi evlendiğinde mehrini misilden az belirleyemez. (Velinin velayet ettiği kadın hakkındaki haklarına bakınız.)"},{"k":"h","x":"2. Devam ve bekâ durumu"},{"k":"p","x":"Burada sadece kadının hakkı vardır. Dilerse mehri alır dilerse kocaya hibe eder."}]},{"h":"Mehr-i muaccel ve müeccel","b":[{"k":"p","x":"Koca mehrin tamamını peşin verebileceği gibi, ittifakla yakın veya uzak vakitte tamamını verebilir. Yine bir kısmını peşin bir kısmını vadeli ya da tamamını vadeli verebilir. Bu eşlerin anlaşmasına göredir. Yok eğer mehrin vakti belirlenmemişse o zaman yaşadıkları yerin örfü üzere hareket ederler."},{"k":"p","x":"Alimlerden bazıları mehrin bir kısmının peşin ödenmesini bunu vacip gören ulemanın ihtilafından kurtulmak için müstehap kabul etmişlerdir. Bu konuda delil olarak Sevgili Peygamberimiz (sav)'in kızı Fatıma'yı, Hz. Ali ile evlendirdiğinde, onun yanına girmesini kıza bir şeyler vermedikçe men' etmesi gösterilir."}]},{"h":"Mehrin tesmiyesi ne zaman sahih ne zaman fasit olur?","b":[{"k":"p","x":"Mehir için mal tesmiye edilmişse, malın mütekavvim ve malum olması gerekir. Yani akde konu olan malın vasıflarının bilinmesi gerekir. Eğer menfaat tesmiye edilmişse menfaatin ücret mukabilinde olması gerekir. Bunun delili \"Ben, sekiz yıl bana çalışmana karşılık, şu iki kızımdan birisini sana nikahlamak istiyorum...\" mealindeki ayettir."},{"k":"p","x":"Dört konuda tesmiye fasid olur. Bunun üçü mallarla ilgili olup biri menfaat ile ilgilidir."},{"k":"n","n":1,"x":"Mal gayr-i mütekavvim olursa. Bir küp su."},{"k":"n","n":2,"x":"Mal gayr-i müslimler için mütekavvim olursa. Şarap gibi."},{"k":"n","n":3,"x":"Mal mechul olup cehalet-i fahişeye sahip olursa. 20 miskal gibi."},{"k":"n","n":4,"x":"Ücret almanın caiz olmadığı menfaatler böyledir. Kur'an eğitimi vermek gibi."}]},{"h":"Mehr-i müsemma, mehr-i misil ne zaman vacip olur?","b":[{"k":"p","x":"Bu ikisinin en azı ne zaman vacip olur? Zikredeceğimiz dört şeyden biri, akid için muhakkak gereklidir."},{"k":"h","x":"1. Müsemmanın vacip olduğu yer"},{"k":"p","x":"Bu bir durumda gerekir. O da akid esnasında 10 dirhem ve fazlasının ya da buna mukabili malın tesmiye edilmesidir. Bunda niza gürültü olmaz."},{"k":"h","x":"2. Mislin vacip olduğu yer"},{"k":"p","x":"Beş durum vardır: Bunlardan dört tanesinde Hanefiler ittifak halinde olup bir tanesinde ihtilaf etmişlerdir."},{"k":"li","x":"**a) Akid esnasında mehir zikredilmemiştir.** Bu üç şekli teşmil eder: a.a) Akid mutlaktır. Erkek kadına \"benimle evlenir misin\" diyor kadın da erkeğe \"kendimi sana verdim\" diyor ama mehir zikredilmiyor. Ayrıca buna kimse de itiraz etmiyor. a.b) Akid şiğar akdidir. a.c) Nikah-ı tefviz."},{"k":"li","x":"**b)** Koca ve velisi aslen mehri reddetmiş ve tanımamıştır."},{"k":"li","x":"**c)** Mehrin tesmiyesinin fasit tesmiye olması."},{"k":"li","x":"**d)** Baliğ, âkil ve hür olan kadının velisinin izni olmaksızın \"kendimi seninle evlendirdim\" demesi üzerine kocanın bunu mehr-i misilden az olarak isimlendirmesi."},{"k":"li","x":"**e)** Mehri 10 dirhemden az olarak zikretme durumunda."},{"k":"d","t":"Nikah-ı tefviz","x":"Mehirsiz kıyılan ya da mehir konusu veliye ya da bir başkasına havale edilerek akdedilen nikahtır."},{"k":"h","x":"3. Mehr-i misil ve müsemmadan daha az olanın vacip olduğu yer"},{"k":"p","x":"Bunda tek durum vardır. Fasit bir akitte sahih bir tesmiye ile mehir belirlenmiş ve duhul da gerçekleşmiş ise mehr-i müsemma ile misilden hangisi daha az ise o tahakkuk eder."},{"k":"h","x":"4. Mehrin en az miktarının (10 dirhem) vacip olduğu yer"},{"k":"p","x":"Bunun hükmü yukarıda da geçmişti. 10 dirhemden az tesmiye edilse de Ebu Hanife ve imameyne göre 10 dirhem verilir. Züfer mehr-i misil gerekir demişti."},{"k":"tbl","r":[["Vacip olan","Durum"],["**Mehr-i müsemma**","Akitte 10 dirhem ve fazlası ya da karşılığı mal tesmiye edilmiş"],["**Mehr-i misil**","Mehir zikredilmemiş (mutlak akit, şiğar, tefviz); mehir reddedilmiş; fasit tesmiye; kadın velisiz evlenip koca misilden az tesmiye etmiş; 10 dirhemden az zikredilmiş (Züfer'e göre)"],["**Müsemma ile misilden azı**","Fasit akitte sahih tesmiye + duhul"],["**En az miktar (10 dirhem)**","10 dirhemden az tesmiye (Ebû Hanîfe ve İmameyn'e göre)"]]}]},{"h":"Mehr-i misilde kadının emsalleri kimlerdir?","b":[{"k":"d","t":"Mehr-i misil","x":"Zevcenin babası tarafından ve olmadığı takdirde memleket ahalisinden akit tarihinde yaş, güzellik, bekaret gibi özelliklerde kendisine akran ve emsal olan kadınların mehridir."}]},{"h":"Mehr-i misil neye göre tespit edilir?","b":[{"k":"p","x":"Karı - koca mehr-i misilde ittifak etmişlerse durum zahirdir. İttifak ettikleri şey mehr-i misil olur. Çünkü koca onu ödemekle kadın da kabul etmekle rıza göstermişlerdir. Eğer ihtilaf ederlerse, koca \"mehr-i mislin 100 dinardır\" dese de kadın \"benim emsallerim 200 dinar\" dese iki adil erkek şahit veya bir erkek iki kadın şahit bulanın sözü geçerlidir (ikrar), koca yemin ederse bu geçerlidir (beyyine), nukul ani'l yemin yaparsa kadının sözü geçerlidir."}]},{"h":"Mehre bindirim ve mehirden indirim","b":[{"k":"p","x":"Koca baliğ, âkil ise tek başına akid tamamlandıktan sonra mehri artırabilir. Eğer mecnun, sağir, ma'tuh ise bu artırıma malik değildir. Velisi bu konuda söz sahibidir. Bu ziyadenin geçerli olabilmesi için üç şart bulunmaktadır:"},{"k":"n","n":1,"x":"Ziyadenin miktarı malum olmalıdır."},{"k":"n","n":2,"x":"Kadın veya velisi aynı mecliste yapılan ziyadeyi kabul etmelidir."},{"k":"n","n":3,"x":"Evliliğin devam ediyor olması gerekir."},{"k":"p","x":"Mehirdeki indirimin geçerli olabilmesi için de dört şart vardır:"},{"k":"n","n":1,"x":"Mehri bizzat kadın düşürmelidir. Velinin fiili geçersizdir."},{"k":"n","n":2,"x":"Kadının ehliyet sahibi olması ile mehirde indirim yapılabilir."},{"k":"n","n":3,"x":"İkrah olmayacak, kadının indirime razı olması gerekir."},{"k":"n","n":4,"x":"Bunun ibrası için kadının sıhhatli olması gerekir. Ölüm döşeğinde ise varislerinin rızası ile olabilir. Zira vasiyyet mutlak olarak varise caiz değildir. Bunun istisnası tüm varislerin rızasının olmasıdır."},{"k":"p","x":"Ziyade ve indirimde mehr-i müsemma üzerine iki fark vardır:"},{"k":"n","n":1,"x":"Ziyadede kadının veya velisinin kabulü şarttır. Hal böyle iken indirimde kocanın veya velisinin kabulü şart değildir. Çünkü iskatte kabule ihtiyaç duyulmamıştır."},{"k":"n","n":2,"x":"Kocanın velisi kadının mehrindeki ziyadeye malik olur. Veli baba ve dede olduğunda ve koca da küçük veya küçük hükmünde olduğunda böyledir. Kadın küçük olduğu zaman onun velisi mehirde indirim hakkına sahip değillerdir."},{"k":"tbl","r":[["","Ziyade (bindirim)","İndirim"],["**Şart sayısı**","3: miktar malum, kadın ya da velisi aynı mecliste kabul, evlilik devam ediyor","4: bizzat kadın, ehliyetli, rızasıyla, sıhhatli (ölüm döşeğinde varislerin rızası)"],["**Karşı tarafın kabulü**","Kadının ya da velisinin kabulü şart","Kocanın kabulü şart değil (iskatte kabul gerekmez)"],["**Velinin yetkisi**","Küçük kocanın babası/dedesi ziyade edebilir","Küçük kadının velisi indirim yapamaz"]]}]},{"h":"Kadının mehrinin tamamı kocanın üzerine ne zaman vacip olur?","b":[{"k":"p","x":"Sahih akitte mehrin tamamı üç yerde gerekli olur:"},{"k":"n","n":1,"x":"Hakiki duhul gerçekleşmişse"},{"k":"n","n":2,"x":"Sahih halvet ile"},{"k":"n","n":3,"x":"Duhul ve halvet-i sahihadan evvel eşlerden birinin ölmesi ile."},{"k":"sc","q":"Mehrin yarısı nerede gerekir? Mehrin hiç gerekmediği yer neresidir?","x":"Mehrin yarısı sadece duhul olmadan veya halvet-i sahiha olmadan boşandığında gerekir. Mehir belirlenmemiş olup duhul ve halvet-i sahiha da gerçekleşmemişse mehir verilmez, müt'a verilir (dersten)."},{"k":"p","x":"Toparlayacak olursak:"},{"k":"n","n":1,"x":"Fasit akidde hakiki duhul gerçekleşirse, eğer tesmiye fasit ise mehr-i misil gerekir. Tesmiye sahih ise mehr-i misil ve müsemmadan azı gerekir."},{"k":"n","n":2,"x":"Şüphe sebebiyle hakiki duhul gerçekleşirse mehr-i misil gerekir."},{"k":"n","n":3,"x":"Sahih evlilik sebebiyle hakiki duhul gerçekleşirse tesmiye sahih ise müsemma gerekir. Yine bunda mehr-i misil ve mehrin en azı olan 10 dirhem gerekir ki bunların beyanı yukarıdadır."},{"k":"n","n":4,"x":"Sahih evlilikteki halvet-i sahihada da mehr-i müsemma, misil ve mehrin en azı gerekir."},{"k":"n","n":5,"x":"Sahih evlilikte eşlerden biri vefat ederse tam mehir gerekir."}]},{"h":"Halvet, nev'ileri ve hükümleri","b":[{"k":"d","t":"Halvet","x":"Karı ile kocanın, izinleri olmadıkça üçüncü bir şahsın muttali olamayacaklarından emin bulundukları bir yerde başbaşa kalmalarıdır."},{"k":"d","t":"Halvet-i sahîha","x":"Karı ile kocanın hiç birinde cinsel ilişkiye engel bir sebep bulunmaksızın bir araya gelmeleri ve başbaşa kalmaları."},{"k":"d","t":"Halvet-i fâside","x":"Karı ile kocadan birinde hastalık, hayız hali gibi cinsel ilişkiye engel teşkil edecek bir sebep olduğu halde bir araya gelmeleri ve başbaşa kalmalarıdır."},{"k":"not","x":"Halvet-i sahiha olabilmesi için önemli olan nikahtır. Diğer türlü halvet zaten haramdır (dersten)."},{"k":"p","x":"Cinsel ilişkinin (halvet) mânileri: Üçtür."},{"k":"n","n":1,"x":"**Doğal engel:** Karı - kocanın küçük olması veya kadının hayız olması."},{"k":"n","n":2,"x":"**Hissi engel:** Karı - kocanın hasta olmaları."},{"k":"n","n":3,"x":"**Şer'i engel:** Birisinin ihramlı olması. Ramazan orucu, kadınların özel halleri vb."},{"k":"p","x":"Yukarıda tarifini verdiğimiz üzere halvet iki tanedir. Bunların ortak noktası bir tanedir o da kadının iddet beklemesidir. Halvet-i sahihanın hakiki duhul ile birleştiği ve ayrıldığı yerler vardır."},{"k":"h","x":"Halvet-i sahîhanın hakiki duhulle birleştiği yerler (2)"},{"k":"n","n":1,"x":"Mehrin tamamının vacip olması hususunda"},{"k":"n","n":2,"x":"İddet bekleme hususunda."},{"k":"h","x":"Ayrıldığı yerler (5)"},{"k":"n","n":1,"x":"İhsan hem akdin hem de duhulün gerçekleşmesi ile olur. Akid var ama duhul yok halvet-i sahiha varsa burada ihsan yoktur."},{"k":"n","n":2,"x":"Beynunet-i kübra ile ayrılmış bir kadının tekrar o kocaya dönebilmesi için duhul gerekir halvet-i sahiha yetmez."},{"k":"n","n":3,"x":"Üvey kızın erkeğe haram olması için annesi ile duhul gerekir halvet-i sahiha yetmez."},{"k":"n","n":4,"x":"Halvet-i sahiha ile olan boşamalar baindir. Duhulden sonra ric'i olabilir."},{"k":"n","n":5,"x":"Halvet-i sahihada miras terettüp etmezken, duhulden sonra miras sabit olur."},{"k":"tbl","r":[["","Halvet-i sahîha","Hakiki duhul"],["**Mehrin tamamı**","Vacip","Vacip"],["**İddet**","Gerekir","Gerekir"],["**İhsan**","Yok","Var"],["**Beynûnet-i kübrâdan sonra ilk kocaya dönüş**","Yetmez","Gerekir"],["**Üvey kızın haram olması**","Yetmez","Annesiyle duhul gerekir"],["**Talak**","Bain","Ric'i olabilir"],["**Miras**","Terettüp etmez","Sabit olur"]]}]},{"h":"Kadının mehrinin yarısı kocanın üzerine ne zaman vacip olur?","b":[{"k":"p","x":"Sadece duhul olmadan veya halvet-i sahiha olmadan boşandığında gerekir. Bunun delili \"Eğer onlara mehir tespit eder de kendilerine el sürmeden boşarsanız, tespit ettiğiniz mehrin yarısı onlarındır. Ancak kadının, ya da nikah bağı elinde bulunanın (kocanın, paylarından) vazgeçmesi başka...\" mealindeki ayettir. Ayet-i kerimeye göre bunun üç şartı vardır:"},{"k":"n","n":1,"x":"Mehir müsemma olmalıdır."},{"k":"n","n":2,"x":"Dokunmadan önce kocası kadını boşayacak"},{"k":"n","n":3,"x":"Kadın mehrin tamamını kocasına bağışlamamış olacak."},{"k":"p","x":"Buna dair bazı meseleleri pekiştirelim:"},{"k":"li","x":"Mehir misil ise yarısı verilmez. Müt'a verilir."},{"k":"li","x":"Mehre yapılan ziyade aynıyla verilir."},{"k":"li","x":"Mehrin yarısının verilmesi için ayrılığın kocaya taalluk etmesi gerekir. Burada talak, lian, i'la, erkeğin kusuru, sonradan meydana gelebilecek din farklılığı, zihar gibi şeylerin tamamı erkekle ilgili olduğu için erkek müsemmanın yarısını vermekle mükelleftir."}]},{"h":"Kocanın bu mehirdeki tasarrufu","b":[{"k":"p","x":"Eğer müsemma olan mehrin tamamı kocanın elinde ise boşanma sonucunda yarısında dilediği tasarrufu yapabilir. Yok eğer müsemma mehrin tamamı önceden kadına verilmiş ise boşanma durumunda mehrin yarısı kadının icazetine bağlıdır. Eğer mehrin yarısını kullanmışsa hakim kararıyla ödemesi icab eder. Zaten öbür yarısı kendisinin hakkıdır."}]},{"h":"Kadına müt'a ne zaman gereklidir?","b":[{"k":"p","x":"Mehir belirlenmemiş olup duhul ve halvet-i sahiha da gerçekleşmemişse mehir verilmez, müt'a verilir, demiştik. Bunun delili, \"Kendilerine el sürmeden ya da mehir belirlemeden kadınları boşarsanız size bir günah yoktur. (Bu durumda) -eli geniş olan gücüne göre, eli dar olan da gücüne göre olmak üzere- onlara, aklın ve dinin gereklerine uygun olarak müt'a verin...\" mealindeki ayet-i kerimedir. Bu durum iki suret üzerine teşmil olur:"},{"k":"n","n":1,"x":"Mehr-i mislin gerekli olduğu tüm yerlerde müt'a gerekir. (Bkz. \"Mislin vacip olduğu yer\". Bu durumda ulema arasında ihtilaf yoktur.)"},{"k":"n","n":2,"x":"Müfevvizanın akitten sonra aralarında mehri belirleme durumu. (Bkz. \"Nikah-ı tefviz\". Burada ihtilaf olup, Şafii'ye göre mehrin yarısı, tarafeyne göre müt'a gerekir.)"},{"k":"d","t":"Müfevviza","x":"Kadının, mehri belirleme izni olmaksızın, kendisini nikahlamak için vekil tayin etmesidir."}]},{"h":"Müt'a ve miktarı","b":[{"k":"p","x":"Müt'a kocanın kadına ödemesi gereken bir maldır, demiştik. Bunun akar veya menkul ya da elbise olması arasında fark yoktur. Bundan dolayı bazı alimler \"Müt'a erkeğin kadına giydirdiği elbisedir\" demişlerdir."},{"k":"p","x":"Şeriatte müt'anın muayyen bir miktarı yoktur. Bilakis eşlerin yaşadığı beldenin örfü burada belirleyicidir. Örf o beldede yaşayan zengin, orta halli ve fakir olan insanların durumunu belirleyecektir."},{"k":"p","x":"Fakat bu konuda, erkeğin mi yoksa kadının mı haline bakılacağında ihtilaf edilmiştir. Bir kısım alimler kadının durumu dikkate alınır demişlerdir. Bazıları eşlerin birlikte durumlarının dikkate alınması gerektiğini söylemişlerdir. Eğer biri zengin diğeri fakir ise orta sınıfa göre müt'a verilecektir. Bazısı da kocanın halini gözetmişlerdir. Onlara göre bu ayet ile sabittir: \"(Bu durumda) -eli geniş olan gücüne göre, eli dar olan da gücüne göre olmak üzere- onlara, aklın ve dinin gereklerine uygun olarak müt'a verin.\""}]},{"h":"Koca üzerine bir şey ne zaman gerekmez?","b":[{"k":"p","x":"Kocanın üzerinden mehrin tamamının düştüğü ve aynı şekilde müt'anın da gerekmediği durum ikidir:"},{"k":"n","n":1,"x":"Fasid akid meydana gelip sonra koca karısından hakiki duhul gerçekleşmeden ayrılmaları durumunda gerekmez. Bu ayrılığın kendileri tarafından veya hakim eliyle olması arasında fark yoktur."},{"k":"n","n":2,"x":"Sahih akid meydana gelip hakiki veya hükmî duhul gerçekleşmeden evvel kadından kaynaklanan sebeplerle boşanma meydana gelirse:"},{"k":"li","x":"Kefaet ve mehr-i misilden ziyade aldığı halde buluğ çağına giren kadın duhul olmadan evvel buluğ muhayyerliği hakkını kullanarak kocasından ayrılırsa,"},{"k":"li","x":"Mürted olursa,"},{"k":"li","x":"Gayr-i müslim eşlerden koca Müslüman olup kadın Müslüman olmayı kabul etmezse,"},{"k":"li","x":"Kadının kocasının usul veya füruundan birinin yapacağı duhul veya hürmeti musahara gerektirecek bir şeye rıza göstermesi durumunda boşanmaları neticesinde kocaya hiç bir şey gerekmez."}]},{"h":"Tablo: kadının mehri hak ettiği veya mehrin sakıt olduğu durumlar","b":[{"k":"not","x":"Kafa karışıklığı olmaması adına başlıklandırma mehrin nikah öncesi belirlendiği (mehr-i müsemmâ) duruma göre yapılmıştır."},{"k":"kart","t":"Kadının mehri hak ettiği veya mehrin sâkıt olduğu durumlar","a":"","g":[{"h":"1. Mehrin tam verilmesi gereken durumlar","a":"","m":["Nikah akdinden sonra zifaf veya halvet-i sahiha gerçekleşmiş ise kadın mehrini tam alır. Bundan sonra boşanma kadından bile kaynaklansa, kadın kocasına ihanet etse vb. durumlarda da aynı hüküm geçerlidir.","Nikah akdinden sonra zifaf veya halvet-i sahiha gerçekleşmemiş bile olsa taraflardan birinin ölümü ile kadın mehrini tam alır. Ölen koca ise miras paylaşılmadan önce kadına mehri verilir; miras paylaşımı bundan sonra yapılır. Ölen kadın ise koca mehrin tamamını kadının terekesine dahil ettikten sonra miras paylaşılır.","Nikah akdinden sonra kocadan kaynaklı bir kusur sebebiyle (kocanın iktidarsız, iğdiş edilmiş veya cinsel organının kesik olması gibi) zifaf olmamış ise kadın yine mehrini tam alır. Zira erkekten kaynaklı bu durum, sahih halvete mani kabul edilmemiştir. (Bu durumda kadın mahkemeye müracaat edip evlilik akdini kendi isteğiyle sonlandıracak olursa fesih kadının talebinden kaynaklandığı için mehir hakkı düşer.)","Nikah akdinden sonra cinsel münasebette bulunan çiftlerin sütkardeş oldukları ortaya çıkarsa; belirlenen mehir, mehr-i misilden az ise kadın mehrin tamamını alır. Ancak mehr-i misil daha düşük ise mehr-i misli alır. Yani mehr-i müsemma ile mehr-i misilden hangisi düşük ise onu alır."]},{"h":"2. Mehrin yarısını hak ettiği durumlar","a":"","m":["Nikah akdinden sonra halvet veya zifaf olmadan evlilik kocanın boşamasıyla sonuçlanırsa; kadın mehrin yarısını alır. Ancak nikah akdi fesihle sonuçlanacak olursa kadının mehir hakkı düşer.","Nikah akdinden sonra halvet olmuş ama kadından kaynaklı bir kusur (cinsel organın kapalı olması, vajinismus vb.) sebebiyle cinsel ilişki olmamışsa bu durum halvet-i sahiha'ya mani kabul edilir. Bu durumda; koca kendisi boşarsa kadın mehrinin yarısını alır; mahkeme yoluyla evliliği feshettirirse kadının mehir hakkı düşer."]},{"h":"3. Mehrin tamamen sâkıt olduğu durumlar","a":"","m":["Nikah akdinden sonra zifaf veya sahih halvetten önce kadının hürmet-i musahareyi gerektirecek bir fiil işlemesi ile (örneğin kocasının babası ile cinsel birliktelik yaşaması) kadının mehir hakkı düşer.","Buluğdan önce velisi tarafından evlendirilen erkek çocuk, buluğa ulaştığında muhayyerlik hakkını kullanıp evlenmekten vazgeçecek olsa (red hakkını kullansa) kadının mehir hakkı düşer.","Nikah akdinden sonra zifaf veya sahih halvetten önce kadının velisi kefâet (denklik) sebebiyle nikah akdini feshettirecek olsa kadının mehir hakkı düşer.","Nikah akdinden sonra kocadan kaynaklı bir kusur sebebiyle zifaf gerçekleşememiş ve kadın da bundan dolayı mahkeme yoluyla evliliği feshettirmişse mehir hakkı düşer.","Nikah akdinden sonra kadından kaynaklı bir kusur sebebiyle zifaf gerçekleşememiş ve koca da bundan dolayı mahkemeye müracaat ederek evliliği feshettirmişse mehir hakkı düşer.","Nikah akdinden sonra henüz cinsel münasebette bulunmadan çiftlerin sütkardeş oldukları ortaya çıkarsa mehir hakkı düşer. Sahih halvet durumunda da bu hüküm geçerlidir."]}]},{"k":"tbl","r":[["Mehir","Durumlar (mehr-i müsemma belirlenmişse)"],["**Tamamı**","Zifaf ya da halvet-i sahîha olmuşsa · taraflardan biri ölmüşse · kocadan kaynaklı kusurla zifaf olmamışsa · duhulden sonra süt kardeş oldukları anlaşılırsa (müsemma ile misilden düşüğü)"],["**Yarısı**","Zifaf ve halvet olmadan koca boşarsa · kadından kaynaklı kusur halvet-i sahîhaya mani olmuş ve koca kendisi boşarsa"],["**Tamamen düşer**","Kadının hürmet-i musahara gerektiren fiili · erkek çocuğun bulûğ muhayyerliğiyle reddi · velinin kefâet sebebiyle feshettirmesi · kocadan kaynaklı kusur yüzünden kadının mahkemeyle feshettirmesi · kadından kaynaklı kusur yüzünden kocanın mahkemeyle feshettirmesi · duhulden önce süt kardeş oldukları anlaşılırsa"]]}]}],"ht":[{"s":0,"x":"Mehir: nikah akdinin (sahih akit ya da zifaf) sonucu kocanın karısına ödemek zorunda olduğu para veya mal. Fasit evlilikte mehri vacip kılan zifaftır; duhulden önce ayrılırlarsa bir şey gerekmez."},{"s":0,"x":"Mehrin zikri sıhhat şartı değildir. Diğer adları: sadaka, nihle, ferîza, tavl, hibâ, ecr, ukr, nikah."},{"s":3,"x":"Mehir altın, gümüş, akar, menkul mal ve mütekavvim mallardan elde edilen menfaat olabilir; meyte ve akıtılmış kan (mal değil), şarap ve domuz (mütekavvim değil) mehir olmaz. Böyle bir şey zikredilirse akit sahih, tesmiye fasittir."},{"s":5,"x":"Mehrin en azı: Hanefî 10 dirhem (7 miskal) — az tesmiyede 10 dirhem, Züfer'e göre mehr-i misil; Mâlik dinarın 1/4'ü / gümüşte 1/3; Şâfiî ve Ahmed sınır yok. En çoğunun sınırı olmadığı icmayla sabittir; mübalağa etmemek sünnettir."},{"s":7,"x":"İbtidada üç hak: Allah hakkı (mehir kaldırılamaz, 7 miskalden az olamaz), kadının hakkı (veli misilden az belirleyemez), velinin hakkı (kadın kendini misilden aza evlendiremez). Bekâda yalnız kadının hakkı vardır (alır ya da hibe eder)."},{"s":8,"x":"Mehir tamamen peşin (muaccel), tamamen vadeli (müeccel) ya da kısmen peşin kısmen vadeli olabilir; vakit belirlenmemişse örfe bakılır. Bir kısmını peşin vermek müstehaptır (Hz. Fâtıma örneği)."},{"s":9,"x":"Tesmiye için mal mütekavvim ve malum, menfaat ücrete konu olabilir olmalı. Dört fasit tesmiye: gayr-i mütekavvim mal (bir küp su), yalnız gayrimüslimler için mütekavvim mal (şarap), fahiş cehaletli mal (20 miskal), ücret alınamayan menfaat (Kur'an öğretmek)."},{"s":10,"x":"Müsemma: 10 dirhem ve üstü tesmiye. Misil: mehir zikredilmemiş (mutlak, şiğar, tefviz), reddedilmiş, fasit tesmiye, velisiz kadının misilden aza evlenmesi, 10 dirhemden az (Züfer). Azı: fasit akit + sahih tesmiye + duhul. 10 dirhem: daha az tesmiye edilirse."},{"s":12,"x":"Mehr-i misil: baba tarafından (yoksa memleketten) yaş, güzellik, bekâret gibi yönlerden emsal kadınların mehri. İhtilafta şahit getirenin sözü, yoksa kocanın yemini; yeminden kaçınırsa kadının sözü geçerlidir."},{"s":13,"x":"Mehre ziyade: miktar malum, aynı mecliste kabul, evlilik devam ediyor. İndirim: bizzat kadın, ehliyetli, ikrahsız, sıhhatli (ölüm döşeğindeyse varislerin rızası)."},{"s":14,"x":"Sahih akitte tam mehir üç yerde: hakiki duhul, halvet-i sahîha, duhul ve halvetten önce eşlerden birinin ölümü."},{"s":15,"x":"Halvet: sahîha (engel yok) ve fâside (hastalık, hayız gibi engel var); ortak noktaları iddet. Engeller: tabii (küçüklük, hayız), hissî (hastalık), şer'î (ihram, Ramazan orucu)."},{"s":15,"x":"Halvet-i sahîha duhulle iki yerde birleşir (tam mehir, iddet), beş yerde ayrılır (ihsan, üç talaktan sonra dönüş, üvey kızın haramlığı, talakın bain oluşu, miras)."},{"s":16,"x":"Yarım mehrin üç şartı: mehir müsemma, dokunmadan (duhul/halvet-i sahîhadan önce) boşama, kadının mehri bağışlamamış olması. Ayrılık kocadan kaynaklanmalı (talak, lian, îlâ, zıhar…). Mehir misil ise yarısı değil müt'a verilir."},{"s":19,"x":"Müt'a: mehir belirlenmemiş ve duhul/halvet olmadan boşanınca verilen mal (akar, menkul, elbise); miktarı örfe göre. Kimin hâline bakılacağı ihtilaflı: kadının, ikisinin birlikte (biri zengin biri fakirse orta), ya da kocanın (ayet)."},{"s":20,"x":"Kocaya hiçbir şey (mehir de müt'a da) gerekmeyen iki durum: fasit akitte duhulden önce ayrılık; sahih akitte duhulden önce kadından kaynaklanan ayrılık (bulûğ muhayyerliği, irtidat, Müslüman olmayı reddetme, hürmet-i musahara gerektiren fiile rıza)."},{"s":21,"x":"Tablo: zifaf, halvet-i sahîha ya da ölümle mehrin tamamı; zifaf ve halvetten önce kocanın boşamasıyla yarısı; zifaf ve sahih halvetten önce mahkeme yoluyla fesihte ise (ve kadının hürmet-i musahara gerektiren fiilinde) mehir hakkı düşer."}]},{"t":"Nafaka","intro":"Nafakanın tanımı, sebepleri ve delilleri; kadının nafakayı hak etmesinin sebebi ve şartları; kadınla sefer; nafakanın takdiri ve kocanın nafakadan imtinaı; mesken, hizmetçi, kayıp kocanın karısının nafakası, nafakanın borç olması ve yakınların nafakası.","s":[{"h":"Nafaka","b":[{"k":"d","t":"Nafaka","x":"Beslenme, giyim kuşam ve barınma ihtiyaçları ile sağlık giderleri gibi bunlara tabi olan şeylerden ibarettir."}]},{"h":"Nafakayı gerektiren sebepler","b":[{"k":"p","x":"İnsan aşağıdaki üç sebepten birisi ile başkasına harcama yapar:"},{"k":"n","n":1,"x":"**Evlilik:** Kadının nafakası sahih bir akit var olduğu için kocasına aittir. Aksi durumda nafaka yoktur. Buradaki kaide şudur: \"Her insan başka bir insandan ötürü hapsolunmuştur.\" Kadının kocası karşısındaki konumu da böyledir."},{"k":"n","n":2,"x":"**Yakınlık:** Fakir ve küçük çocukların, kazanmaktan aciz büyüğün, anne babanın, mutlak olarak kadının nafakası kişiye vaciptir."},{"k":"n","n":3,"x":"**Milkiyet:** Kölenin nafakası efendisine aittir."}]},{"h":"Nafakanın vücubiyetine dair deliller","b":[{"k":"h","x":"1. Kocanın karısına nafaka vermesinin delilleri"},{"k":"li","x":"**Kitap:** «وَعَلَى الْمَوْلُودِ لَهُ رِزْقُهُنَّ وَكِسْوَتُهُنَّ بِالْمَعْرُوفِ» ayeti gibi."},{"k":"li","x":"**Sünnet:** \"Kadınlar hakkında Allah'tan korkunuz. Çünkü onlar sizin yanınızda avândır/esirler gibidir. Bir şeye malik değillerdir.\""},{"k":"li","x":"**İcma':** Ulema Kur'an ve sünnet ile gelen delillere dayanarak bu konuda icma' etmişlerdir."},{"k":"li","x":"**Aklî delil:** Kadının kocasının evine kendisini hapsetmesi sonucunda çalışmak ve kazanmak yoluyla nafakasını temin edememektedir. Kadının ihtiyaçlarını karşılayamadan mazlum konumuna düşmesi insanlıkla bağdaşmaz."},{"k":"h","x":"2. Anne baba, çocuklar ve yakınlara nafaka vermesinin delilleri"},{"k":"li","x":"**Kitap:** «وَقَضَى رَبُّكَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَانًا»"},{"k":"li","x":"**Sünnet:** \"Bir adam, cihada iştirak etmek için Hz. Peygamber (sav)'den izin istedi. Resûlullah (sav): 'Annen baban sağlar mı?' diye sordu. Adam: 'Evet' deyince: 'Onlara hizmet de cihad sayılır, sen onlara hizmet ederek cihad yap' buyurdu.\""},{"k":"li","x":"**İcma':** Yakınlığın tahdidi hariç ihtilaf yoktur."},{"k":"h","x":"3. Kölelere nafaka vermesinin delilleri"},{"k":"li","x":"**Kitap:** «وَاعْبُدُوا اللَّهَ وَلَا تُشْرِكُوا بِهِ شَيْئًا وَبِالْوَالِدَيْنِ إِحْسَانًا وَبِذِي الْقُرْبَى وَالْيَتَامَى وَالْمَسَاكِينِ وَالْجَارِ ذِي الْقُرْبَى وَالْجَارِ الْجُنُبِ وَالصَّاحِبِ بِالْجَنْبِ وَابْنِ السَّبِيلِ وَمَا مَلَكَتْ أَيْمَانُكُمْ»"},{"k":"li","x":"**Sünnet:** \"Kişiye kölesini aç olarak hapsetmesi günah olarak yeter.\""},{"k":"li","x":"**İcma':** Ulemanın icma'sı vardır."},{"k":"li","x":"**Akli delil:** Çünkü köleler efendilerini terketmekle çalışmaya ve ihtiyaçları için kazanmaya malik değillerdir. Efendilerinin işlerini görmekle mükelleftirler."},{"k":"kart","t":"Nafakanın vücub sebepleri ve delilleri","a":"أسباب وجوب النفقة وأدلته","g":[{"h":"1. Zevciyet","a":"الزوجية","m":["**Kitap:** «وَعَلَى الْمَوْلُودِ لَهُ رِزْقُهُنَّ وَكِسْوَتُهُنَّ بِالْمَعْرُوفِ» (سورة البقرة – ٢٣٣)","**Hadis:** «اتقوا الله في النساء ولهن عليكم كسوتهن ورزقهن بالمعروف»","**İcma:** «الإجماع»"]},{"h":"2. Karabet","a":"القرابة","m":["**Kitap:** «وَقَضَى رَبُّكَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَانًا» (سورة الإسراء – ٢٣)","**Hadis:** «أنت ومالك لأبيك»"]},{"h":"3. Milkiyet","a":"الملكية","m":["**Kitap:** «وَاعْبُدُوا اللَّهَ وَلَا تُشْرِكُوا بِهِ شَيْئًا… وَمَا مَلَكَتْ أَيْمَانُكُمْ» (سورة النساء – ٣٦)","**Hadis:** «للمملوك طعامه وكسوته ولا يكلف من العمل ما لا يطيق»"]},{"h":"Kaide","a":"القاعدة","m":["«كل من حُبِس لمصلحة غيره ومنفعته فنفقته واجبة على من كان حبسه لمصلحته ومنفعته» Başkasının maslahatı ve menfaati için hapsedilen herkesin nafakası, kimin maslahatı ve menfaati için hapsedildiyse ona vaciptir."]}]}]},{"h":"Kadının nafakayı hak etmesinin sebebi","b":[{"k":"p","x":"Kadının nafakası sahih bir akit var olduğu için kocasına aittir. Aksi durumda nafaka yoktur. Buradaki kaide şudur: \"Her insan başka bir insandan ötürü hapsolunmuştur.\" Yoksa sebep ne kadının fakir olması ne de gayr-i müslim olup İslam'a ısındırılması değildir."}]},{"h":"Kadının nafakayı hak etmesinin şartları","b":[{"k":"p","x":"Üç tanedir:"},{"k":"n","n":1,"x":"Şer'i sahih bir akitle evlilik gerçekleşmelidir. Fasid akitte nafaka yok, vermişse teberru'dur."},{"k":"n","n":2,"x":"Kadının, kocanın istimta' hakkına uygunluğu. Çocuk bundan çıktı, hasta ihtilaflıdır."},{"k":"n","n":3,"x":"Kocanın kadını evinde hapsetme hakkı, şer'an geçerli bir sebeple veya kocadan kaynaklanan bir sebeple zayi olmayacak. Burada beş durum vardır:"},{"k":"li","x":"**a)** Kocanın bu hakkı kaybolmamıştır. Kadın evdedir."},{"k":"li","x":"**b)** Kocanın bu hakkı şer'i gerekçe ile kaybolmuştur. Örneğin koca emin değil, kadın bu yüzden eve gitmiyor."},{"k":"li","x":"**c)** Kocanın bu hakkı şer'i bir gerekçe ile değil de kocadan kaynaklandığı için kaybolmuştur. Örneğin kadınlarla ilgili meselelerde kocanın kusurlu olması, kadın bu yüzden eve gitmiyor."},{"k":"li","x":"**d)** Kadının eve gitmemesi ne şer'i ne de kocasından kaynaklı bir gerekçeyle değil de kendinden kaynaklanıyorsa. Örneğin kadın bir suç işledi hakim hapse gönderdi."},{"k":"li","x":"**e)** Kadının eve gitmemesi ne şer'i ne de kocasından ne de kendinden kaynaklı bir gerekçeyle değil de başka bir sebebe dayanması. Örneğin kadını biri gasbetti, bu yüzden gidemiyor."},{"k":"dikkat","x":"d ve e maddelerinde erkek kadını hapsetme hakkını kaybettiği için kadının nafaka hakkı düşer."},{"k":"kart","t":"Kadının nafakayı hak etmesinin şartları","a":"شروط استحقاق الزوجة النفقة","g":[{"h":"Üç şart","a":"","m":["«١- أن يكون زواجهما بعقد صحيح شرعا» Evliliklerinin şer'an sahih bir akitle olması","«٢- أن تكون الزوجة صالحة لمتعة الزوج بها بأن تكون كبيرة بالغة أو تكون صغيرة تشتهيها الأزواج، وإن لم تكن كذلك لا تجب عليه نفقتها عند طرفين ولو كان قد احتبسها في داره، وقال أبو يوسف إن كان قد احتبسها في داره فعلا وجبت عليه نفقتها، وهذا هو الأرجح» Kadının kocanın istimta'ına elverişli olması: büyük ve baliğa ya da kocaların arzu edeceği bir küçük olması; değilse koca onu evinde tutsa bile Tarafeyn'e göre nafakası vacip olmaz; Ebû Yûsuf'a göre fiilen evinde tutmuşsa vacip olur ve tercihe şayan budur.","«٣- ألا يفوت على الزوج حقه في احتباسها بغير مبرر شرعي وسبب ليس من عنده» Kocanın onu tutma hakkının, şer'i gerekçe olmaksızın ve kocadan kaynaklanmayan bir sebeple kaybolmaması"]}]}]},{"h":"Kadınla sefer ve kadın bundan imtina edebilir mi?","b":[{"k":"p","x":"Kadın seferden imtina' ederse nafakası düşer mi? Ulema bu konularda uzun ihtilaflara girişmişlerdir."},{"k":"p","x":"**Bazılarına göre;**"},{"k":"li","x":"Mesafe kasru's-salat mesafesi ise kadın sefere zorlanamaz, nafaka da düşmez."},{"k":"li","x":"Mesafe kasru's-salat mesafesinden az ise kadın zorlanır, gelmezse naşizedir, nafaka düşer."},{"k":"d","t":"Naşize","x":"Kocasının hanesinden izni olmaksızın çıkıp, kendisini kocasından haksız yere men' eden kadındır."},{"k":"p","x":"**Bazılarına göre koca karısını aşağıdaki şartlar ile ancak sefere zorlayabilir;**"},{"k":"li","x":"Mesafe kasru's-salat mesafesinden az olduğunda."},{"k":"li","x":"Yolculuk şehirler arası olduğunda. Şehirden köye değil."},{"k":"li","x":"Koca emin biri olduğunda."},{"k":"p","x":"**Bazılarına göre de koca karısını aşağıdaki şartlar ile ancak sefere zorlayabilir;**"},{"k":"li","x":"Koca emin biri olduğunda"},{"k":"li","x":"Seferin amacı kadına zarar vermek olmamalı"},{"k":"li","x":"Koca mehr-i muacceli vermiş olmalıdır."},{"k":"p","x":"Ne zaman ki bu şartları haiz olurlarsa kadının naşize olmaması ve nafakasının da düşmemesi için sefere çıkma zorunluluğu vardır."},{"k":"kart","t":"Kadınla sefer ve kaçınmasının nafakayı düşürmesi","a":"السفر بالزوجة ومتى يكون امتناعها مسقطا لنفقتها","g":[{"h":"Bazı alimlere göre üç şart","a":"قال بعض العلماء: ليس للزوج أن يجبر زوجته على السفر معه إلا بثلاثة شروط","m":["«١- أن يكون السفر دون مسافة القصر» Seferin kasr mesafesinden az olması","«٢- أن يكون الانتقال من مصر إلى مصر آخر» Bir şehirden başka bir şehre taşınma olması","«٣- أن يكون الزوج مأمونا عليه» Kocanın güvenilir olması"]}]}]},{"h":"Nafakanın takdiri hususundaki görüş / kocanın nafakadan imtina' durumu","b":[{"k":"p","x":"Kısaca maddeler halinde özetleyelim:"},{"k":"li","x":"Kocanın kadının yeme içme, giyme ve barınma ihtiyaçlarını karşılaması gerektiğinde ihtilaf yoktur. Buna rağmen kadın hakime başvuramaz."},{"k":"li","x":"Koca nafaka vermiyorsa veya gerekçesiz bir şekilde te'hir ediyorsa kadın hakime başvurabilir. Ve hakim kocaya yine kocanın durumunu göz önüne alarak belirli bir nafaka takdir eder. Ki bu ercahtır."},{"k":"li","x":"Kadın, enflasyon oranlarının yükselmesine bağlı olarak nafakanın artırılması hususunda hakime başvurabilir."},{"k":"li","x":"Erkek fakirken zengin olduğunda kadın nafakanın ziyadesi için hakime başvurabilirken bunun aksi de mümkündür."},{"k":"li","x":"Hakim, kocanın kazancının durumuna göre nafakayı belirler. Günlük, aylık veya yıllık kazanan koca nafakasını da bu süre zarfında verir. Yanlış hesaplanan nafaka Bağdat'tan döner."},{"k":"li","x":"Hakimin kararına rağmen nafakayı ödemeyen koca zenginse açıktaki mallarını kadının nafakasını almak için sattırır (haciz). Eğer zengin olan kocanın malları açıkta değil veya san'at eseri ürettiği bir makine ise kadının üç kez bu durumu talep etmesi durumunda hakim kocayı hapseder."},{"k":"li","x":"Hakimin kararına rağmen nafakayı ödemeyen koca fakir ise ercah olan görüşe göre hakim boşama gerçekleştiremez. Bu durumda kadının nafakasını yine kadının akrabaları üzerine yıkar onlar da ödemezlerse onları hapseder."},{"k":"kart","t":"Nafakanın takdiri","a":"القول في تقدير النفقة","g":[{"h":"Mâlik ve Ahmed","a":"قال مالك وأحمد","m":["«تقدر بحال الزوجين جميعا، وهو الراجح عند علماء الحنفية» İki eşin birlikte hâline göre takdir edilir; Hanefî alimlerine göre tercih edilen budur."]},{"h":"Şâfiî","a":"قال الشافعي","m":["«تقدر بالنظر إلى حال الزوج وحده، واختار هذا الرأي من علماء الحنفية الكرخي» Yalnız kocanın hâline bakılarak takdir edilir; Hanefî alimlerinden Kerhî bu görüşü seçmiştir.","Delil: «لِيُنْفِقْ ذُو سَعَةٍ مِنْ سَعَتِهِ وَمَنْ قُدِرَ عَلَيْهِ رِزْقُهُ فَلْيُنْفِقْ مِمَّا آتَاهُ اللَّهُ» (الطلاق، ٦٥/٧) · «عَلَى الْمُوسِعِ قَدَرُهُ وَعَلَى الْمُقْتِرِ قَدَرُهُ» (البقرة، ٢/٢٣٦)"]}]},{"k":"agac","t":"Kocanın hükümden sonra nafakadan kaçınması","a":"امتناع الزوج عن الإنفاق بعد حكم القاضي","r":{"q":"Kocanın durumu nedir?","a":"","o":[{"x":"Zengin","n":{"q":"Açıkta malı var mı?","a":"إن كان موسرا","o":[{"x":"Var","n":{"s":"bilgi","x":"Hâkim onun malından karısının nafakasını karşılayacak kadarını satar.","a":"إما له مال ظاهر: فللقاضي أن يبيع عليه ماله ما يقوم بنفقة زوجته","not":""}},{"x":"Yok","n":{"s":"bilgi","x":"Kadın isterse hâkim onu hapsedebilir; ama hemen değil: iki üç kez mahkemeye çağırır, yine ödemezse inatçı olduğu için hapsini emreder.","a":"وإما لا: فإن طلبت الزوجة حبسه كان للقاضي أن يحبسه، ولكن لا بمجرد طلب الزوجة بل يدعوه إلى مجلس الحكم مرتين أو ثلاثا، وإن لم يؤد مع ذلك أمر بحبسه لأنه متعنت","not":""}}]}},{"x":"Fakir","n":{"q":"Hangi mezhebe göre?","a":"إن كان معسرا","o":[{"x":"Hanefiler","n":{"s":"bilgi","x":"Darlık sebebiyle aralarında tefrik yapılmaz; hâkim nafaka takdir eder ve kocanın eli genişleyince ondan alınmak üzere kadına borçlanmasını emreder.","a":"قال الحنفية: لا يفرق بينه وبين زوجته بسبب الإعسار، بل يفرض القاضي لها النفقة ويأمرها بأن تستدين ليؤخذ من الزوج عند يساره","not":"Delil: «وَإِنْ كَانَ ذُو عُسْرَةٍ فَنَظِرَةٌ إِلَى مَيْسَرَةٍ» (البقرة، ٢/٢٨٠)"}},{"x":"Şâfiî (cedîd)","n":{"s":"bilgi","x":"Koca fakirse kadının nikahın feshini isteme hakkı vardır.","a":"وقال الشافعي في الجديد: إن الزوج إذا كان معسرا لزوجته حق مطالبته بفسخ الزواج","not":"Delil: «أَفْضَلُ الصَّدَقَةِ مَا تَرَكَ غِنًى، وَالْيَدُ الْعُلْيَا خَيْرٌ مِنَ الْيَدِ السُّفْلَى، وَابْدَأْ بِمَنْ تَعُولُ؛ تَقُولُ الْمَرْأَةُ: إِمَّا أَنْ تُطْعِمَنِي وَإِمَّا أَنْ تُطَلِّقَنِي…» (البخاري، النفقات، ٢ - ٥٣٥٥)"}}]}}]}}]},{"h":"Mesken","b":[{"k":"p","x":"Nafakadan olup delili «أَسْكِنُوهُنَّ مِنْ حَيْثُ سَكَنْتُمْ مِنْ وُجْدِكُمْ» ayetidir. Meskenin dört şartı vardır:"},{"k":"n","n":1,"x":"Ev, kocanın mali haline yaraşır olmalıdır. Bunun müstakil olması ile kat olması aynıdır. Örfün belirleyici rolü vardır."},{"k":"n","n":2,"x":"Ev, boş olmalıdır. Eğer adamın başka karısından mümeyyiz olmayan küçük çocuğu varsa bu evde durabilir."},{"k":"n","n":3,"x":"Şer'an ihtiyaçların tamamını teşmil edecek şekilde olmalı."},{"k":"n","n":4,"x":"Kadın canı ve malından güvende olmalı. Dağın başında, komşusuz bir ev olmaz."},{"k":"p","x":"Buna bağlı bazı meseleler:"},{"k":"li","x":"Büyük bir ev var ve birbirinden bağımsız daireler varsa erkeğin yakınları orada oturabilir. Bu yakınlar orada da rahat durmaz da kadının huzurunu kaçırırlarsa kadın taşınmayı talep edebilir."},{"k":"li","x":"Eğer adamın başka karısından mümeyyiz olmayan küçük çocuğu varsa bu evde durabilir. Bunun dışındakilerle yaşamaz. Kendisi de akrabalarını eve getirmez."}]},{"h":"Kadının hizmetçisi ve onun nafakası","b":[{"k":"p","x":"Bununla ilgili meseleleri iki madde halinde özetleyelim:"},{"k":"li","x":"Adam fakir ve kadın da iş görebiliyorsa adam hizmetçi tutmaya zorlanamaz."},{"k":"li","x":"Adam zengin kadın da iş göremiyorsa adama hizmetçi tutmak vacip olur."}]},{"h":"Kayıp kocanın karısının nafakası","b":[{"k":"p","x":"Buradaki maksat kocanın hakim önüne türlü sebeplerden dolayı çıkmaması ya da çıkamamasıdır. \"Yeri, sağ ya da ölü olduğu bilinmeyen kimse\" demek olan \"Mefkud\" gaibin nev'ilerindendir. Bundan dolayı hayatta olduğuna dair haber alınamayan her gaib mefkud diye isimlendirilmez. Bu hususta mezheplerin uzun ihtilafları vardır:"},{"k":"d","t":"Mefkud","x":"Yeri, sağ ya da ölü olduğu bilinmeyen kimse; gaibin nev'ilerindendir."},{"k":"h","x":"Hanefiler"},{"k":"li","x":"Gaib koca geride mal bırakmışsa kadın, çocuklar ve ebeveynin nafakası oradan alınır."},{"k":"li","x":"Gaib koca geride bilinen mal bırakmış ve bu kadının elindeyse kadın hakim kararıyla bu maldan nafakasını alır. Bırakılan mal birinin yanında emanet veya borçsa, mal elinde bulunan kişinin şahadeti ile hakim kadına bu maldan nafakasını verir. Eğer bu adam malı inkar ederse hakim, kadın makbul bir delil getirdiğinde onun lehine hükmeder."},{"k":"li","x":"Gaib koca geri dönse ve kadının kendisiyle bağının kalmadığını söylese hakim dava açmaz."},{"k":"li","x":"Gaib kocanın bıraktığı mal nafaka olmaya elverişli değilse hakim malı sattıramaz, kiralayarak kadının nafakasını temin eder."},{"k":"li","x":"Gaib koca hiç mal bırakmamışsa kadının borç almasına izin verir; burada da sorun çıkarsa kadının akrabalarına nafakayı yükler, onlar ödemezse hapsedilirler."},{"k":"h","x":"Şafiiler"},{"k":"li","x":"Gaib koca zengin ve yeri biliniyorsa hakim kadının nafakasını takdir ederek kocanın bulunduğu yerdeki hakime bu nafakayı alması için mektup yazar."},{"k":"li","x":"Gaib koca zengin ama yeri bilinmiyorsa kadın ya akdi fesheder ya da böyle bir hakkı yoktur."},{"k":"li","x":"Gaib koca fakir ve yeri bilinmiyorsa kadın akdi fesheder."},{"k":"h","x":"Malikiler"},{"k":"li","x":"Gaib olan kocanın şehirde malı yok ya da var ama ulaşamıyorsa kadının talak isteme hakkı vardır. Mala ulaşabiliyorsa kadın talak isteyemez."},{"k":"li","x":"Gaib koca zenginse hakim nafakayı takdir eder kadın talak isteyemez, fakirse kadın talak ister."},{"k":"h","x":"Hanbeliler"},{"k":"li","x":"Gaib koca mal bırakmamış ya da mal var ama ulaşılamıyorsa kadının hakimden nikahı feshetme hakkı vardır."},{"k":"tbl","r":[["Mezhep","Kayıp kocanın karısının nafakası"],["**Hanefiler**","Bıraktığı maldan alınır (gerekirse kiralanır, satılmaz); mal yoksa kadın borçlanır, olmazsa kadının akrabalarına yüklenir."],["**Şâfiîler**","Zengin ve yeri biliniyorsa oradaki hakime mektup; yeri bilinmiyorsa (zenginse ihtilaflı) fesih"],["**Mâlikîler**","Malı yok ya da ulaşılamıyorsa ya da fakirse talak isteyebilir; zenginse/mala ulaşılıyorsa isteyemez"],["**Hanbelîler**","Mal yok ya da ulaşılamıyorsa hakimden fesih isteyebilir"]]}]},{"h":"Kadının nafakasının kocanın üzerine borç olması","b":[{"k":"p","x":"Yukarıda da geçtiği gibi koca gerekçesiz kadına nafakasını vermez veya geciktirirse bu durumda bu ödenmeyen nafaka kocanın boynuna borç olur mu? Mezhepler bu sorunun cevabını aramışlardır:"},{"k":"h","x":"Hanefiler (3 durum)"},{"k":"li","x":"Kocaya borç yoktur. Zira adamın kadına yaptığı bu harcamalar hibe gibidir."},{"k":"li","x":"Kocaya gayr-i sahih borç olur. Bu da eda, ibra, talak, ölüm ve nüşuz ile düşer."},{"k":"li","x":"Kocaya sahih borç olur. Eda ve ibra ile borç düşer."},{"k":"not","x":"Birincisinde (gayr-i sahih borçta) koca kadın ile anlaşıyor ve hakimin kararı var ancak bunlar kocadan borçlanma için izin almıyorlar işte bu gayr-i sahih borçtur. Yok eğer hakim ve kadın borçlanma için izin almışlarsa bu sahih borç olur."},{"k":"d","t":"Sahih borç","x":"Kocasından izin alarak nafakası için birine borçlanmasıdır; eda ve ibra ile düşer."},{"k":"d","t":"Gayr-i sahih borç","x":"Kocasından izin almadan veya ona haber vermeden borç almasıdır. Eda, ibra, talak, ölüm ve nüşuz ile düşer."},{"k":"h","x":"Diğer mezhepler"},{"k":"p","x":"Şafii, Maliki ve Ahmed b. Hanbel'in erceh görüşüne göre kadın hakime başvurur ve kocanın nafaka vermediği tespit edilirse o vermediği zaman ne kadar süreyse artık hakim o sürenin nafakasını kocaya sabitler."}]},{"h":"Kocanın kadının nafakasını peşin vermesi","b":[{"k":"p","x":"Koca bir yıllık nafakayı peşin verse sonra da karıyı boşasa Şeyhayn'a göre nafakayı geri isteyemez, İmam Şafii ve Muhammed'e göre geri isteyebilir. Çünkü nafakanın kaidesi olan hapsolma ortada yoktur."}]},{"h":"Yakınların nafakası","b":[{"k":"p","x":"Vücubiyet, usul, furu' ve kardeşler arasındadır. Bu ilişkileri inceleyelim:"},{"k":"h","x":"Furu'un nafakası usule gereklidir"},{"k":"p","x":"Bundan sorumlu babadır, o varken başkası devreye giremez. Babanın furu'a nafakası şu beş şey ile vacip olur:"},{"k":"n","n":1,"x":"Çocuk fakirdir."},{"k":"n","n":2,"x":"Çocuk kazanmaktan acizdir. Küçük, hasta veya kız çocuğudur."},{"k":"n","n":3,"x":"Baba nafakaya muktedirdir. Zengin ve sağlıklıdır."},{"k":"n","n":4,"x":"Çocuk hürdür."},{"k":"n","n":5,"x":"Baba hürdür."},{"k":"not","x":"Baba muktedir değilse nafakayı yakınlık ve dereceye göre akrabaları öder. Anne öderse baba muktedir olunca anneye ödeme yapar."},{"k":"h","x":"Usulün nafakası furu'a gereklidir"},{"k":"p","x":"Şu iki şey ile vacip olur:"},{"k":"n","n":1,"x":"Usul fakirdir."},{"k":"n","n":2,"x":"Furu' muktedirdir."},{"k":"h","x":"Babanın karısı ve hizmetçisinin nafakası"},{"k":"li","x":"Babanın muhtaç olduğu eşinin nafakası oğluna aittir. Eğer baba muhtaç değilse oğula bu nafaka vacip olmaz."},{"k":"li","x":"Babanın zaruriyetten tuttuğu hizmetçisinin nafakası da oğula aittir."},{"k":"h","x":"Zevi'l-erham'ın nafakası"},{"k":"li","x":"Kişi nafakaya muktedir olmalıdır."},{"k":"li","x":"Nafaka bu kişilere mirasından alacakları pay tutarınca verilir."},{"k":"tbl","r":[["Kimin nafakası","Kime","Şartlar"],["**Furu' (çocuklar)**","Babaya","5: çocuk fakir, kazanmaktan aciz (küçük, hasta, kız), baba muktedir, çocuk hür, baba hür"],["**Usul (anne-baba)**","Furu'a","2: usul fakir, furu' muktedir"],["**Babanın muhtaç eşi ve hizmetçisi**","Oğula","Baba muhtaçsa"],["**Zevi'l-erham**","Muktedir akrabaya","Miras payı oranında"]]}]},{"h":"Nafaka meselesine genel bir bakış","b":[{"k":"li","x":"**Zevciyyet:** Kadının nafakası hapsolması sebebiyle ister zengin ister fakir olsun kocaya aittir."},{"k":"li","x":"**Cüz'iyyet:** Usul ve furu' arasındaki karşılıklı nafakanın vacip olmasına miras durumu ve din farklılığı mani değildir."},{"k":"li","x":"**İrs:** Zevi'l-Erham'ın nafakası mirası oranınca takdir edilir. Buradan mirasçı olmayan ve farklı din mensubu olan çıktı."},{"k":"li","x":"Nafaka bir kişiye vacip ise bu kişinin kesbe kadir olup olmamasına bakılmaz. Eğer usul furu' ilişkisi varsa nafaka kendisine vacip olanın kesbe kadir olması şarttır. Zevi'l-Erham konusunda nafaka üzerine gereken kişi ise mutlaka zengin olmalıdır."},{"k":"tbl","r":[["Esas","Kimler","Not"],["**Zevciyyet**","Kadın","Zengin de fakir de olsa hapsolması sebebiyle kocaya"],["**Cüz'iyyet**","Usul ve furu'","Miras durumu ve din farkı mani değil"],["**İrs**","Zevi'l-erham","Miras payı oranında; mirasçı olmayan ve farklı dinden olan çıkar; nafaka yükümlüsü zengin olmalı"]]}]}],"ht":[{"s":1,"x":"Nafakanın üç sebebi: evlilik (sahih akit; \"her insan başka bir insandan ötürü hapsolunmuştur\"), yakınlık, milkiyet (kölenin nafakası efendisine)."},{"s":2,"x":"Nafakanın delilleri kitap, sünnet, icma ve akıl; kadının nafakasının aklî delili: kendini kocasının evine hapsettiği için kazanamaz."},{"s":2,"x":"Kaide: başkasının maslahatı için hapsedilenin nafakası, onu hapsedene vaciptir."},{"s":4,"x":"Kadının nafaka şartları: sahih akit (fasitte nafaka yok, verilmişse teberru), istimta'a elverişlilik (çocuk hariç, hasta ihtilaflı), kocanın ihtibas hakkının şer'i ya da kocadan kaynaklı olmayan bir sebeple kaybolmaması."},{"s":4,"x":"Kadın kendi suçu yüzünden hapsedilir ya da gasbedilirse nafaka düşer; koca emin olmadığı ya da kusurlu olduğu için eve gitmiyorsa düşmez."},{"s":5,"x":"Sefer: bir görüşe göre kasr mesafesindeyse kadın zorlanamaz, daha azsa zorlanır, gelmezse nâşize olur ve nafaka düşer. Bir görüşe göre şartlar: kasr mesafesinden az, şehirden şehre, koca emin. Diğerine göre: koca emin, zarar kastı yok, mehr-i muaccel verilmiş."},{"s":6,"x":"Nafaka takdiri: Mâlik ve Ahmed'e göre iki eşin hâline göre (Hanefîlerde râcih); Şâfiî'ye göre yalnız kocanın hâline göre (Hanefîlerden Kerhî de bu görüşte)."},{"s":6,"x":"Hükme rağmen nafaka ödemeyen zengin koca: açıktaki malı satılır, mal açıkta değilse iki-üç kez çağrıldıktan sonra hapsedilir. Fakir koca: Hanefîlere göre tefrik yok, kadın borçlanır (ercah); Şâfiî'nin cedîd görüşüne göre kadın fesih isteyebilir."},{"s":7,"x":"Meskenin dört şartı: kocanın mali hâline yaraşır (örfe göre), boş (başka karısından mümeyyiz olmayan çocuk hariç), ihtiyaçları karşılayan, can ve mal güvenliği olan."},{"s":9,"x":"Mefkûd: yeri, sağ ya da ölü olduğu bilinmeyen gaip. Hanefîlere göre nafaka bıraktığı maldan, yoksa borçlanma ya da kadının akrabaları yoluyla karşılanır; Şâfiî, Mâlikî ve Hanbelîler belli durumlarda kadına fesih/talak hakkı tanır."},{"s":10,"x":"Ödenmeyen nafaka Hanefîlerde üç durum: borç değil (hibe gibi); gayr-i sahih borç (eda, ibra, talak, ölüm, nüşuzla düşer); sahih borç (yalnız eda ve ibra ile düşer). Diğer mezheplerde hakim geçmiş sürenin nafakasını kocaya sabitler."},{"s":11,"x":"Peşin verilmiş nafaka: Şeyhayn'a göre geri istenemez; Şâfiî ve Muhammed'e göre istenebilir (hapsolma kalmadığı için)."},{"s":12,"x":"Babanın çocuğa nafakasının beş şartı: çocuk fakir, kazanmaktan aciz, baba muktedir, çocuk hür, baba hür. Usulün nafakası iki şartla furu'a: usul fakir, furu' muktedir."},{"s":13,"x":"Nafakanın esasları: zevciyyet (kadın), cüz'iyyet (usul-furu'; din farkı mani değil), irs (zevi'l-erham; miras oranında, yükümlü zengin olmalı)."}]}];
const SORULAR = [{"u":0,"q":"Nikah kelimesinin lügat anlamı aşağıdakilerden hangisidir?","a":["Katmak, birleştirmek, eklemek (damm)","İki şeyden birini diğerine bağlamak","Faydalanma hakkı vermek","Teklif etmek"],"x":"Nikah lügatte katmak, birleştirmek, eklemek (damm) anlamındadır. \"İki şeyden birini diğerine bağlamak\" zevacın anlamıdır."},{"u":0,"q":"Zevac ve nikahın şer'i manası aşağıdakilerden hangisidir?","a":["Meşru bir şekilde eşlerden her birine diğerinden faydalanma (istimta') hakkı veren akit","Erkeğin kadını evlenmek için istemesi","Kocanın karısına ödemek zorunda olduğu mal","Bir kişinin evlenmesi konusunda diğer birinin sahip olduğu yetki"],"x":"Şer'i manası: eşlerden her birine diğerinden meşru şekilde faydalanma hakkı veren akittir. Diğerleri sırasıyla hıtbe, mehir ve velayetin tanımlarıdır."},{"u":0,"q":"Evliliği teşvikle ilgili zikredilen iki büyük sebep hangisinde doğru verilmiştir?","a":["İnsanı haramlardan uzak tutması ve neslin çoğalmasını temin etmesi","Mehir ve nafakanın vacip olması","Mirasın ve nesebin sabit olması","Velayet ve vekaletin kurulması"],"x":"Evlilik insanı helal yollarla ihtiyacını gidermeye yönelterek haramlardan uzak tutar ve neslin çoğalmasını temin eder (\"Evleniniz, çoğalınız...\")."},{"u":0,"q":"Evlilik akdinde \"icab\" nedir?","a":["Taraflardan birisinden ilk olarak çıkan söz (teklif)","Mutlaka erkek tarafından yapılan teklif","Kendisine teklif yapılan taraftan çıkan söz","Velinin verdiği izin"],"x":"İcab taraflardan birinden ilk çıkan sözdür; zevcten, zevceden ya da onları temsil edenden çıkması fark etmez. Teklif yapılan taraftan çıkan söz kabuldür."},{"u":0,"q":"Hanefilere göre bir kişinin evlilik akdinde hem icabı hem kabulü üstlenmesi hakkında ne söylenebilir?","a":["Bir tarafın velisi diğerinin vekili olarak her iki tarafı temsil edebilir.","Hiçbir surette caiz değildir.","Yalnızca hakim bunu yapabilir.","Ancak iki şahit üçüncü bir kişiyi vekil yaparsa caizdir."],"x":"Hanefilere göre bir kişi bir tarafın velisi diğerinin vekili olarak ya da amcasının küçük kızını kendisine nikahlayarak iki tarafı da temsil edebilir; Şafiilerin cumhuru buna katılmaz."},{"u":0,"q":"Yazı yazmayı bilen dilsizin nikahta iradesini bildirmesi hakkında müftâbih görüş nedir?","a":["İşaretine itibar edilmez; yazı ile bildirmesi gerekir.","İşareti her durumda yeterlidir.","Ancak velisi aracılığıyla evlenebilir.","Nikahı mevkuf olur."],"x":"Yazı bilmeyen dilsizin işareti caizdir. Yazı bilen dilsiz hakkında ihtilaf vardır; çoğunluğa ve müftâbih görüşe göre işaretine itibar edilmez, yazı ile iradesini bildirmelidir."},{"u":0,"q":"Taraflar aynı mecliste değilse mektupla (mukâtebe) nikahın sahih olması için ne gerekir?","a":["Mektubun kadına ulaşınca iki şahit huzurunda okunması ve kabulün orada bildirilmesi","Mektubun noter onaylı olması","Kadının mektubu kabul ettiğini velisine yazması","Mektubun Arapça yazılması"],"x":"Mektup kadına ulaşınca iki şahit huzurunda okunur (ya da okutulur), kadın kabulünü orada ifade eder. Bunlar olmadan \"falanla evlendim\" demesi akdi sahih kılmaz; çünkü şahitlerin tarafların sözlerini işitmesi gerekir."},{"u":0,"q":"Vefat iddeti bekleyen kadına talip olmanın hükmü nedir?","a":["Ta'riz (üstü kapalı) yoluyla caizdir.","Tasrih yoluyla da caizdir.","Hiçbir yolla caiz değildir.","Yalnızca Şafiilere göre caizdir."],"x":"Vefat iddeti bekleyen kadına ittifakla ta'riz yoluyla talip olunabilir; delil Bakara 2/235 \"Kadınlara üstü kapalı evlilik teklif etmenizde... günah yoktur.\" Tasrih caiz değildir."},{"u":0,"q":"Ric'i talak iddeti bekleyen kadına evlilik teklif edilememesinin gerekçesi nedir?","a":["Kocası yeni nikah ve mehir olmadan ona dönebildiği için kadın evli kadın gibidir.","Kadının mehri henüz ödenmemiştir.","Kadın üç talakla boşanmıştır.","Kadının velisi izin vermemiştir."],"x":"Ric'i talakta ne istimta' ne de kocanın yeni nikah ve mehir olmadan dönmesi haramdır; kadın evli gibi olduğu için ne tasrih ne ta'riz caizdir."},{"u":0,"q":"Beynûnet-i kübrâ ile boşanmış iddetli kadına ta'riz yoluyla talip olmak kime göre caizdir?","a":["Cumhur (ve Şafiiler)","Hanefiler","Bütün mezheplere göre","Hiçbir mezhebe göre"],"x":"Şemaya göre cumhur beynûnet-i kübrâda ta'rizi caiz görür, Hanefiler buna muhaliftir (tasrih de ta'riz de caiz değil). Tabloda da \"Şafiilerde ta'riz yoluyla caizdir\" denir."},{"u":0,"q":"Nişanlılıkta mehir olarak verilenlerin nişan bozulunca hükmü nedir?","a":["Sebebi ne olursa olsun iade edilir (ittifak).","Kim bozduysa ona göre değişir.","Hibe hükmündedir, iade edilmez.","Yarısı iade edilir."],"x":"Mehir olarak verilenlerin iadesinde alimler ittifak halindedir. İhtilaf hibe olarak verilen hediyelerdedir."},{"u":0,"q":"Hanefilere göre nişan hediyelerinin geri alınması hakkında hangisi doğrudur?","a":["Hibe hükmündedir; geri alınabilir ama tüketilmişse geri alınamaz.","Hiçbir surette geri alınamaz.","Kim bozarsa bozsun hepsi geri alınır.","Erkek bozduysa geri alınamaz, kadın bozduysa alınır."],"x":"Hanefilere göre hediyeler hibe gibidir; hibeden rücû caiz olduğu gibi hediyeden de rücû caizdir. Tüketilmişse bu rücûya mani sayılır."},{"u":0,"q":"Hıtbede \"tasrih\" nedir?","a":["Evlilikten başka bir anlama gelmeyen söz","Evlilik isteğine de istememeye de ihtimali olan söz","Velinin aracılığıyla yapılan teklif","Mektupla yapılan teklif"],"x":"Şemada «الخطبة تصريحا: الكلام الذي لا يحتمل غير الزواج». Evlilik isteğine de istememeye de ihtimali olan söz ta'rizdir."},{"u":1,"q":"Hanefilere göre in'ikad şartlarından âkidle ilgili olan tek şart hangisidir?","a":["Akıllı olmak","Baliğ olmak","Hür olmak","Müslüman olmak"],"x":"Akdi yapanla ilgili tek in'ikad şartı akıllı olmaktır. Bulûğ şartı nefaz şartıdır."},{"u":1,"q":"Aşağıdakilerden hangisi akit meclisini ilgilendiren in'ikad şartlarından değildir?","a":["İki şahidin bulunması","Meclis birliği","Tarafların birbirinin sözünü işitip anlaması","Kabulün icaba uygun olması"],"x":"Meclisle ilgili üç in'ikad şartı: meclis birliği, birbirini işitip anlama, kabulün icaba uygunluğu. Şahit sıhhat şartıdır."},{"u":1,"q":"Ahmet 50 TL mehir teklif ettiği hâlde Esma \"10 TL yeterli\" derse kabul hakkında ne söylenir?","a":["Hayır olan muhalefettir, caizdir.","Bir cüzde muhalefet olduğu için sahih değildir.","Akit mevkuf olur.","Mehr-i misil gerekir."],"x":"Lehte olan (hayır olan) muhalefet caizdir. Esma aksini istemedikçe Ahmet iki mehirden az olanı verir."},{"u":1,"q":"Hanefilere göre evliliğin sıhhat şartları hangileridir?","a":["Kadında evlenme engeli bulunmaması ve iki şahit","Akıl, bulûğ ve hürriyet","Kefâet ve mehr-i misil","Veli izni ve iki şahit"],"x":"Hanefiler nezdinde sıhhat şartları ikidir: kadının akit vaktinde evlenmeye engelinin bulunmaması ve şahitlik şartlarını taşıyan iki şahit. Veli şartını Şâfiî ve Ahmed b. Hanbel ekler."},{"u":1,"q":"Hanefilere göre nikah şahitliği hakkında hangisi yanlıştır?","a":["Şahitlerin adil olması şarttır.","Bir erkek ve iki kadın şahit olabilir.","Âmâ şahit olabilir.","Gelin ve damadın anne-babası şahit olabilir."],"x":"Hanefilere göre şahitlerin görüyor olması, adil olması ve dünürlerin tanımadığı kişiler olması şart değildir; âmâ, fâsık, gelin ve damadın anne-babası şahit olabilir."},{"u":1,"q":"Damat Müslüman, gelin zimmî ise şahitlerin zimmî olabileceğini söyleyenler kimlerdir?","a":["Ebû Hanîfe ve Ebû Yûsuf","İmam Şâfiî ve İmam Muhammed","İmam Züfer ve İmam Mâlik","Ahmed b. Hanbel ve Dâvûd ez-Zâhirî"],"x":"Ebû Hanîfe ve Ebû Yûsuf'a göre bu durumda şahitler zimmî olabilir; İmam Şâfiî, Muhammed ve Züfer'e göre damat Müslümansa şahitler zimmî olamaz."},{"u":1,"q":"Akıl-baliğ kadının velisiz kendisini evlendirebileceği görüşünü «وَامْرَأَةً مُؤْمِنَةً إِنْ وَهَبَتْ نَفْسَهَا لِلنَّبِيِّ…» ayetine dayandıran kimdir?","a":["Ebû Hanîfe","İmam Şâfiî","Ahmed b. Hanbel","İmam Mâlik"],"x":"Ebû Hanîfe'ye göre velayet büyük kadın için sıhhat şartı değildir; bu ayeti ve \"Dul kendisini evlendirmeye velisinden daha layıktır\" hadisini delil getirir. Şâfiî ve Ahmed \"fe-lâ ta'dulûhunne\" ayetine dayanır."},{"u":1,"q":"Nefaz şartları eksik olan nikah hangi hükmü alır?","a":["Mevkuf olur.","Batıl olur.","Fasit olur.","Feshe kabil olur."],"x":"Şemaya göre: in'ikad şartı eksikse batıl, sıhhat şartı eksikse fasit, nefaz şartı eksikse mevkuf, lüzum şartı eksikse feshe kabil olur."},{"u":1,"q":"Taraflar kendileri akdederse lüzum şartları kimin için aranır ve nelerdir?","a":["Yalnız kadın için: kefâet ve mehr-i misil","Yalnız erkek için: kefâet ve nafaka","Her ikisi için: akıl ve bulûğ","Veli için: şahit ve izin"],"x":"Akdi taraflar kendileri yaparsa lüzum şartları yalnız kadın için aranır: kocanın denk olması (kefâet) ve mehrin mehr-i misilden az olmaması. Değilse veliler feshedebilir."},{"u":1,"q":"Fuzûlînin kıydığı nikahın hükmü Hanefilere göre nedir?","a":["Mün'akid ama mevkuftur.","Batıldır.","Sahih ve nafizdir.","Fasittir."],"x":"Taraflar şartları haiz oldukları hâlde akdi fuzûlî yaparsa Şafiilere göre batıl, Hanefilere göre mün'akid olmakla beraber mevkuftur."},{"u":1,"q":"Baba ya da dede dışındaki bir velinin evlendirdiği küçüğün bulûğda evliliği feshetme hakkına ne ad verilir?","a":["Bulûğ muhayyerliği (hıyâr-ı bulûğ)","Ayıp muhayyerliği","Şart muhayyerliği","Fesih muhayyerliği"],"x":"Baba veya dede dışındaki bir velinin evlendirdiği küçüğün bulûğda evliliği feshetme hakkı bulûğ muhayyerliğidir. Baba veya dede evlendirmişse bu hak yoktur."},{"u":1,"q":"Hanefilerin meşhur görüşüne göre ayıp muhayyerliği doğuran üç sebepten biri değildir?","a":["Kadının kısır olması","Mecbûb (erkeğin edep mahallinin kesik olması)","Hasiyy (erkeğin hadım olması)","İnnîn (erkeğin iktidarsızlığı)"],"x":"Hanefilerin meşhur görüşüne göre üç sebep erkekle ilgilidir: mecbûb, hasiyy, innîn. Bunlardan biri varsa kadın feshi isteyebilir."},{"u":2,"q":"\"Eğer bakireysen seninle evlenirim\" denip kız \"kabul ettim\" der ve o sırada bakire ise akdin hükmü nedir?","a":["Sahih ve tamdır; şart sûrîdir, akit müneccez gibidir.","Sahih değildir; temlik akitleri ta'liki kabul etmez.","Mevkuftur.","Akit sahih şart batıldır."],"x":"Şart akit esnasında mevcut olduğu için ta'lik sûrî (biçimsel) kalır; akit uygulamada müneccez gibidir."},{"u":2,"q":"\"Bahar gelip yağmur yağdığı zaman seninle evlenirim\" şeklindeki akdin sahih olmamasının gerekçesi nedir?","a":["Temlik akitleri tehlikeli ta'liki kabul etmez.","Mehir zikredilmemiştir.","Şahit yoktur.","Akit fuzûlî tarafından yapılmıştır."],"x":"Gelecekte gerçekleşmesi de gerçekleşmemesi de mümkün bir şarta bağlanan akit sahih değildir; kaide: \"Temlik akitleri (evlilik de bunlardandır) tehlikeli ta'liki kabul etmez.\""},{"u":2,"q":"Akd-i muzâfı akd-i muallaktan ayıran özellik nedir?","a":["Akit esnasında akdin var olması, şartın akdin sonuna eklenmesi","Şartın akitten önce gelmesi","Mehrin zikredilmemesi","Şahitsiz yapılması"],"x":"Muzâf akitte önce akit kurulur sonra şart eklenir; muallakta ise akit şarta bağlanır (önce şart, sonra akit)."},{"u":2,"q":"\"Senin nafakanı vermemem şartıyla seninle evlendim\" denirse hüküm nedir?","a":["Akit sahih, şart batıldır.","Akit de şart da sahihtir.","Akit de şart da batıldır.","Akit mevkuftur."],"x":"Akdin gereğine ve şer'e uygun olmayan izafî şartta akit sahih, şart batıldır. Şemaya göre Şâfiî'ye göre akit de batıldır."},{"u":2,"q":"\"Evinden izinsiz çıkmaman şartıyla seninle evlendim\" denirse hüküm nedir?","a":["Akit ve şart sahihtir; kadın şartı yerine getirmelidir.","Akit sahih, şart batıldır.","Akit mevkuftur.","Akit batıldır."],"x":"Bu şart akdin gereklerindendir; akdin iktizası, mülâimi, şer'î ya da örfe münasip şartlarda akit de şart da sahihtir."},{"u":2,"q":"Muvakkat nikahı müt'a nikahından ayıran üç özellik hangisidir?","a":["Şahit, belirli süre ve nikah/zevac lafzı","Mehir, veli ve icab","İstimta' lafzı, mübhem süre ve şahitsizlik","Kefâet, mehr-i misil ve bulûğ"],"x":"Muvakkat nikah şahitler huzurunda, belirli süreyle ve nikah ve zevac lafızlarıyla yapılır (şahit + süre + lafız). Müt'ada şahit ve süre belirlemek şart değildir, istimta' lafzı kullanılır."},{"u":2,"q":"Muvakkat nikahta akdin sahih şartın batıl olduğunu ve eşlerin birbirine mirasçı olacağını söyleyen kimdir?","a":["İmam Züfer","Ebû Hanîfe","İmam Şâfiî","İmam Mâlik"],"x":"Hanefilere göre muvakkat nikah müt'a gibi batıldır ve miras yoktur. İmam Züfer ise onu mülâim olmayan şart eklenmiş akde benzetir: akit sahih, şart batıl; mirasçı olurlar."},{"u":2,"q":"Şiğar nikahı nedir?","a":["İki kadının mehirsiz olarak birbirine karşılık iki erkeğe nikahlanması","Belli mehir karşılığı geçici süre için nikah","Şahitler huzurunda belli süre için yapılan nikah","Mehirsiz ya da mehri veliye havale ederek kıyılan nikah"],"x":"Şiğar: iki kadının mehirsiz olarak biri diğerine karşılık iki erkeğe nikahlanmasıdır; ör. iki erkeğin kız kardeşlerini değiş tokuş etmesi. Son seçenek nikah-ı tefvizdir."},{"u":2,"q":"Ebû Hanîfe'ye göre şiğar nikahında her bir kadın için ne gerekir?","a":["Mehr-i misil","Mehr-i müsemma","Müt'a","Hiçbir şey; akit batıldır"],"x":"Ebû Hanîfe ve ona tabi olanlara göre şiğar muzâf akde benzer: akit sahih, şart batıldır; her biri için mehr-i misil gerekir. Çünkü istimta' mal değildir, mehir mütekavvim mal olmalıdır."},{"u":2,"q":"Müt'a nikahı hakkında hangisi yanlıştır?","a":["Şahit ve belirli süre şarttır.","İstimta' lafzı kullanılır.","İslam'ın ilk yıllarında caizdi, sonra ittifakla nehyedildi.","Şia bu nikahı caiz görür."],"x":"Müt'ada sürenin belirlenmesi ve şahit şart değildir; mübhem bir zaman yeterlidir. Şahit ve belirli süre muvakkat nikahın özellikleridir."},{"u":3,"q":"Malı olan, eşine iyilikle davranabilecek ve evlenmezse zinaya düşeceği kesin olan kişi için evliliğin hükmü nedir?","a":["Farz","Vacip","Mubah","Mekruh"],"x":"Mehir ve nafakaya gücü yeten, eşine iyilikle davranacak olgunlukta olan ve evlenmezse zinaya düşme korkusu yaşayan kişi için evlilik farzdır. Zinaya düşme ihtimali varsa vacip olur."},{"u":3,"q":"Malı olan, zinaya düşme korkusu olmayan fakat eşine kötü davranmaktan çekinen kişinin evlenmesi hükmü nedir?","a":["Mekruh","Haram","Mubah","Vacip"],"x":"Malı var, zina korkusu yok ama eşine kötü davranmaktan çekiniyorsa evlenmesi mekruhtur. Malı yoksa ya da eşine iyi davranamayacağı belliyse haramdır."},{"u":3,"q":"Şemadaki ملاحظة'ya göre evliliğin hükmünde geçen \"mal\"dan maksat nedir?","a":["Mehri ve evliliğin diğer masraflarını karşılayacak mal","Zengin olmak","Bir yıllık nafaka","Kendine ait bir ev"],"x":"«المراد بالمال هنا أن يجد مالا يقوم بالمهر وسائر نفقات الزوجية»: mehri ve evliliğin diğer nafakalarını karşılayacak mala sahip olmak."},{"u":3,"q":"Sahih-nâfiz evlilikte aşağıdakilerden hangisi kocanın sorumluluklarından değildir?","a":["Kocaya itaat","Mehir","Nafaka","Eşler arasında adalet"],"x":"Kocanın dört sorumluluğu: mehir, nafaka, adalet, eziyet etmemek. Kocaya itaat kadının sorumluluğudur."},{"u":3,"q":"Sahih-nâfiz evlilikte eşlerin ortak sorumluluklarından biri değildir?","a":["Mehir","Nesebin sübûtu","Veraset","Hürmet-i musahara"],"x":"Ortak beş sorumluluk: nesebin sübûtu, veraset, hürmet-i musahara, istimta' hakkı, geçim ehli olmak. Mehir kocanın sorumluluğudur."},{"u":3,"q":"Sıhhat şartları tam olup nikah sahibinin ya da velinin icazetine bağlı olan nikah hangisidir?","a":["Sahih-mevkuf","Fâsid","Bâtıl","Sahih-nâfiz lazım"],"x":"Mevkuf nikah sıhhat şartlarını taşır ama icazete bağlıdır (gayr-i nafiz). İcazetten önce duhul olursa fasit hükümleri işler ve veli feshedebilir."},{"u":3,"q":"Fasit nikahta duhulden sonra ayrılık olursa aşağıdakilerden hangisi vacip olmaz?","a":["Tarafların birbirine mirasçı olması","Müsemma ile misilden az olan mehir","Hürmet-i musahara","İddet ve iddet nafakası"],"x":"Duhulden sonra fasit nikahta dört şey vacip olur: az olan mehir, (en az 6 ay sonra doğan çocuğun) nesebi, hürmet-i musahara, iddet ve nafakası. Veraset, nafaka (evlilik nafakası), istimta' ve itaat terettüp etmez."},{"u":3,"q":"Fasit nikahta nesebin sabit olması için çocuğun akit tarihinden itibaren en az ne kadar sonra doğması gerekir?","a":["Altı ay","Dokuz ay","Bir yıl","Üç ay"],"x":"Akit tarihinden başlamak üzere en az altı ay geçtikten sonra doğan çocuğun nesebi sabit olur."},{"u":3,"q":"Batıl evliliği bile bile sürdürenlere had uygulanmayacağını, çünkü akit şüphesi bulunduğunu söyleyen kimdir?","a":["Ebû Hanîfe","İmam Şâfiî","İmam Mâlik","Ahmed b. Hanbel"],"x":"Ebû Hanîfe dışındaki imamlara göre had uygulanır; Ebû Hanîfe'ye göre akit şüphesi vardır."},{"u":3,"q":"Şemaya göre \"feshe kabil olan nikah\" nikahın hangi kısmıdır?","a":["Nafiz nikahın gayr-i lazım olanı","Fasit nikah","Batıl nikah","Mevkuf nikah"],"x":"Sahih nikah nafiz ya da mevkuftur; nafiz nikah lazım (feshe kabil olmayan) ya da gayr-i lazım (feshe kabil olan, ör. hıyâr-ı bulûğ) olur."},{"u":4,"q":"Aşağıdakilerden hangisi muvakkat (geçici) haramlık sebeplerinden değildir?","a":["Süt emme (rada')","İki mahremi bir nikahta toplamak","Kadının üç talakla boşanmış olması","Erkeğin dört eşe sahip olması"],"x":"Rada' müebbed haramlık sebebidir (karabet, musahara ve rada' ile birlikte). Muvakkat haramlık beş şeyle olur."},{"u":4,"q":"Neseb yoluyla haram olan \"dede ve ninenin furu'u\" hakkında hangisi doğrudur?","a":["Yalnız bir derece ayrılanlar (hala, teyze) haramdır; amca, hala ve teyze kızları haram değildir.","Dede ve ninenin bütün furu'u haramdır.","Hiçbiri haram değildir.","Yalnız amca kızları haramdır."],"x":"Dede ve ninenin bir dereceden ayrılan furu'u (hala, teyze) haramdır; iki dereceden ayrılanlar (amca, hala, teyze kızları) haram değildir."},{"u":4,"q":"Üvey kızın erkeğe haram olması için ne şarttır?","a":["Annesine duhul etmiş olmak","Annesiyle nikahın kıyılmış olması yeterlidir","Üvey kızın erkeğin evinde büyümüş olması","Annesiyle halvet-i sahîhanın gerçekleşmiş olması yeterlidir"],"x":"Kadının furu'u ancak anneye duhulle haram olur: «وربائبكم اللاتي في حجوركم من نسائكم اللاتي دخلتم بهن». Duhul olmadan boşanırsa kızları haram olmaz. Halvet-i sahîha da yetmez."},{"u":4,"q":"Kayınvalidenin (eşin annesinin) erkeğe haram olması için ne gerekir?","a":["Kızıyla nikah yeterlidir; duhule bakılmaz.","Kızına duhul etmiş olmak","Kızıyla halvet-i sahîha","Kızından çocuk sahibi olmak"],"x":"Kadının usulünde duhule bakılmaz, nikah yeterlidir: «وأمهات نسائكم». Kaide: \"Kızları nikahlamak anneleri haram kılar, annelere duhul kızları haram kılar.\""},{"u":4,"q":"Evlatlığın boşadığı eşiyle evlenmenin caiz olduğunun delili hangisidir?","a":["«فَلَمَّا قَضَى زَيْدٌ مِنْهَا وَطَرًا زَوَّجْنَاكَهَا…» ayeti","«وَأُمَّهَاتُ نِسَائِكُمْ» ayeti","«يحرم من الرضاع ما يحرم من النسب» hadisi","«لا نكاح إلا بشهود» hadisi"],"x":"Gelinlerin haramlığı \"sulbünüzden olan oğullarınızın eşleri\" kaydıyladır; evlatlık evlat değildir. Zeyd ayeti bunun delilidir."},{"u":4,"q":"Zina ile sıhriyyetin oluşmayacağı görüşünü benimseyen Osmanlı düzenlemesi hangisidir?","a":["Osmanlı Aile Hukuku Kararnamesi","Mecelle","Kânûnnâme-i Âl-i Osman","Tanzimat Fermanı"],"x":"Ebû Hanîfe'ye göre zina ile sıhriyyet oluşur; Şâfiî'ye göre oluşmaz. Osmanlı Aile Hukuk kararnamesi zinanın sıhriyyet oluşturmayacağı görüşünü benimsemiştir."},{"u":4,"q":"Rada' ile ilgili kaide hangisidir?","a":["\"Emenin emzirene nefsi, emzirenin emene nesli haramdır.\"","\"Mani zail olunca memnu' avdet eder.\"","\"Temlik akitleri tehlikeli ta'liki kabul etmez.\"","\"İbtidaen caiz olmayan bekaen de caiz değildir.\""],"x":"Süt emmede kaide: emen çocuk kendisi (nefsi) emzirene, emziren kadın ise nesliyle (çocuklarıyla) emene haram olur."},{"u":4,"q":"Hanefilere göre süt hısımlığının oluşması için ne kadar emme yeterlidir?","a":["Mideye ulaşan bir damla","Fasılalı beş emme","En az üç emme","Doyuncaya kadar on emme"],"x":"Şâfiî ve Hanbelîlere göre fasılalı 5 emme, Mâlikîlere göre en az üç emme, Hanefilere göre mideye ulaşan bir damla yeterlidir."},{"u":4,"q":"Hanefi mezhebinin kabul ettiği emme süresi nedir?","a":["2 yıl","2,5 yıl","3 yıl","Yaşın önemi yoktur"],"x":"Emme süresi: cumhur 2 yıl, Ebû Hanîfe 2,5 yıl, İmam Züfer 3 yıl, Hanefi mezhebi 2 yıl; Zâhirîler ve Hz. Âişe'ye göre yaşın önemi yoktur."},{"u":4,"q":"Aşağıdakilerden hangisiyle
