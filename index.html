evlenmek caizdir?","a":["Süt oğlunun öz kız kardeşi","Süt teyze","Eşinin süt annesi","Süt babanın eşi"],"x":"Süt oğlun öz kız kardeşi, süt kardeşin annesi, süt oğul veya kızın ninesi, süt kardeşin kız kardeşi ile evlenilebilir. Diğerleri haram olan süt akrabalarıdır."},{"u":5,"q":"İki kız kardeşi bir nikahta toplama haramlığı hakkında hangisi doğrudur?","a":["Geçicidir; nikahlının ölümü ya da boşanıp iddetinin bitmesiyle kalkar.","Ebedîdir.","Yalnız duhulden sonra başlar.","Süt kardeşler için geçerli değildir."],"x":"Bu geçici bir haramlıktır. Süt kardeşlik de neseb gibidir; süt kardeş iki kadın da bir nikahta toplanamaz."},{"u":5,"q":"Aynı nikahta toplama yasağı için fakihlerin genel kuralı nedir?","a":["İki kadından biri erkek farz edildiğinde aralarında evlenme engeli varsa ikisi bir nikahta toplanamaz.","Aynı aileden iki kadın hiçbir surette bir nikahta toplanamaz.","Yalnız kız kardeşler bir nikahta toplanamaz.","Aralarında miras ilişkisi varsa toplanamazlar."],"x":"«لو فرضت إحداهما رجلا لحرمت الأخرى عليه». Bu yüzden hala ile yeğeni toplanamaz, iki amca kızı toplanabilir."},{"u":5,"q":"Bir kimse iki kız kardeşi tek akitle nikahlar ve duhulden sonra ayrılırlarsa her birine ne verilir?","a":["Mehr-i müsemma ile misilden azı","Tam mehr-i müsemma","Yarım mehir","Hiçbir şey"],"x":"Tek akitte hemen ayrılırlar; duhulden önceyse bir şey gerekmez, duhulden sonraysa her birine müsemma ile misilden az olanı verilir."},{"u":5,"q":"İki kız kardeşi ayrı akitlerle nikahlayan ve hangisinin önce olduğu bilinmeyen kişi duhulden önce ayrılırsa ve mehirler eşitse ne gerekir?","a":["İkisine (toplam) yarım mehir verilir.","Her birine tam mehir verilir.","Hiçbir şey gerekmez.","Her birine mehr-i misil verilir."],"x":"Mehirler eşit ve talak duhulden önceyse yarım mehir verilir; mehirler farklıysa her birine kendi mehrinin dörtte biri; ayrılık duhulden sonraysa her birine tam mehir."},{"u":5,"q":"Başkası ile evli olmaktan doğan evlenme engeline ne ad verilir?","a":["Hakku'l-ğayr","Hürmet-i musahara","Velayet-i icbar","Beynûnet-i kübrâ"],"x":"Kadın başkasıyla evliyken ya da iddet beklerken evlenemez; bu engele hakku'l-ğayr (başkasına aidiyet) denir. İddet \"hükmî evlilik\" sayılır."},{"u":5,"q":"Üç talakla boşanan kadının ilk kocasıyla yeniden evlenebilmesi için aşağıdakilerden hangisi aranmaz?","a":["İkinci kocanın onu en az bir yıl nikahında tutması","Başka bir erkekle sahih nikah","Fiilî duhul","Yeniden iddet beklemesi"],"x":"Beş şart: iddet → başka erkekle hukuka uygun nikah → duhul → boşama/ölüm → yeniden iddet. Süre şartı yoktur. Zifaftan önce koca ölürse engel devam eder."},{"u":5,"q":"Lianın geçici bir evlenme engeli olduğunu kabul edenler kimlerdir?","a":["Ebû Hanîfe ve İmam Muhammed","Şâfiî ve Mâlik","Ebû Yûsuf ve İmam Züfer","Zâhirîler ve İmâmiyye"],"x":"Yalnız Ebû Hanîfe ve İmam Muhammed lianı geçici engel sayar ve hakimin tefrik kararını şart koşar. Diğerlerine göre lian ebedî engeldir, yargı kararı aranmaz."},{"u":5,"q":"Dördüncü eşini bain talakla boşayan erkeğin onun iddeti içinde beşinci kadınla evlenmesini caiz gören kimdir?","a":["İmam Şâfiî","Ebû Hanîfe","İmam Mâlik","Ahmed b. Hanbel"],"x":"İddet bekleyen kadının evliliğinin bazı sonuçları hükmen devam ettiği için genel kural caiz olmamaktır. Şâfiî bain talakla evlilik bağının tamamen kesildiği kanaatinde olduğundan caiz görmüştür."},{"u":5,"q":"Ebû Hanîfe'ye göre Sâbiîler hakkında hangisi doğrudur?","a":["Ehl-i kitaptır, Hristiyanlığın bir koludur.","Mecusilerle aynıdır.","Müşriktir.","Yahudiliğin bir koludur."],"x":"Ebû Hanîfe'ye göre Sâbiîler Ehl-i kitaptır; cumhur aksi görüştedir ve Sâbiîliği semavi olmayan dinlerden sayar."},{"u":5,"q":"Müslüman erkekle kitabî kadın evliliğinde aşağıdakilerden hangisi Müslüman kadınla evlilikten farklı değildir?","a":["Mehir ve nafaka hakkı","Şahitlerin Müslüman olması şartı","Birbirlerine mirasçı olmaları","Kadının başka semavi dine geçmesinin sonucu"],"x":"Şemaya göre bütün hüküm, hak ve vecibeler aynıdır; yalnız şahitler, miras, çocukların dini ve kadının din değiştirmesi konularında fark vardır."},{"u":5,"q":"Müslüman erkekle evli kitabî kadın Hristiyanlıktan Yahudiliğe geçerse ne olur?","a":["Nikah bozulmaz.","Nikah kendiliğinden bozulur.","Hakim ayırır.","Kadın mehrini kaybeder."],"x":"Başka bir semavi dine geçerse evlilik fesholmaz; müşrik olursa akit fesholunur."},{"u":5,"q":"Ebû Hanîfe'ye göre cariye ile evlilik hakkında hangisi doğrudur?","a":["İbtidaen caizdir ama hür kadının üzerine haramdır.","Hiçbir surette caiz değildir.","Yalnız Müslüman cariye ile ve iki şartla caizdir.","Kadın kısırsa caizdir."],"x":"Ebû Hanîfe'ye göre ibtidaen cariye (kitabî ya da Müslim) ile evlenmek caizdir; hür kadından sonra haramdır: \"Hür kadının üzerine cariye kuma getirilmez.\""},{"u":5,"q":"Gayrimüslim evli çiftte yalnız kadın Müslüman olursa ne yapılır?","a":["Kocaya İslam tebliğ edilir; kabul ederse evlilik devam eder, etmezse ayrılırlar.","Hemen ayrılırlar.","Kocanın kitabî olması yeterlidir, evlilik devam eder.","Kadının iddeti beklenir, sonra evlilik devam eder."],"x":"Koca baliğ, âkil ise ona İslam tebliğ edilir; mecnunsa ebeveynine, gayr-i mümeyyizse temyiz yaşı beklenir. Kocanın kitabî olması fark etmez."},{"u":6,"q":"Velayet-i icbarın sebepleri hangisinde doğru verilmiştir?","a":["Küçüklük, delilik, bunaklık","Kadınlık, bekâret, fakirlik","Kölelik, küçüklük, sefeh","Bulûğ, akıl, hürriyet"],"x":"Velayet-i icbar üç sebepten biriyle sabit olur: küçüklük (sığar), delilik (cünûn), bunaklık (ateh). Şâfiî'ye göre sebep bekârettir."},{"u":6,"q":"Hanefilere göre küçüğün icbar velisi kimdir?","a":["Önce baba, sonra dede, sonra (asabe sırasıyla) en yakın veli","Yalnız baba","Baba ve dede; yoksa bulûğa kadar beklenir","Yalnız hakim"],"x":"Hanefilere göre en sahih görüş: önce baba, sonra dede, sonra velayete en yakın olan. Delil: \"Nikâh asabeden olan veliye aittir\" ve Hz. Peygamber'in Ümâme'yi evlendirmesi."},{"u":6,"q":"İmam-ı Âzam ve İmam Muhammed'e göre küçüğü baba ya da dede evlendirmişse bulûğdan sonra durum nedir?","a":["Muhayyerlik hakkı yoktur.","Muhayyerlik hakkı vardır.","Nikah mevkuftur.","Nikah fasittir."],"x":"Baba ve dede ileri görüşlü ve şefkatli olduğu için muhayyerlik yoktur; başka veli evlendirmişse vardır. Müftâbih olan Tarafeyn'in görüşüdür."},{"u":6,"q":"Bulûğdan sonra fesih için kimin sükûtu beyan (rıza) sayılır?","a":["Bakire kızın","Erkeğin","Dul kadının","Hepsinin"],"x":"Erkeğin ve dulun sükûtuna itibar edilmez; bakire kızın sükûtu beyandır."},{"u":6,"q":"Bulûğ muhayyerliğinin bilinmemesi hakkında hangisi doğrudur?","a":["Özür değildir.","Fesih süresini uzatır.","Akdi batıl kılar.","Ancak kız için özürdür."],"x":"Bulûğdan sonra feshin yapılabileceğine dair bilgisizlik de muhayyerlik hakkının bilinmemesi de özür değildir; herkes ihtiyacı olan hükümleri bilmelidir."},{"u":6,"q":"Velayet-i nedb kimler üzerinde sabit olur?","a":["Âkil, hür ve büyük kadın (bakire ya da dul)","Küçük kız","Mecnun ve ma'tûh","Köle ve cariye"],"x":"Velayet-i nedb, ergen ve akıl hastası olmayan kadının hayâ sebebiyle evlendirme işini velisine bırakmasıdır; Ebû Hanîfe, Züfer ve bir rivayette Ebû Yûsuf'un görüşüdür."},{"u":6,"q":"Aşağıdakilerden hangisi velide aranan şartlardan değildir?","a":["Adalet","Hürriyet","Bulûğ","Dinde muvafakat"],"x":"Velinin dört şartı: hürriyet, bulûğ, akıl, dinde muvafakat. Salah ve adalet şart değildir; fâsığın velayeti caizdir."},{"u":6,"q":"Ebû Hanîfe'nin asabe dışındaki akrabaların da veli olabileceğine dair delillerinden biri hangisidir?","a":["Abdullah b. Mes'ûd'un kızını evlendirmesi için annesine izin vermesi","«الإنكاح إلى العصبات» hadisi","Hz. Âişe'nin evliliği","\"Sultan velisi olmayanın velisidir\" hadisi"],"x":"Ebû Hanîfe \"ulu'l-erham\" ayetini ve İbn Mes'ûd'un kızını annesine evlendirtmesini delil getirir (anne zevi'l-erhamdandır). İmameyn «الإنكاح إلى العصبات» hadisine dayanır."},{"u":6,"q":"Asabe-i nesebiyyenin dört cihetinin doğru sırası hangisidir?","a":["Bünüvvet, ubüvvet, uhuvvet, umûmet","Ubüvvet, bünüvvet, umûmet, uhuvvet","Uhuvvet, umûmet, bünüvvet, ubüvvet","Bünüvvet, uhuvvet, ubüvvet, umûmet"],"x":"Asabe-i nesebiyye: bünüvvet (oğul ve aşağısı), ubüvvet (baba ve yukarısı), uhuvvet (kardeşler ve oğulları), umûmet (amcalar ve oğulları)."},{"u":6,"q":"Birden fazla asabe bulunursa hangi sıraya göre tercih yapılır?","a":["Cihet, derece, kuvvet","Yaş, servet, ilim","Kuvvet, cihet, derece","Derece, kuvvet, cihet"],"x":"Önce cihet bakımından yakın olan; eşitlerse derecesi kuvvetli olan; o da eşitse kuvvet bakımından üstün olan (ör. öz kardeş baba bir kardeşe) tercih edilir."},{"u":6,"q":"Velilerin tertibi hangisinde doğru verilmiştir?","a":["Karabet, mevle'l-muvâlât, sultan (vekili ya da hakim)","Sultan, karabet, mevle'l-muvâlât","Mevle'l-muvâlât, karabet, sultan","Karabet, sultan, mevle'l-muvâlât"],"x":"Önce karabet (asabe-i nesebiyye, sonra sebebiyye), sonra mevle'l-muvâlât, sonra sultan ya da vekili/hakim."},{"u":6,"q":"Şartlar tamken yakın veli evliliği engellerse (azl) Hanefi mezhebinin mutemed görüşüne göre velayet kime geçer?","a":["Hakime","Uzak veliye","Anneye","Kadının kendisine"],"x":"Bir görüşe göre uzak veliye geçer; Hanefi mezhebinin mutemed görüşüne göre hakime geçer, böylece zulüm kaldırılır ve uzak veliye vermekle çıkabilecek huzursuzluk önlenir."},{"u":7,"q":"\"El-vekîl ke's-sefîr\" kaidesine göre nikah vekili ne zaman sorumlu olur?","a":["Mehrin kamil olması hususunda kadına kefil olmuşsa","Hiçbir zaman","Akit fasit olursa","Müvekkil ölürse"],"x":"Vekil elçi gibi sorumsuzdur; istisnası mehre kefil olmasıdır, çünkü o zaman kefil konumundadır."},{"u":7,"q":"Müvekkil 100 dinar mehirle evlendirilmeyi istediği hâlde vekil onu 120 dinarla evlendirirse akdin hükmü nedir?","a":["Fuzûlînin akdi gibidir; müvekkilin icazeti beklenir.","Müvekkil adına nafizdir.","Batıldır.","Fazla kısım vekilin üzerine kalır, akit nafizdir."],"x":"Bu \"muhalefe ilâ şer\"dir; akit fuzûlî akdi gibidir. 80 dinara evlendirseydi muhalefe ilâ hayr olur, akit nafiz olurdu."},{"u":7,"q":"Nikahta vekil tayin etmek hakkında hangisi doğrudur?","a":["Yazı ve şahit şart değildir; şahit tutmak müstehaptır.","Yazılı olması şarttır.","İki şahit huzurunda yapılması şarttır.","Ancak hakim huzurunda yapılabilir."],"x":"Kitabet ve şahit şart değildir; ancak müvekkil vekaleti inkâr ederek evliliğin iptalini kastedebileceği için şahit göstermesi müstehaptır."},{"u":7,"q":"Kefâetin yalnız din konusunda olduğunu söyleyenler kimlerdir?","a":["Mâlik b. Enes ve Süfyân es-Sevrî","Ahmed b. Hanbel","İbn Ebî Leylâ","İmam Şâfiî"],"x":"Mâlik ve Sevrî'ye göre kefâet dindedir (Ebû Hind hadisi). Ahmed din ve san'at, İbn Ebî Leylâ din, neseb ve mal, Şâfiî daha fazla unsur sayar."},{"u":7,"q":"Ebû Hanîfe'ye göre aşağıdakilerden hangisi kefâet unsurlarından değildir?","a":["Yaş","Neseb","Hirfe (meslek)","Diyanet"],"x":"Ebû Hanîfe'ye göre kefâet: neseb, İslam, hürriyet, mal, diyanet, hirfe. Yaşı ve ayıplardan hâlî olmayı Şâfiî sayar."},{"u":7,"q":"Hanefilere göre kefâette nesebin şart olması kimler içindir?","a":["Araplar","Arap olmayanlar","Bütün Müslümanlar","Yalnız Kureyşliler"],"x":"Nesebin kefâet için şart olması Araplar içindir; çünkü onlar soylarını muhafaza edip övünç vesilesi yapmıştır. İslam ve hürriyet ise Arap olmayanlar arasında muteberdir."},{"u":7,"q":"Kefâetteki \"İslam\" unsurundan maksat nedir?","a":["Erkeğin babasının ve dedesinin Müslüman olması","Erkeğin Müslüman olması","Kadının Müslüman olması","Şahitlerin Müslüman olması"],"x":"Erkeğin Müslüman olması zaten sıhhat şartıdır. Kefâetteki İslam, baba ve dedenin Müslüman olmasıdır; daha öncesinin önemi yoktur."},{"u":7,"q":"Kefâette \"mal\" unsurundan maksat nedir?","a":["Peşin mehri ve bir aylık nafakayı vermeye malik olmak","Kadının ailesi kadar zengin olmak","Bir ev sahibi olmak","Bir yıllık nafakaya malik olmak"],"x":"Maksat zenginlik değil, akit esnasında peşin mehri ve bir aylık nafakayı vermeye malik olmaktır. Bu Ebû Yûsuf'un müftâbih görüşüdür; Ebû Hanîfe ve Muhammed muhaliftir."},{"u":7,"q":"Diyanetin (salah) kefâetle ilgisinin olmadığını, çünkü kefâetin dünya işlerinden olduğunu söyleyen kimdir?","a":["İmam Muhammed","Ebû Hanîfe","Ebû Yûsuf","İmam Züfer"],"x":"Ebû Hanîfe ve Ebû Yûsuf'a göre salih adamın kızına ancak salih erkek denktir; İmam Muhammed'e göre bunlar kul ile Rabbi arasındadır, kefâet ise dünya işidir."},{"u":7,"q":"Baliğa, âkile, hür kadın dengi olmayan biriyle evlenirse müftâbih görüşe göre hüküm nedir?","a":["Akit kurulmaz, batıldır; veli önceden razıysa sahih ve lazımdır.","Akit sahih ve lazımdır.","Akit mevkuftur, kadının icazetine bağlıdır.","Akit sahihtir, yalnız mehr-i misil gerekir."],"x":"Dengiyle evlenirse akit lazım ve nafizdir; dengi olmayanla evlenirse müftâbih görüşe göre batıldır; veli akitten önce razı olmuşsa sahih ve lazımdır."},{"u":7,"q":"Kefâet ne zaman aranır?","a":["Akdin başlangıcında","Evlilik boyunca","Duhulden sonra","Boşanma anında"],"x":"Kefâet başlangıçta aranır; evlilik boyunca devam etmesi şart değildir, çünkü bu meşakkattir."},{"u":7,"q":"Kadın araştırmadan dengi sandığı biriyle evlenir ve erkek denk çıkmazsa ne olur?","a":["Kadının hakkı düşer, velinin hakkı düşmez.","İkisinin hakkı da düşer.","İkisinin hakkı da devam eder.","Velinin hakkı düşer, kadınınki düşmez."],"x":"Kadın araştırma yapmadığı için kendi hakkı sakıt olur ama velinin hakkı sakıt olmaz. Veli araştırmadan, kadının rızasıyla evlendirirse ikisinin hakkı da düşer."},{"u":8,"q":"Evlilik akdindeki şer'i ispat yolları hangileridir?","a":["İkrar, beyyine, yeminden nükûl","Şahit, yazı, karine","İkrar, şahit, hakim kararı","Beyyine, örf, yemin"],"x":"Evlilik akdinde şer'i ispat yolları üçtür: ikrar, beyyine ve yeminden nükûl."},{"u":8,"q":"Yemin etmekten kaçınan kimseye ne ad verilir?","a":["Nâkil","Mukır","Müvekkil","Fuzûlî"],"x":"Nükûl ani'l-yemin: davalı ya da davacının yemine yanaşmamasıdır; yemin etmekten kaçınana nâkil denir."},{"u":8,"q":"Kadının kocasının evinde oturması için aranan şartlardan biri değildir?","a":["Evin kadın adına tapulu olması","Mehr-i muacceli almış olması","Evin kadının statüsüne uygun olması","Kocanın güvenilir biri olması"],"x":"Dört şart: mehr-i muacceli ödemesi, evin kadının statüsüne uygunluğu, can ve mal güvenliği, kocanın güvenilir olması."},{"u":8,"q":"Kocanın te'dib hakkının mertebeleri hangi sırayladır?","a":["Nasihat, yatakta mehcur bırakmak, acı vermeyecek şekilde vurmak","Yatakta mehcur bırakmak, nasihat, vurmak","Vurmak, nasihat, mehcur bırakmak","Nasihat, hakime başvurmak, boşamak"],"x":"Te'dib üç mertebedir: şefkat ve yumuşaklıkla nasihat, yatağında mehcur bırakmak, acı vermeyecek şekilde vurmak."},{"u":8,"q":"Kadının kocasının evinden izinsiz çıkmaması için aranan iki şart hangisidir?","a":["Mehr-i muacceli almış olması ve sıla-i rahme engel olunmaması","Kocanın zengin olması ve evin müstakil olması","Şahit bulunması ve velinin izni","Nafakanın peşin verilmesi ve hizmetçi tutulması"],"x":"İzinsiz çıkmama şartları: mehr-i muaccel ödenmiş olması ve sıla-i rahme engel olunmaması. Mehr-i muacceli almayan kadın izinsiz dışarı çıkabilir."},{"u":8,"q":"Kadının kocasının emirlerine uyma şartlarından biri değildir?","a":["Emrin kocanın şahsi işiyle ilgili olması","Emrin evliliğe dair işlerden olması","Emrin şeriate uygun olması","Kocanın karısına karşı görevlerini yerine getirmesi"],"x":"Emir evliliğe dair işlerden olmalıdır; kocanın şahsi işleri bu kapsamda değildir."},{"u":8,"q":"Kadın anne-babasını izinsiz ne sıklıkla ziyaret edebilir?","a":["Haftada bir","Ayda bir","Yılda bir","Hiç, izin gerekir"],"x":"Kadının anne-babasına izinsiz haftada bir kere gitmesine müdahale edilmez; diğer mahremlerine senede bir (bir görüşe göre her ay) gidebilir."},{"u":8,"q":"Koca karısının malını izinsiz alırsa hüküm nedir?","a":["Gasbetmiş olur; malı iade eder, telef olduysa mislini ya da kıymetini öder.","Kocanın hakkıdır, iade gerekmez.","Nafakadan mahsup edilir.","Mehirden düşülür."],"x":"Koca karısı vekalet vermedikçe malına dokunamaz; izinsiz alırsa gasptır: iade eder, telef olduysa mislîse mislini, kıyemîse kıymetini öder."},{"u":8,"q":"Eşler arasındaki müşterek haklardan biri değildir?","a":["Mehr-i muaccel","Âdâb-ı muâşerete riayet","Hürmet-i musaharaya riayet","Birbirlerine mirasçı olmaları"],"x":"En önemli dört müşterek hak: âdâb-ı muâşeret («ولهن مثل الذي عليهن بالمعروف»), hürmet-i musahara, karşılıklı mirasçılık, istimta'. Mehr-i muaccel kocanın ödevidir."},{"u":9,"q":"Fasit evlilikte mehri vacip kılan şey nedir?","a":["Zifaf (duhul)","Akdin kendisi","Mehrin tesmiyesi","Halvet-i fâside"],"x":"«الوطء» ile sahih akdin kendisi ya da zifaf kastedilir; fasit evlilikte mehri vacip kılan zifaftır. Duhulden önce ayrılırlarsa mehirden bir şey gerekmez."},{"u":9,"q":"Aşağıdakilerden hangisi mehrin diğer adlarından değildir?","a":["Kisve","Nihle","Sadaka","Ukr"],"x":"Mehir sadaka, nihle, ferîza, tavl, hibâ, ecr, ukr, nikah gibi isimlerle de anılır. Kisve giyim (nafaka) demektir."},{"u":9,"q":"Hanefilere göre mehrin en az miktarı nedir?","a":["10 dirhem (7 miskal)","Dinarın dörtte biri","Sınırı yoktur","20 miskal"],"x":"Hanefilere göre mehir 10 dirhemden az olamaz (\"Mehir 10 dirhemden aşağı olmaz\"); ölçüsü 7 miskaldir. Mâlik dinarın 1/4'ü der, Şâfiî ve Ahmed'e göre sınır yoktur."},{"u":9,"q":"Mehir 10 dirhemden az tesmiye edilirse Ebû Hanîfe ve İmameyn'e göre ne gerekir?","a":["10 dirhem","Mehr-i misil","Tesmiye edilen miktar","Müt'a"],"x":"Tesmiye sahih olmaz, koca 10 dirhemi öder. İmam Züfer'e göre mehr-i misle dönüşür."},{"u":9,"q":"Aşağıdakilerden hangisi mehir olabilir?","a":["Mütekavvim maldan elde edilen menfaat","Şarap","Akıtılmış kan","Domuz"],"x":"Altın, gümüş, akar, menkul mal ve mütekavvim mallardan elde edilen menfaat mehir olur. Meyte ve kan mal değildir; şarap ve domuz mütekavvim değildir."},{"u":9,"q":"\"İnsanların önünde övünmek için gizli mehirden bambaşka bir mehrin zikredilmesi\"ne ne denir?","a":["Mehr-i sır","Mehr-i misil","Mehr-i müeccel","Müt'a"],"x":"Bu mehr-i sırdır; mehirde aleniyet var olduğu için bu (açıklanan) mehrin verilmesi gerekir."},{"u":9,"q":"İbtida durumunda mehre müteallik \"Allah hakkı\" nedir?","a":["Mehrin ortadan kaldırılamaması ve 7 miskalden az olamaması","Velinin mehri misilden az belirleyememesi","Kadının mehri kocaya hibe edebilmesi","Mehrin peşin ödenmesi"],"x":"İbtidada üç hak vardır: Allah hakkı (mehir kaldırılamaz, 7 miskalden az olamaz), kadının hakkı, velinin hakkı. Bekâda yalnız kadının hakkı vardır."},{"u":9,"q":"Aşağıdakilerden hangisi fasit tesmiye örneği değildir?","a":["10 dirhem gümüş","Bir küp su","Şarap","Kur'an öğretmek"],"x":"Dört fasit tesmiye: gayr-i mütekavvim mal (bir küp su), yalnız gayrimüslimler için mütekavvim olan (şarap), fahiş cehaletli mal (20 miskal), ücret alınamayan menfaat (Kur'an eğitimi)."},{"u":9,"q":"Fasit bir akitte sahih tesmiye ile mehir belirlenmiş ve duhul gerçekleşmişse ne vacip olur?","a":["Mehr-i müsemma ile mehr-i misilden az olanı","Mehr-i müsemma","Mehr-i misil","Müt'a"],"x":"Bu, \"mehr-i misil ve müsemmadan daha az olanın vacip olduğu\" tek durumdur."},{"u":9,"q":"Mehr-i misilde kadının emsalleri kimlerdir?","a":["Babası tarafından, yoksa memleket ahalisinden yaş, güzellik, bekâret gibi yönlerden akranı olan kadınlar","Annesi tarafından akrabası olan kadınlar","Kocasının kız kardeşleri","Aynı yıl evlenen bütün kadınlar"],"x":"Mehr-i misil zevcenin babası tarafından, olmazsa memleket ahalisinden akit tarihinde yaş, güzellik, bekâret gibi özelliklerde emsal kadınların mehridir."},{"u":9,"q":"Mehirden indirimin geçerli olması için aşağıdakilerden hangisi gerekmez?","a":["Kocanın indirimi kabul etmesi","Mehri bizzat kadının düşürmesi","Kadının ehliyet sahibi olması","İkrah olmaması"],"x":"İndirimde kocanın kabulü şart değildir, çünkü iskatte kabule ihtiyaç yoktur. Ziyadede ise kadının ya da velisinin kabulü şarttır."},{"u":9,"q":"Sahih akitte mehrin tamamının vacip olduğu üç yer hangisidir?","a":["Hakiki duhul, halvet-i sahîha, duhulden önce eşlerden birinin ölümü","Akit, şahit, mehrin tesmiyesi","Halvet-i fâside, nişan, nikah","Duhul, boşama, iddet"],"x":"Sahih akitte mehrin tamamı hakiki duhulle, sahih halvetle ve duhul ve halvetten önce eşlerden birinin ölümüyle gerekli olur."},{"u":9,"q":"Halvet-i sahîha ile hakiki duhulün birleştiği yerler hangileridir?","a":["Mehrin tamamının vacip olması ve iddet","İhsan ve miras","Üvey kızın haramlığı ve ric'i talak","Üç talaktan sonra ilk kocaya dönüş ve ihsan"],"x":"İkisi mehrin tamamı ve iddette birleşir; ihsan, üç talaktan sonra dönüş, üvey kızın haramlığı, talakın niteliği ve mirasta ayrılır."},{"u":9,"q":"Halvet-i sahîhadan sonra yapılan boşama nasıldır?","a":["Bain","Ric'i","Batıl","Mevkuf"],"x":"Halvet-i sahîha ile olan boşamalar baindir; duhulden sonra ise ric'i olabilir."},{"u":9,"q":"Mehrin yarısının vacip olmasının şartlarından biri değildir?","a":["Ayrılığın kadından kaynaklanması","Mehrin müsemma olması","Dokunmadan önce boşanması","Kadının mehrin tamamını bağışlamamış olması"],"x":"Yarım mehrin üç şartı: mehir müsemma, dokunmadan önce koca boşamış, kadın mehri bağışlamamış. Ayrılık kocaya taalluk etmelidir (talak, lian, îlâ, zıhar…)."},{"u":9,"q":"Mehir belirlenmemiş ve duhul ile halvet-i sahîha gerçekleşmeden boşanan kadına ne verilir?","a":["Müt'a","Yarım mehir","Mehr-i misil","Hiçbir şey"],"x":"Bu durumda mehir verilmez, müt'a verilir. Müt'anın miktarı örfe göre belirlenir."},{"u":9,"q":"Mehir tablosuna göre zifaf veya halvet-i sahîhadan önce kadın, kocasından kaynaklı kusur yüzünden mahkeme yoluyla evliliği feshettirirse mehir ne olur?","a":["Mehir hakkı düşer.","Mehrin tamamını alır.","Mehrin yarısını alır.","Müt'a alır."],"x":"Tabloya göre fesih kadının talebinden kaynaklandığı için mehir hakkı düşer. Koca kusurluyken fesih istemezse kadın mehrini tam alır."},{"u":9,"q":"Mehir tablosuna göre cinsel münasebetten sonra eşlerin süt kardeş oldukları anlaşılırsa kadın ne alır?","a":["Mehr-i müsemma ile mehr-i misilden düşük olanı","Mehrin yarısını","Hiçbir şey","Mehr-i müsemmanın tamamını"],"x":"Duhulden sonra süt kardeşlik anlaşılırsa kadın müsemma ile misilden hangisi düşükse onu alır; duhulden önce anlaşılırsa mehir hakkı düşer."},{"u":10,"q":"Nafakayı gerektiren üç sebep hangisidir?","a":["Evlilik, yakınlık, milkiyet","Evlilik, miras, vasiyet","Yakınlık, komşuluk, velayet","Milkiyet, kefâet, vekâlet"],"x":"İnsan başkasına evlilik, yakınlık ya da milkiyet sebebiyle harcama yapar."},{"u":10,"q":"Kadının nafakayı hak etmesinin sebebi nedir?","a":["Sahih akit sebebiyle kocası için hapsolunması","Fakir olması","Gayrimüslim olup İslam'a ısındırılması","Mehrini almamış olması"],"x":"Kaide: \"Her insan başka bir insandan ötürü hapsolunmuştur.\" Sebep kadının fakirliği ya da te'lif-i kalb değildir."},{"u":10,"q":"Fasit akitte kocanın kadına nafaka vermesinin hükmü nedir?","a":["Nafaka yoktur; vermişse teberrudur.","Nafaka vaciptir.","Nafakanın yarısı vaciptir.","Hakim takdir ederse vaciptir."],"x":"Nafakanın birinci şartı şer'an sahih akittir; fasit akitte nafaka yoktur, verilmişse teberru sayılır."},{"u":10,"q":"Aşağıdaki durumlardan hangisinde kadının nafaka hakkı düşer?","a":["Kadın bir suç işlediği için hakim tarafından hapse gönderilmişse","Koca emin olmadığı için kadın eve gitmiyorsa","Kocanın kusuru yüzünden kadın eve gitmiyorsa","Kadın evdeyse"],"x":"d ve e durumlarında (kadının kendinden kaynaklanan ya da başka sebeple, ör. hapis veya gasp) erkek hapsetme hakkını kaybettiği için nafaka düşer."},{"u":10,"q":"Şemaya göre koca karısını sefere ancak hangi üç şartla zorlayabilir?","a":["Sefer kasr mesafesinden az, şehirden şehre ve koca güvenilir olmalı","Kadın razı, mehir ödenmiş ve şahit bulunmalı","Sefer bir aydan kısa, mahrem bulunmalı ve nafaka peşin verilmeli","Hakim izni, velinin izni ve kadının rızası olmalı"],"x":"«ليس للزوج أن يجبر زوجته على السفر معه إلا بثلاثة شروط: دون مسافة القصر، من مصر إلى مصر، الزوج مأمونا عليه»."},{"u":10,"q":"Kocasının hanesinden izinsiz çıkıp kendisini haksız yere kocasından men eden kadına ne denir?","a":["Nâşize","Müfevviza","Mu'tedde","Mefkûde"],"x":"Nâşize: kocasının evinden izinsiz çıkıp kendisini haksız yere kocasından men eden kadın; nafakası düşer."},{"u":10,"q":"Nafakanın iki eşin birlikte hâline göre takdir edileceğini söyleyenler kimlerdir?","a":["Mâlik ve Ahmed (Hanefîlerde râcih)","Şâfiî ve Kerhî","Ebû Yûsuf ve Züfer","Dâvûd ez-Zâhirî"],"x":"Mâlik ve Ahmed'e göre iki eşin hâline göre takdir edilir, Hanefî alimlerine göre râcih olan da budur. Şâfiî'ye göre yalnız kocanın hâline bakılır; Hanefîlerden Kerhî bunu seçmiştir."},{"u":10,"q":"Hükme rağmen nafaka ödemeyen zengin kocanın açıkta malı yoksa hakim ne yapar?","a":["İki üç kez mahkemeye çağırır, yine ödemezse hapseder.","Hemen nikahı fesheder.","Kadının akrabalarına yükler.","Kadına borçlanmasını emreder."],"x":"Açıkta malı varsa hakim onu satar; yoksa kadın isterse iki-üç kez çağırdıktan sonra inatçı olduğu için hapsini emreder."},{"u":10,"q":"Hanefilere göre nafaka ödeyemeyen fakir koca hakkında ne yapılır?","a":["Aralarında tefrik yapılmaz; hakim nafaka takdir eder, kadın borçlanır.","Nikah hemen feshedilir.","Koca hapsedilir.","Kadın talak isteyebilir."],"x":"Hanefiler: darlık sebebiyle tefrik yapılmaz (Bakara 2/280 \"darlık içindeyse genişliğe kadar mühlet\"). Şâfiî'nin cedîd görüşüne göre kadın fesih isteyebilir."},{"u":10,"q":"Aşağıdakilerden hangisi meskenin şartlarından değildir?","a":["Müstakil bir ev olması","Kocanın mali hâline yaraşır olması","Boş olması","Kadının can ve malından güvende olması"],"x":"Evin müstakil olması ile kat olması aynıdır; örf belirleyicidir. Dört şart: kocanın hâline yaraşır, boş, ihtiyaçları karşılayan, güvenli."},{"u":10,"q":"Kayıp (mefkûd) kocanın karısı hakkında Şâfiîlere göre koca fakir ve yeri bilinmiyorsa ne olur?","a":["Kadın akdi fesheder.","Kadın kocanın malından nafaka alır.","Hakim kocanın bulunduğu yerdeki hakime mektup yazar.","Kadın borçlanır."],"x":"Şâfiîlere göre koca zengin ve yeri biliniyorsa oradaki hakime mektup yazılır; zengin ama yeri bilinmiyorsa ihtilaflıdır; fakir ve yeri bilinmiyorsa kadın akdi fesheder."}, <script>
/* ---------- yardımcılar ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => String(s).toLocaleLowerCase('tr').normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/[’'ʿʾ‘`"]/g, '').replace(/ı/g, 'i').replace(/[^a-z0-9؀-ۿ ]/g, ' ').replace(/\s+/g, ' ').trim();
const strip = h => String(h).replace(/<[^>]+>/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/\s+/g, ' ').trim();
const plain = s => String(s).replace(/\*\*/g, '').replace(/[«»]/g, '').replace(/\[\[|\]\]/g, '');
// Metin biçimi: **kalın**, «Arapça»
function fmt(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/«([^»]+)»/g, (m, a) => /[؀-ۿ]/.test(a) ? `<span class="ar" dir="rtl" lang="ar">${a}</span>` : `«${a}»`)
    .replace(/\[\[(.+?)\]\]/g, '<span class="ek" title="Ek · onay bekliyor">$1</span>');
}

/* ---------- kalıcı durum (tarayıcıda, ön ek: ah_) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('ah_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ah_' + k, JSON.stringify(v)); } catch (e) {} }
};
let stats = store.get('stats', {});   // anahtar -> {ok, bad}
let boxes = store.get('boxes', {});   // tanım id -> kutu 1..5
let oral  = store.get('oral', {});    // bölüm anahtarı -> 1/0
let uStat = store.get('units', {});   // ünite -> en iyi mini test (0-5)
function record(key, ok) { const s = stats[key] || {ok: 0, bad: 0}; ok ? s.ok++ : s.bad++; stats[key] = s; store.set('stats', stats); ozet(true); }
/* ---------- Giray Akademi özeti (alt çubuk · Karnem) ---------- */
const YAD = {home: 'Ana sayfa', study: 'Üniteler', quiz: 'Test', match: 'Görüş eşleştirme', flash: 'Kavram kartları', oralView: 'Konu tekrarı', review: 'Hızlı tekrar', exam: 'Geçmiş sınav soruları', browse: 'Sözlük', progress: 'İlerlemem'};
function yer() {
  const v = curView, a = curArg;
  if (v === 'unitView') return {ad: (a + 1) + '. ünite', url: '/ahval/#unitView-' + a};
  if (v === 'quiz' && a && a.unit !== undefined && a.unit !== null) return {ad: (a.unit + 1) + '. ünite testi', url: '/ahval/#unitView-' + a.unit};
  if (v === 'quiz' || v === 'home') return {ad: YAD[v], url: '/ahval/'};
  return {ad: YAD[v] || 'Ana sayfa', url: '/ahval/#' + v};
}
function ozet(aktif) {
  if (typeof gaOzet !== 'function') return;
  const tot = Object.values(stats).reduce((a, s) => ({ok: a.ok + s.ok, bad: a.bad + s.bad}), {ok: 0, bad: 0});
  const n = UNITELER.filter((u, i) => (uStat[i] || 0) >= GECME).length;
  gaOzet({bitti: n / UNITELER.length, etiket: n + '/' + UNITELER.length + ' ünite', d: tot.ok, y: tot.bad, kart: Object.values(boxes).filter(b => b >= 4).length, yer: yer(), aktif: !!aktif});
}
function alt(b) { if (typeof gaAltGizle === 'function') gaAltGizle(b); }

/* ---------- veri hazırlığı ---------- */
const TANIM = [], BOLUM = [];
UNITELER.forEach((u, ui) => u.s.forEach((s, si) => {
  BOLUM.push({u: ui, s: si, h: s.h});
  s.b.forEach(b => {
    if (b.k === 'd') TANIM.push({id: TANIM.length, u: ui, s: si, t: b.t, x: b.x});
    // İki sütunlu "… | Tanım/Anlamı" tabloları da kavram kartı olur
    if (b.k === 'tbl' && b.r[0].length === 2 && /^(Tanım|Anlamı)$/.test(b.r[0][1])) b.r.slice(1).forEach(r => TANIM.push({id: TANIM.length, u: ui, s: si, t: r[0].replace(/\*\*/g, '').replace(/^\d+\.\s*/, ''), x: r[1]}));
  });
}));
const ESER = ESER_T;
// Aynı adla birden çok müellife bağlanan eserler (el-Burhân, Mebâhis, Tefsir Usûlü…) ve bir müellifin birden çok eseri tek sorudan fazla üretilmez
const eserSay = {}; ESER.forEach(r => { const k = norm(r.e); (eserSay[k] ||= new Set()).add(norm(r.m)); });
const ESER_Q = ESER.filter(r => eserSay[norm(r.e)].size === 1 && !/[,;]/.test(r.e)).filter((r, i, a) => a.findIndex(x => norm(x.e) === norm(r.e)) === i);
ESER_Q.forEach((r, i) => r.id = i);
const GECME = 4;
const uDone = () => UNITELER.filter((u, i) => (uStat[i] || 0) >= GECME).length;

/* ---------- soru üretici ---------- */
// Havuz öğesi: {key, u, make()}
const maskTerm = (x, t) => {
  let out = x;
  t.replace(/\(.*?\)/g, '').split(/[\s\-–]+/).filter(w => w.length > 3 && !/^(kur'an|kuran|ayet|âyet)$/i.test(w)).forEach(w => {
    out = out.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), '…');
  });
  return out;
};
function pickDistinct(cands, n, keyFn, exclude) {
  const seen = new Set(exclude.map(keyFn)), out = [];
  for (const c of cands) { const k = keyFn(c); if (!seen.has(k)) { seen.add(k); out.push(c); if (out.length === n) break; } }
  return out;
}
const nearFirst = (list, u) => [...shuffle(list.filter(x => x.u === u)), ...shuffle(list.filter(x => Math.abs(x.u - u) <= 2 && x.u !== u)), ...shuffle(list.filter(x => Math.abs(x.u - u) > 2))];
function qTanim(d) {
  const tersi = Math.random() < 0.65;
  const fk = x => norm(x.t);
  if (tersi) {   // tanımı göster, kavramı sor
    const metin = maskTerm(d.x, d.t);
    const cands = nearFirst(TANIM.filter(x => x.id !== d.id && !norm(d.x).includes(norm(x.t))), d.u);
    const dis = pickDistinct(cands, 3, fk, [d]);
    return {key: 'd:' + d.id, u: d.u, s: d.s, long: true, soru: `<small>Aşağıdaki tanım hangi kavrama aittir?</small>${fmt(metin)}`, dogru: d.t, sec: shuffle([d.t, ...dis.map(x => x.t)]), aciklama: `<b>${fmt(d.t)}:</b> ${fmt(d.x)}`};
  }
  const cands = nearFirst(TANIM.filter(x => x.id !== d.id && norm(x.x) !== norm(d.x)), d.u);
  const dis = pickDistinct(cands, 3, x => norm(x.x).slice(0, 60), [d]);
  const kisalt = x => plain(maskTerm(x.x, x.t));
  return {key: 'd:' + d.id, u: d.u, s: d.s, soru: `<small>Hangisi bu kavramın tanımıdır?</small><em>${fmt(d.t)}</em>`, dogru: kisalt(d), sec: shuffle([kisalt(d), ...dis.map(kisalt)]), aciklama: `<b>${fmt(d.t)}:</b> ${fmt(d.x)}`};
}
function qEser(r) {
  const cands = nearFirst(ESER.filter(x => norm(x.m) !== norm(r.m)), r.u);
  const dis = pickDistinct(cands, 3, x => norm(x.m), [r]);
  return {key: 'e:' + r.id, u: r.u, s: r.s, soru: `<small>Bu görüş kimindir?</small><em>${fmt(r.e)}</em>`, dogru: r.m, sec: shuffle([r.m, ...dis.map(x => x.m)]), aciklama: `<b>${fmt(r.e)}</b> → ${fmt(r.m)}`};
}
const AGQ = [];   // karar ağaçlarının uç noktaları → "bu durumda hüküm nedir?" soruları
UNITELER.forEach((u, ui) => u.s.forEach((s, si) => s.b.forEach(b => { if (b.k !== 'agac') return;
  const L = agYapraklar(b.r), farkli = new Set(L.map(y => norm(y.n.x)));
  if (farkli.size >= 4) L.forEach(y => AGQ.push({u: ui, s: si, b, L, y}));
})));
function qAgac(i) {
  const g = AGQ[i], dis = shuffle(g.L.filter(x => norm(x.n.x) !== norm(g.y.n.x))).filter((x, j, a) => a.findIndex(z => norm(z.n.x) === norm(x.n.x)) === j).slice(0, 3);
  return {key: 'g:' + g.u + '-' + g.s + '-' + g.y.yol.join('.'), u: g.u, s: g.s, long: true, soru: `<small>Şema: ${fmt(g.b.t)}</small>${g.y.ad.map(x => fmt(x)).join(' › ')}<br><small>Bu durumda hüküm nedir?</small>`, dogru: plain(g.y.n.x), sec: shuffle([g.y, ...dis].map(x => plain(x.n.x))), aciklama: `<b>${AG_AD[g.y.n.s]}:</b> ${fmt(g.y.n.x)}${g.y.n.not ? ' — ' + fmt(g.y.n.not) : ''}`};
}
function qEl(i) {
  const q = SORULAR[i];
  return {key: 'q:' + i, u: q.u, soru: fmt(q.q), dogru: q.a[0], sec: shuffle(q.a), aciklama: fmt(q.x)};
}
const HAVUZ = [
  ...SORULAR.map((q, i) => ({key: 'q:' + i, u: q.u, make: () => qEl(i)})),
  ...TANIM.map(d => ({key: 'd:' + d.id, u: d.u, make: () => qTanim(d)})),
  ...ESER_Q.map(r => ({key: 'e:' + r.id, u: r.u, make: () => qEser(r)})),
  ...AGQ.map((g, i) => ({key: 'g:' + g.u + '-' + g.s + '-' + g.y.yol.join('.'), u: g.u, make: () => qAgac(i)}))
];
function weightedPick(list, n) {
  const w = list.map(x => { const s = stats[x.key]; return s ? 1 + s.bad * 2 - s.ok * .5 : 1.5; });
  const out = [], used = new Set();
  while (out.length < Math.min(n, list.length)) {
    let tot = 0; list.forEach((x, i) => { if (!used.has(i)) tot += Math.max(w[i], .2); });
    let rnd = Math.random() * tot;
    for (let i = 0; i < list.length; i++) { if (used.has(i)) continue; rnd -= Math.max(w[i], .2); if (rnd <= 0) { used.add(i); out.push(list[i]); break; } }
  }
  return out;
}

/* ---------- yönlendirme ---------- */
const VIEWS = () => ({home, quiz, match, flash, oralView, review, browse, progress, study, unitView, exam});
let curView = 'home', curArg = null;
const navStack = [{view: 'home', arg: null}];
let pendingFocus = null;
function render(view, arg) {
  curView = view; curArg = arg ?? null;
  window.scrollTo(0, 0);
  VIEWS()[view](arg ?? undefined);
  ozet(false); alt(view === 'quiz' && !!(typeof Q !== 'undefined' && Q && Q.list && Q.list.length));
  if (pendingFocus) { const f = pendingFocus; pendingFocus = null; setTimeout(() => focusHit(f), 30); }
}
function go(view, arg) {
  const d = (history.state && history.state.d) || 0;
  const st = {view, arg: arg === undefined ? null : arg};
  if (curView === 'quiz' && view !== 'quiz') { st.d = d; navStack[d] = st; try { history.replaceState(st, ''); } catch (e) {} }
  else { st.d = d + 1; navStack.length = d + 1; navStack.push(st); try { history.pushState(st, ''); } catch (e) {} }
  render(view, arg);
}
function goUp(view, arg = null) {
  const d = (history.state && history.state.d) || 0, key = JSON.stringify(arg);
  for (let k = d - 1; k >= 0; k--) {
    const e = navStack[k];
    if (e && e.view === view && JSON.stringify(e.arg ?? null) === key) { try { history.go(k - d); return; } catch (er) { break; } }
  }
  go(view, arg ?? undefined);
}
function goBack() {

/* ---------- şemalar: karar ağacı ve açılır kart ---------- */
const AG = {};   // id → {b, mod, yol:[seçenek sırası], dn:{yol, sec, cevap}}

    const i = Q.unit, gecti = Q.dogru >= GECME;
    uStat[i] = Math.max(uStat[i] || 0, Q.dogru); store.set('units', uStat);
    const sonraki = i + 1 < UNITELER.length ? i + 1 : null;
    $('#app').innerHTML = `
    <div class="card result" style="margin-top:24px">
      <div class="big">${Q.dogru}/${n}</div>
      <p class="lead">${gecti ? '✓ Üniteyi tamamladın.' : `Geçmek için en az ${GECME} doğru gerekiyor. Üniteyi bir kez daha okuyup tekrar dene.`}</p>
      ${wrongList()}
      <div class="actions" style="justify-content:center">
        <button class="btn sec" onclick="go('study')">Ünite listesi</button>
        <button class="btn sec" onclick="go('unitView',${i})">Üniteye dön</button>
        ${gecti && sonraki !== null ? `<button class="btn" onclick="go('unitView',${sonraki})">Sonraki ünite →</button>` : `<button class="btn" onclick="quiz({unit:${i}})">Tekrar dene</button>`}
      </div>
    </div>`;
    return;
  }
  const keys = Q.yanlis.map(q => q.key);
  $('#app').innerHTML = `
  <div class="card result" style="margin-top:24px">
    <div class="big">${Q.dogru}/${n}</div>
    <p class="lead">%${p} başarı · ${p >= 80 ? 'Çok iyi gidiyorsun.' : p >= 50 ? 'Fena değil, yanlışları tekrar et.' : 'Bu konulara biraz daha çalışmak gerekiyor.'}</p>
    ${wrongList()}
    <div class="actions" style="justify-content:center">
      ${keys.length ? `<button class="btn sec" onclick='quiz({keys:${JSON.stringify(keys)}})'>Yanlışları tekrar et</button>` : ''}
      <button class="btn" onclick="quiz()">Yeni test</button>
    </div>
  </div>`;
}

/* ---------- eşleştirme ---------- */
let M = null;
function match() {
  const list = [], mu = new Set();
  for (const r of shuffle(ESER_Q)) { const k = norm(r.m); if (!mu.has(k)) { mu.add(k); list.push(r); } if (list.length === 5) break; }
  M = {list, left: shuffle(list), right: shuffle(list), sel: null, done: new Set(), hata: 0, t0: Date.now()};
  renderM();
}
function renderM() {
  $('#app').innerHTML = `
  <div class="bar"><div class="progress"><i style="width:${100 * M.done.size / M.list.length}%"></i></div><span class="count">${M.done.size} / ${M.list.length} · ${M.hata} hata</span></div>
  <p class="lead" style="margin-bottom:12px">Soldan bir görüş seç, sonra sağdan sahibine dokun.</p>
  <div class="match">
    <div class="col"><h4>Görüş</h4>${M.left.map(r => `<button class="tile ${M.done.has(r.id) ? 'done' : M.sel === r.id ? 'sel' : ''}" ${M.done.has(r.id) ? 'disabled' : ''} onclick="mSel(${r.id})">${fmt(r.e)}</button>`).join('')}</div>
    <div class="col"><h4>Görüş sahibi</h4>${M.right.map(r => `<button class="tile ${M.done.has(r.id) ? 'done' : ''}" id="mr-${r.id}" ${M.done.has(r.id) ? 'disabled' : ''} onclick="mPick(${r.id})">${fmt(r.m)}</button>`).join('')}</div>
  </div>`;
}
function mSel(id) { M.sel = id; renderM(); }
function mPick(id) {
  if (M.sel === null) return;
  if (M.sel === id) { M.done.add(id); record('e:' + id, true); M.sel = null; renderM(); if (M.done.size === M.list.length) mEnd(); }
  else { M.hata++; record('e:' + M.sel, false); const el = $('#mr-' + id); el.classList.add('wrong'); setTimeout(() => { el.classList.remove('wrong'); $('#app .bar .count').textContent = `${M.done.size} / ${M.list.length} · ${M.hata} hata`; }, 320); }
}
function mEnd() {
  const sn = Math.round((Date.now() - M.t0) / 1000);
  $('#app').innerHTML = `<div class="card result" style="margin-top:24px"><div class="big">✓</div><p class="lead">${sn} saniyede, ${M.hata} hatayla bitirdin.</p>
  <div class="list" style="text-align:left;margin-top:18px">${M.list.map(r => `<div class="row"><div class="e">${fmt(r.e)}</div><div class="n">${fmt(r.m)} · <span style="color:var(--muted)">Ünite ${r.u + 1}</span></div></div>`).join('')}</div>
  <div class="actions" style="justify-content:center"><button class="btn" onclick="match()">Yeni tur</button></div></div>`;
}

/* ---------- kavram kartları (Leitner) ---------- */
let F = null;
function flash(u) {
  const fu = (u === undefined || u === null) ? store.get('flashU', -1) : u;
  store.set('flashU', fu);
  const list = fu >= 0 ? TANIM.filter(d => d.u === fu) : TANIM;
  const sirali = shuffle(list).sort((a, b) => (boxes[a.id] || 0) - (boxes[b.id] || 0)).slice(0, 20);
  F = {list: shuffle(sirali), i: 0, bildim: 0, u: fu};
  renderF();
}
function unitSelect(cur, fn) {
  return `<select class="select" onchange="${fn}(+this.value)"><option value="-1">Bütün üniteler</option>${UNITELER.map((u, i) => `<option value="${i}" ${cur === i ? 'selected' : ''}>${i + 1}. ${esc(u.t)}</option>`).join('')}</select>`;
}
function renderF() {
  const d = F.list[F.i], kutu = boxes[d.id] || 0;
  $('#app').innerHTML = `
  <div class="rowctl">${unitSelect(F.u, 'flash')}</div>
  <div class="bar"><div class="progress"><i style="width:${100 * F.i / F.list.length}%"></i></div><span class="count">${F.i + 1} / ${F.list.length}</span></div>
  <div class="flash" onclick="this.classList.toggle('flip')"><div class="flash-in">
    <div class="face"><span class="tag">Ünite ${d.u + 1}</span><div class="t">${fmt(d.t)}</div><div class="s" style="color:var(--muted)">Tanımı nedir?</div><div class="hint">Çevirmek için dokun · kutu ${kutu}/5</div></div>
    <div class="face back"><div class="t" style="font-size:1.15rem">${fmt(d.t)}</div><div class="s">${fmt(d.x)}</div></div>
  </div></div>
  <div class="actions" style="justify-content:center">
    <button class="btn red" onclick="fAns(false)">Bilemedim</button>
    <button class="btn" onclick="fAns(true)">Bildim</button>
  </div>
  <div style="text-align:center;margin-top:10px">${bldButton('d:' + d.id, 'Kavram kartı · Ünite ' + (d.u + 1) + ' · ' + UNITELER[d.u].s[d.s].h, plain(d.t) + ': ' + plain(d.x))}</div>`;
}
function fAns(ok) {
  const d = F.list[F.i];
  boxes[d.id] = ok ? Math.min((boxes[d.id] || 0) + 1, 5) : 1; store.set('boxes', boxes); ozet(true);
  record('d:' + d.id, ok); if (ok) F.bildim++;
  F.i++;
  if (F.i < F.list.length) renderF();
  else $('#app').innerHTML = `<div class="card result" style="margin-top:24px"><div class="big">${F.bildim}/${F.list.length}</div><p class="lead">Deste bitti. Bilemediklerin bir sonraki destede önce gelecek.</p><div class="actions" style="justify-content:center"><button class="btn" onclick="flash()">Yeni deste</button></div></div>`;
}

/* ---------- konu tekrarı ---------- */
let O = null;
const bKey = b => b.u + '-' + b.s;
function oralView(u) {
  const fu = (u === undefined || u === null) ? store.get('oralU', -1) : u;
  store.set('oralU', fu);
  const list = BOLUM.filter(b => (fu < 0 || b.u === fu) && UNITELER[b.u].s[b.s].b.length >= 2);
  const sirali = shuffle(list).sort((a, b) => (oral[bKey(a)] ?? -1) - (oral[bKey(b)] ?? -1));
  O = {list: sirali.slice(0, 10), i: 0, u: fu};
  renderO();
}
function renderO() {
  const b = O.list[O.i], d = oral[bKey(b)], s = UNITELER[b.u].s[b.s];
  $('#app').innerHTML = `
  <div class="rowctl">${unitSelect(O.u, 'oralView')}</div>
  <div class="bar"><div class="progress"><i style="width:${100 * O.i / O.list.length}%"></i></div><span class="count">${O.i + 1} / ${O.list.length}</span></div>
  <div class="card">
    <div class="cardhead"><span class="tag">Ünite ${b.u + 1} · ${esc(UNITELER[b.u].t)}${d === 1 ? ' · daha önce bildin' : d === 0 ? ' · daha önce bilemedin' : ''}</span>${bldButton('b:' + b.u + '-' + b.s, 'Konu tekrarı · Ünite ' + (b.u + 1) + ' · ' + UNITELER[b.u].t, s.h)}</div>
    <div class="q">${fmt(s.h)}</div>
    <p class="lead" id="think" style="font-size:.9rem">Bu bölümde neler olduğunu önce kendin anlat (tanım, maddeler, görüşler), sonra içeriği aç.</p>
    <div class="answer lesson" id="ans">${s.b.map(blockHTML).join('')}</div>
    <div class="actions" id="oa"><button class="btn" onclick="showAns()">İçeriği göster</button></div>
  </div>`;
}
function showAns() {
  $('#ans').classList.add('show'); $('#think').classList.add('hide');
  $('#oa').innerHTML = `<button class="btn red" onclick="oAns(0)">Bilemedim</button><button class="btn" onclick="oAns(1)">Bildim</button>`;
}
function oAns(v) {
  oral[bKey(O.list[O.i])] = v; store.set('oral', oral); O.i++;
  if (O.i < O.list.length) renderO();
  else $('#app').innerHTML = `<div class="card result" style="margin-top:24px"><div class="big">✓</div><p class="lead">Bu turdaki ${O.list.length} bölümü bitirdin.</p><div class="actions" style="justify-content:center"><button class="btn" onclick="oralView()">Yeni tur</button></div></div>`;
}

/* ---------- hızlı tekrar ---------- */
function review(u) {
  const fu = (u === undefined || u === null) ? store.get('reviewU', -1) : u;
  store.set('reviewU', fu);
  const list = UNITELER.map((x, i) => i).filter(i => fu < 0 || i === fu);
  $('#app').innerHTML = `
  <h2 style="margin-top:22px">Hızlı tekrar</h2>
  <p class="lead">Her ünitenin en önemli maddeleri. Bir maddenin yanındaki › ile o bölüme gidebilirsin.</p>
  <div class="rowctl">${unitSelect(fu, 'review')}</div>
  ${list.map(i => `<div class="htu"><div class="htt"><span class="no">${i + 1}</span>${esc(UNITELER[i].t)}</div>${htHTML(i, true)}</div>`).join('')}`;
}

/* ---------- geçmiş sınav soruları ---------- */
function exam() {
  let k = 0;
  $('#app').innerHTML = `
  <h2 style="margin-top:22px">Geçmiş sınav soruları</h2>
  <p class="lead">Önce kendin cevapla, sonra <b>Cevabı göster</b>'e dokun. Cevaplar ünitelerdeki bilgilere dayanır; altındaki bağlantılar ilgili bölümü açar.</p>
  ${SINAV.map((g, gi) => `<div class="section-title">${esc(g.t)}</div>${g.q.map((q, qi) => { k++; const id = 'x' + gi + '-' + qi; return `<div class="exq"><div class="qq"><span class="no">${qi + 1}</span><span>${fmt(q.q)}</span>${bldButton('x:' + (gi + 1) + '-' + (qi + 1), 'Geçmiş sınav soruları · ' + g.t, plain(q.q))}</div>
    <div class="actions" style="justify-content:flex-start;margin-top:10px" id="${id}b"><button class="btn sec" onclick="exShow('${id}')">Cevabı göster</button></div>
    <div class="exa hide" id="${id}"><div class="exl">Cevap</div>${q.x.map(x => `<p>${fmt(x)}</p>`).join('')}${q.n ? `<div class="box bk" style="margin-top:8px"><b class="lb">Not</b>${fmt(q.n)}</div>` : ''}
    ${q.r.length ? `<div class="links">${q.r.map(([u, s]) => `<button onclick="toSection(${u},${s})">Ü${u + 1} · ${esc(UNITELER[u].s[s].h)}</button>`).join('')}</div>` : ''}</div></div>`; }).join('')}`).join('')}`;
}
function exShow(id) { $('#' + id).classList.remove('hide'); $('#' + id + 'b').classList.add('hide'); }
function toSection(u, s) { pendingFocus = {id: `ls-${u}-${s}`}; go('unitView', u); }

/* ---------- sözlük ---------- */
let bTab = 'kavram';
function browse() {
  $('#app').innerHTML = `
  <h2 style="margin-top:22px">Kavram ve görüş sözlüğü</h2>
  <div class="rowctl" style="margin:12px 0 10px">
    <button class="btn ${bTab === 'kavram' ? '' : 'sec'}" onclick="bTab='kavram';browse()">Kavramlar (${TANIM.length})</button>
    <button class="btn ${bTab === 'eser' ? '' : 'sec'}" onclick="bTab='eser';browse()">Görüşler (${ESER.length})</button>
  </div>
  <input class="search" id="bq" type="search" placeholder="${bTab === 'kavram' ? 'Kavram ya da tanımda ara…' : 'Görüş ya da imam ara…'}" oninput="doBrowse()">
  <div class="list" id="bl"></div>`;
  doBrowse();
}
function doBrowse() {
  const t = norm($('#bq').value || '');
  const src = bTab === 'kavram' ? TANIM : ESER;
  const hits = src.filter(r => !t || norm(bTab === 'kavram' ? r.t + ' ' + r.x : r.e + ' ' + r.m).includes(t));
  $('#bl').innerHTML = hits.length ? hits.map(r => bTab === 'kavram'
    ? `<button class="row" onclick="toSection(${r.u},${r.s})"><div class="e">${fmt(r.t)}</div><div class="n">${fmt(r.x)}</div><div class="w">Ünite ${r.u + 1} · ${esc(UNITELER[r.u].s[r.s].h)}</div></button>`
    : `<button class="row" onclick="toSection(${r.u},${r.s})"><div class="e">${fmt(r.e)}</div><div class="n">${fmt(r.m)}${r.not ? ` <span style="color:var(--muted)">(${fmt(r.not)})</span>` : ''}</div><div class="w">Ünite ${r.u + 1} · ${esc(UNITELER[r.u].s[r.s].h)}</div></button>`).join('')
    : '<p class="empty">Sonuç yok.</p>';
}

/* ---------- ilerleme ---------- */
function progress() {
  const satir = UNITELER.map((u, i) => {
    let ok = 0, bad = 0; unitItems(i).forEach(x => { const s = stats[x.key]; if (s) { ok += s.ok; bad += s.bad; } });
    const p = ok + bad ? Math.round(100 * ok / (ok + bad)) : null;
    return `<div class="meter"><span title="${esc(u.t)}">${i + 1}. ${esc(u.t)}</span><div class="progress"><i style="width:${p ?? 0}%;background:${p === null ? 'transparent' : p >= 70 ? 'var(--green-2)' : p >= 45 ? 'var(--gold)' : 'var(--red)'}"></i></div><span class="count">${p === null ? '—' : '%' + p}</span></div>`;
  }).join('');
  const byKey = {}; HAVUZ.forEach(x => byKey[x.key] = x);
  const zayif = Object.entries(stats).filter(([k, s]) => s.bad > 0 && byKey[k]).sort((a, b) => (b[1].bad - b[1].ok * .5) - (a[1].bad - a[1].ok * .5)).slice(0, 12).map(([k]) => k);
  const etiket = k => { const [t, id] = k.split(':');
    if (t === 'd') return `<b>${fmt(TANIM[id].t)}</b>: ${fmt(TANIM[id].x)}`;
    if (t === 'e') return `<b>${fmt(ESER_Q[id].e)}</b> → ${fmt(ESER_Q[id].m)}`;
    return `${fmt(SORULAR[id].q)} <b>${fmt(SORULAR[id].a[0])}</b>`; };
  const oralN = Object.keys(oral).length, oralOk = Object.values(oral).filter(v => v === 1).length;
  $('#app').innerHTML = `
  <h2 style="margin-top:22px">İlerlemem</h2>
  <div class="card" style="margin-top:14px">${satir}
    <p class="lead" style="font-size:.88rem;margin-top:12px">Çalış bölümü: ${uDone()} / ${UNITELER.length} ünite tamamlandı.<br>Konu tekrarı: ${oralN} bölüm çalışıldı, ${oralOk} tanesini bildin.</p></div>
  <div class="section-title">En çok karıştırdıkların</div>
  ${zayif.length ? `<div class="list">${zayif.map(k => `<div class="row"><div class="n">${etiket(k)}</div></div>`).join('')}</div>
    <div class="actions"><button class="btn" onclick='quiz({keys:${JSON.stringify(zayif)}})'>Bunlarla test çöz</button></div>` : '<p class="empty">Henüz yanlış yok. Biraz test çözünce burada görünecek.</p>'}
  <div class="actions" style="margin-top:30px"><button class="btn sec" onclick="sifirla()">İlerlemeyi sıfırla</button></div>`;
}
function sifirla() {
  if (!confirm('Bütün ilerleme kaydın silinsin mi?')) return;
  stats = {}; boxes = {}; oral = {}; uStat = {};
  store.set('stats', stats); store.set('boxes', boxes); store.set('oral', oral); store.set('units', uStat); progress();
}

/* ---------- genel arama ---------- */
let SIDX = null;
function bTxt(b) {
  if (b.k === 'agac') return plain(b.t) + ' · ' + agYapraklar(b.r).map(y => y.ad.map(plain).join(' › ') + ': ' + plain(y.n.x)).join(' · ');
  if (b.k === 'kart') return plain(b.t) + ' · ' + b.g.map(g => plain(g.h) + ': ' + g.m.map(plain).join(' · ')).join(' · ');
  if (b.k === 'tbl') return b.r.map(r => r.filter(Boolean).map(plain).join(' – ')).join(' · ');
  if (b.k === 'steps') return b.x.map(plain).join(' · ');
  if (b.k === 'ar') return plain(b.x || '');
  if (b.k === 'sc') return plain(b.q + ' ' + b.x);
  return plain((b.t ? b.t + ': ' : '') + b.x);
}
function buildIndex() {
  SIDX = [];
  UNITELER.forEach((u, ui) => u.s.forEach((s, si) => {
    SIDX.push({u: ui, s: si, kind: 'b', t: s.h, x: s.b.map(bTxt).join(' · ')});
  }));
}
function openSearch() {
  if (!SIDX) buildIndex();
  $('#sov').classList.add('open');
  try { history.pushState(Object.assign({}, history.state, {search: true}), ''); } catch (e) {}
  $('#sq').value = ''; doGlobalSearch(); setTimeout(() => $('#sq').focus(), 30);
}
function closeSearch(viaPop) {
  $('#sov').classList.remove('open');
  if (!viaPop && history.state && history.state.search) { try { history.back(); } catch (e) {} }
}
function markText(text, t) {
  const n = norm(text); const i = n.indexOf(t);
  if (!t || i < 0) return esc(text.slice(0, 160)) + (text.length > 160 ? '…' : '');
  // norm uzunluğu yaklaşık korunduğundan konuma yakın bir pencere al
  const a = Math.max(0, i - 60), b = Math.min(text.length, i + t.length + 100);
  return (a ? '…' : '') + esc(text.slice(a, b)) + (b < text.length ? '…' : '');
}
function doGlobalSearch() {
  const t = norm($('#sq').value || '');
  if (t.length < 2) { $('#sres').innerHTML = '<p class="empty">En az iki harf yaz.</p>'; return; }
  const kav = TANIM.filter(d => norm(d.t).includes(t)).slice(0, 12);
  const bol = SIDX.filter(r => norm(r.t + ' ' + r.x).includes(t)).slice(0, 30);
  $('#sres').innerHTML = (kav.length ? `<div class="sgrp">Kavramlar</div>${kav.map(d => `<button class="sitem" onclick="hit(${d.u},${d.s})"><div class="w">Ünite ${d.u + 1}</div><div class="t">${fmt(d.t)}</div><div class="x">${esc(plain(d.x).slice(0, 140))}</div></button>`).join('')}` : '')
    + (bol.length ? `<div class="sgrp">Konu anlatımları</div>${bol.map(r => `<button class="sitem" onclick="hit(${r.u},${r.s})"><div class="w">Ünite ${r.u + 1} · ${esc(UNITELER[r.u].t)}</div><div class="t">${esc(r.t)}</div><div class="x">${markText(r.x, t)}</div></button>`).join('')}` : '')
    || '<p class="empty">Sonuç yok.</p>';
}
function hit(u, s) { $('#sov').classList.remove('open'); pendingFocus = {id: `ls-${u}-${s}`}; if (history.state && history.state.search) { try { history.replaceState({view: curView, arg: curArg, d: (history.state.d || 0)}, ''); } catch (e) {} } go('unitView', u); }
function focusHit(f) { jump(f.id); }

/* ---------- başlat ---------- */
const ilkHash = (location.hash || '').slice(1);
try { history.replaceState({view: 'home', arg: null, d: 0}, '', location.pathname + location.search); } catch (e) {}
render('home');
// Alt çubuktaki "Devam et" / "Dersler" bağlantısıyla gelindiyse kaldığı yere aç (ör. #unitView-7)
(function () {
  const h = ilkHash; if (!h) return;
  const m = h.match(/^(\w+?)(?:-(\d+))?$/); if (!m) return;
  const v = m[1], a = m[2] === undefined ? undefined : +m[2];
  if (!['study', 'unitView', 'match', 'flash', 'oralView', 'review', 'exam', 'browse', 'progress'].includes(v)) return;
  if (v === 'unitView' && !(a >= 0 && a < UNITELER.length)) return;
  if (v === 'unitView') { go('study'); go('unitView', a); } else go(v);
})();
</script>
</body>
