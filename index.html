<style>
:root{
  --paper:#f7f3ea; --card:#fffdf8; --ink:#1f2a24; --muted:#6b7068; --line:#e3dccb;
  --green:#1f5a45; --green-2:#2f7a5f; --green-soft:#e4efe8; --gold:#b08a3e; --gold-soft:#f4ead3;
  --red:#a8432f; --red-soft:#f6e1db; --radius:14px; --shadow:0 1px 2px rgba(40,30,10,.06),0 6px 20px rgba(40,30,10,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ar:Amiri,"Traditional Arabic","Scheherazade New","Noto Naskh Arabic",serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body{padding-bottom:34px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 64px}
header.top{position:sticky;top:0;z-index:5;background:rgba(247,243,234,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.brand{white-space:nowrap;display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:1.15rem;font-weight:700;color:var(--green);background:none;border:0;padding:0}
.crumb{display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 auto}
.crumb .brand{min-width:0}.crumb .bt{overflow:hidden;text-overflow:ellipsis}
.ga{display:grid;text-decoration:none;border-radius:8px}
.ga .mark,.brand .pmark{width:30px;height:30px;border-radius:8px;background:var(--green);color:#f4c430;display:grid;place-items:center;flex:none}
.ga:hover .mark{background:var(--green-2)}
.csep{color:var(--line);font-size:1.3rem;line-height:1;margin:0 1px}
.brand .pmark{background:var(--gold-soft);color:var(--green);border:1px solid #e6d6ae}
.spacer{flex:1}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.88rem;color:var(--muted)}
.ghost:hover{border-color:var(--green-2);color:var(--green)}
.iconbtn{padding:6px 10px;display:inline-grid;place-items:center}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0}
h1{font-size:1.7rem;color:var(--green)}
h2{font-size:1.3rem}
.lead{color:var(--muted);margin:6px 0 0}
.hero{padding:28px 0 8px}
.hero .arn{font-family:var(--ar);font-size:1.5rem;color:var(--gold);margin-top:2px;text-align:left}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:110px}
.stat b{display:block;font-family:var(--serif);font-size:1.35rem;color:var(--green)}
.stat span{font-size:.8rem;color:var(--muted)}
.section-title{margin:26px 0 10px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.mode{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.mode:hover{transform:translateY(-2px);border-color:var(--green-2)}
.mode .ico{font-size:1.4rem;width:40px;height:40px;border-radius:10px;background:var(--green-soft);display:grid;place-items:center;margin-bottom:10px}
.mode h3{font-size:1.08rem;margin-bottom:4px}
.mode p{margin:0;color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.bar{display:flex;align-items:center;gap:10px;margin:18px 0 12px}
.progress{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--green-2);transition:width .3s}
.count{font-size:.85rem;color:var(--muted);white-space:nowrap}
.tag{display:inline-block;font-size:.75rem;background:var(--gold-soft);color:#7a5c1e;border-radius:999px;padding:2px 10px;margin-bottom:10px}
.q{font-family:var(--serif);font-size:1.25rem;margin:4px 0 18px}
.q.long{font-family:var(--sans);font-size:1.02rem;line-height:1.6;background:var(--paper);border-radius:12px;padding:12px 14px}
.q em{font-style:normal;color:var(--green);font-weight:700}
.q small{display:block;font-family:var(--sans);font-size:.85rem;color:var(--muted);margin-bottom:6px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1rem;display:flex;gap:10px;align-items:flex-start}
.opt .k{flex:none;width:24px;height:24px;border-radius:6px;background:var(--paper);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted)}
.opt:hover:not([disabled]){border-color:var(--green-2)}
.opt.ok{border-color:var(--green-2);background:var(--green-soft)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt[disabled]{cursor:default}
.explain{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--paper);font-size:.93rem;display:none}
.explain.show{display:block}
.explain b{color:var(--green)}
.explain .src{display:block;color:var(--muted);font-size:.82rem;margin-top:6px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:11px 18px;background:var(--green);color:#fff;font-weight:600}
.btn:hover{background:var(--green-2)}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--red)}
.btn:disabled{opacity:.4;cursor:default}
.result{text-align:center;padding:30px 20px}
.big{font-family:var(--serif);font-size:3rem;color:var(--green);line-height:1}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:grid;gap:8px;align-content:start}
.col h4{margin:0 0 2px;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.93rem;min-height:52px;transition:all .15s}
.tile.sel{border-color:var(--gold);background:var(--gold-soft)}
.tile.done{border-color:var(--green-soft);background:var(--green-soft);color:var(--green);opacity:.75}
.tile.wrong{animation:shake .3s;border-color:var(--red);background:var(--red-soft)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.flash{perspective:1200px;min-height:280px;cursor:pointer;margin-top:4px}
.flash-in{position:relative;min-height:280px;transition:transform .45s;transform-style:preserve-3d}
.flash.flip .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);overflow:auto}
.face.back{transform:rotateY(180deg);background:#fbf7ec}
.face .t{font-family:var(--serif);font-size:1.5rem;color:var(--green)}
.face .s{color:var(--ink);font-size:.98rem;margin-top:10px;max-width:560px;line-height:1.6}
.face .hint{position:absolute;bottom:12px;font-size:.78rem;color:var(--muted)}
.answer{display:none;margin-top:6px;border-top:1px dashed var(--line);padding-top:14px}
.answer.show{display:block}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:1rem}
.search:focus{outline:none;border-color:var(--green-2)}
.list{margin-top:12px;display:grid;gap:8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%;display:block}
button.row:hover{border-color:var(--green-2)}
.row .e{font-family:var(--serif);font-weight:700;font-size:1.05rem;color:var(--green)}
.row .n{font-size:.93rem;margin-top:3px;line-height:1.55}
.row .w{font-size:.76rem;color:var(--muted);margin-top:4px}
.empty{color:var(--muted);text-align:center;padding:30px}
.meter{display:grid;grid-template-columns:minmax(120px,240px) 1fr 54px;gap:10px;align-items:center;margin:8px 0;font-size:.9rem}
.meter span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter .progress{height:10px}
.select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:.9rem;max-width:100%}
.rowctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.kaynak{margin:28px auto 8px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:.78rem;text-align:center}
.foot{margin-top:40px;color:var(--muted);font-size:.8rem;text-align:center}
.sig{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;padding:5px 12px calc(5px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);font-family:var(--sans);font-size:.7rem;letter-spacing:.02em;color:var(--muted)}
.sig b{color:var(--green);font-weight:600}
.sig i{font-style:normal;opacity:.5}
.study-cta{display:flex;gap:14px;align-items:center;background:var(--green);color:#fff;border:0;border-radius:var(--radius);padding:18px;text-align:left;width:100%;box-shadow:var(--shadow);margin-bottom:12px}
.study-cta:hover{background:var(--green-2)}
.study-cta .ico{font-size:1.5rem;width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.study-cta h3{font-size:1.15rem;margin-bottom:2px;color:#fff}
.study-cta p{margin:0;opacity:.85;font-size:.9rem}
.ulist{display:grid;gap:8px}
.unit{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.unit:hover{border-color:var(--green-2)}
.unit .st{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:var(--muted);font-weight:700}
.unit.done .st{background:var(--green-2);border-color:var(--green-2);color:#fff}
.unit.next .st{border-color:var(--gold);color:var(--gold)}
.unit .ut{flex:1}.unit .ut b{display:block;font-weight:600}.unit .ut small{color:var(--muted)}
.intro{font-size:1.02rem;margin:10px 0 14px}
.tipbox{background:var(--gold-soft);border-left:4px solid var(--gold);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:.95rem}
.tipbox b.lb{color:#7a5c1e;display:block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
details.oq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:8px}
details.oq summary{cursor:pointer;font-weight:600}
.sticky-go{position:sticky;bottom:40px;display:flex;justify-content:center;margin-top:20px}
.sticky-go .btn{box-shadow:0 6px 20px rgba(31,90,69,.3);padding:11px 20px;font-size:.95rem}
.backlink{background:none;border:0;color:var(--green);font-weight:600;padding:14px 0 0;font-size:.95rem}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.toc button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:.8rem;color:var(--muted)}
.toc button:hover{border-color:var(--green-2);color:var(--green)}
.lesson section.ls{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0;scroll-margin-top:70px}
.lesson h3{font-family:var(--serif);font-size:1.12rem;color:var(--ink);display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;line-height:1.35}
.lesson h3 .no{flex:none;width:26px;height:26px;border-radius:8px;background:var(--green-soft);color:var(--green);font-family:var(--sans);font-size:.8rem;font-weight:700;display:grid;place-items:center;margin-top:1px}
.lesson h4{font-family:var(--sans);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin:14px 0 6px}
.lesson p{margin:0 0 8px;font-size:.98rem;line-height:1.65}
.lesson p.li{padding-left:16px;position:relative}.lesson p.li:before{content:"•";position:absolute;left:3px;color:var(--gold);font-weight:700}
.lesson p.num{padding-left:24px;position:relative}.lesson p.num .nn{position:absolute;left:0;color:var(--green);font-weight:700}
.lesson b{color:var(--green)}
.def{display:grid;grid-template-columns:minmax(110px,30%) 1fr;gap:4px 14px;padding:10px 12px;border-radius:10px;background:var(--green-soft);margin:8px 0}
.def dt{font-family:var(--serif);font-weight:700;color:var(--green)}
.def dd{margin:0;line-height:1.6}
.ar{font-family:var(--ar);font-size:1.18em;line-height:1.9;direction:rtl;unicode-bidi:isolate;color:#5b3f86}
.ar.blk{display:block;text-align:right;margin:4px 0}
.ayet{display:block;font-family:var(--ar);font-size:1.3rem;line-height:2.1;direction:rtl;text-align:right;color:#5b3f86;margin:4px 0 2px}
.sov{position:fixed;inset:0;z-index:90;background:rgba(20,25,20,.35);display:none}
.sov.open{display:block}
.sbox{background:var(--paper);max-width:860px;margin:0 auto;height:100%;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.sbar{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card);color:var(--muted)}
.sbar input{flex:1;border:0;background:transparent;font-size:1.05rem;padding:8px 2px;color:var(--ink);outline:none;min-width:0}
.sres{overflow:auto;padding:4px 14px 80px;flex:1}
.sgrp{margin:16px 0 6px;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sitem{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0}
.sitem:hover{border-color:var(--green-2)}
.sitem .t{font-weight:600}.sitem .w{font-size:.78rem;color:var(--green);font-weight:600;margin-bottom:2px}
.sitem .x{font-size:.88rem;color:var(--muted);margin-top:3px}
mark{background:#f6df9b;color:inherit;border-radius:3px;padding:0 1px}
.flash-target{animation:ft 2.2s ease}
@keyframes ft{0%,40%{box-shadow:0 0 0 3px var(--gold)}100%{box-shadow:none}}
.how{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin:8px 0 14px}
.how summary{cursor:pointer;font-weight:700;color:var(--green);font-family:var(--serif);font-size:1.05rem}
.how .steps{margin:10px 0 6px;padding-left:22px;display:grid;gap:8px;font-size:.94rem}
.how .steps li::marker{color:var(--gold);font-weight:700}
.hownote{margin:6px 0 2px;color:var(--muted);font-size:.86rem}
.exq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.exq .qq{font-family:var(--serif);font-size:1.05rem;font-weight:700;display:flex;gap:10px}
.exq .qq .no{flex:none;width:26px;height:26px;border-radius:8px;background:var(--gold-soft);color:#7a5c1e;font-family:var(--sans);font-size:.8rem;display:grid;place-items:center}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.links button{border:1px solid var(--line);background:var(--green-soft);color:var(--green);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:600}
.oralbody{max-height:none}
.snote{font-size:.86rem;color:var(--muted);margin-top:8px;font-family:var(--sans)}
.lesson h3 .rep{margin-left:auto;flex:none;margin-top:2px}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.exq .qq .rep{margin-left:auto;flex:none}
.hide{display:none!important}

/* ---------- Ahvalu'ş-Şahsiyye: öğretici görünüm ---------- */
.lesson h5{font-family:var(--sans);font-size:.92rem;color:var(--green);margin:12px 0 6px}
.box{border-radius:10px;padding:11px 14px;margin:10px 0;font-size:.95rem;line-height:1.6;border-left:4px solid}
.box b.lb{display:block;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.box.bn{background:var(--gold-soft);border-color:var(--gold)}.box.bn b.lb{color:#7a5c1e}
.box.bk{background:var(--red-soft);border-color:var(--red)}.box.bk b.lb{color:var(--red)}
.box.bo{background:#fff;border:1px dashed var(--green-2);border-left:4px solid var(--green-2)}.box.bo b.lb{color:var(--green-2)}
.box.bs{background:#eef1f6;border-color:#4a6283}.box.bs b.lb{color:#4a6283}
.box.bs .sq{font-weight:600;margin:0 0 6px!important}.box.bs .sa{margin:0!important}.box.bs .sa b{color:#4a6283}
.arb{background:#f8f5fb;border-radius:10px;padding:8px 14px;margin:8px 0}
.arb .ayet{margin:2px 0}
.arb .meal{display:block;font-size:.88rem;color:var(--muted);margin-top:2px;line-height:1.5}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px 0 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.tbl{border-collapse:collapse;width:100%;font-size:.9rem;line-height:1.5}
.tbl th,.tbl td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.tbl thead th{background:var(--green);color:#fff;font-weight:600;font-size:.82rem;letter-spacing:.02em;white-space:nowrap}
.tbl thead th b{color:#fff}
.tbl td.arc .ar{display:block;text-align:right;font-size:1.2em;line-height:1.9}
.tbl tbody th{font-weight:600;color:var(--green);background:#fbf8f1;min-width:110px}
.tbl tbody tr:last-child th,.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:nth-child(even) td{background:#fcfaf5}
.tbl .ar{font-size:1.05em;line-height:1.8}
.tbl.cmp thead th:first-child{background:var(--green-2)}
.stp{list-style:none;counter-reset:st;margin:10px 0;padding:0 0 0 4px}
.stp li{counter-increment:st;position:relative;padding:0 0 12px 36px;font-size:.95rem;line-height:1.6}
.stp li:before{content:counter(st);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#fff;font-size:.78rem;font-weight:700;display:grid;place-items:center}
.stp li:after{content:"";position:absolute;left:11px;top:26px;bottom:2px;border-left:2px solid var(--gold-soft)}
.stp li:last-child{padding-bottom:2px}.stp li:last-child:after{display:none}
details.ht{background:var(--green-soft);border:1px solid #cfe0d6;border-radius:var(--radius);margin:16px 0 10px;padding:0}

<script>
/* Kullanım: düğme → <button class="rep" data-k="benzersiz-anahtar" data-yer="Ünite 3 · Bölüm" data-bas="Kayıt başlığı">⚑ Bildir</button>
   Programda önceden tanımlanır: window.BLD_APP = 'Program adı'; window.BLD_PREFIX = 'kayıt ön eki';
   İsteğe bağlı: "Bildirimlerim" düğmesinin konacağı yer → window.BLD_SLOT = 'css seçici' */
(function () {
  const APP = window.BLD_APP || 'Program', MAIL = 'alpkiraymehmet@gmail.com';
  const KEY = (window.BLD_PREFIX || 'bld_') + 'reports';
  const TYPES = ['Bilgi yanlış', 'Eksik ya da karışık anlatım', 'Soru, şık veya cevap hatalı', 'Arapça metin bozuk', 'Yazım hatası', 'Diğer'];
  const E = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const getL = () => { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } };
  const setL = l => { try { localStorage.setItem(KEY, JSON.stringify(l)); } catch (e) {} sync(); };
  const modal = document.getElementById('bldModal'), box = document.getElementById('bldBox');
  let lbtn = null;
  function slot() {
    if (lbtn || !window.BLD_SLOT) return;
    const s = document.querySelector(window.BLD_SLOT); if (!s) return;
    lbtn = document.createElement('button'); lbtn.type = 'button'; lbtn.className = 'bld-lbtn'; lbtn.title = 'Listeye eklediğin hata bildirimleri';
    lbtn.onclick = openList; s.appendChild(lbtn);
  }
  function sync() { slot(); if (lbtn) { const n = getL().length; lbtn.classList.toggle('has', n > 0); lbtn.innerHTML = `⚑<span class="bld-lg"> Bildirimlerim</span> (${n})`; } mark(); }
  function mark() { const l = getL(); document.querySelectorAll('.rep[data-k]').forEach(b => b.classList.toggle('on', l.some(x => x.k === b.dataset.k))); }
  const TR = {'ç': 'c', 'ğ': 'g', 'ı': 'i', 'ö': 'o', 'ş': 's', 'ü': 'u', 'â': 'a', 'î': 'i', 'û': 'u', 'Ç': 'C', 'Ğ': 'G', 'İ': 'I', 'Ö': 'O', 'Ş': 'S', 'Ü': 'U', 'Â': 'A', 'Î': 'I', 'Û': 'U'};
  const ascii = t => String(t).normalize('NFC').replace(/[çğıöşüâîûÇĞİÖŞÜÂÎÛ]/g, c => TR[c]).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\x20-\x7E\n]/g, '');
  const plain = t => String(t).replace(/[“”«»]/g, '"').replace(/[‘’ʿʾ]/g, "'").replace(/[·—–…]/g, '-').replace(/\s{2,}/g, ' ').trim();
  const body1 = r => `Program: ${APP}\nYer: ${r.yer}\nKayit: ${r.bas}\nKayit no: ${r.k}\nHata turu: ${r.type}\nNot: ${r.note || '-'}\nSayfa: ${r.url}`;
  const subj = r => `[${APP} Hata] ${r.k}`;
  const mailto = (su, bo) => `mailto:${MAIL}?subject=${encodeURIComponent(ascii(plain(su)))}&body=${encodeURIComponent(ascii(bo.split('\n').map(plain).join('\n'))).replace(/%0A/g, '%0D%0A')}`;
  const gmail = (su, bo) => `https://mail.google.com/mail/?view=cm&fs=1&to=${MAIL}&su=${encodeURIComponent(su)}&body=${encodeURIComponent(bo)}`;
  function copy(t, msg) {
    const done = () => { msg.textContent = `Kopyalandı. Yeni bir e-posta aç, alıcıya ${MAIL} yaz ve metni mesajın içine yapıştır.`; };
    const fb = () => { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { msg.textContent = 'Kopyalanamadı; metni elle seçip kopyalayabilirsin.'; } ta.remove(); };
    try { if (navigator.clipboard && window.isSecureContext !== false) navigator.clipboard.writeText(t).then(done, fb); else fb(); } catch (e) { fb(); }
  }
  let pushed = false;
  function open(html) {
    box.innerHTML = html;
    if (!modal.classList.contains('open')) { try { history.pushState(Object.assign({}, history.state, {bld: 1}), ''); pushed = true; } catch (e) { pushed = false; } }
    modal.classList.add('open'); const f = box.querySelector('textarea,input,button'); f && f.focus();
  }
  let closing = false;
  function close() { if (!modal.classList.contains('open')) return; modal.classList.remove('open'); if (pushed) { pushed = false; closing = true; try { history.back(); } catch (e) { closing = false; } } }
  // Telefonda geri hareketi önce pencereyi kapatsın, programın kendi gezinmesine geçmesin
  window.addEventListener('popstate', e => {
    if (closing) { closing = false; e.stopImmediatePropagation(); return; }
    if (modal.classList.contains('open') || pushed || (history.state && history.state.bld)) {
      const wasOpen = modal.classList.contains('open');
      modal.classList.remove('open'); pushed = false; e.stopImmediatePropagation();
      if (!wasOpen && history.state && history.state.bld) { try { history.back(); } catch (er) {} }
    }
  }, true);
  modal.addEventListener('click', e => { if (e.target === modal || e.target.closest('[data-x=close]')) close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('open')) close(); });
  function report(b) {
    const r = {k: b.dataset.k, yer: b.dataset.yer || '', bas: b.dataset.bas || '', url: location.href};
    open(`<h3 id="bldTitle">Hata bildir</h3><div class="bld-loc">${E(r.yer)}</div><div class="bld-q">${E(r.bas)}</div>
      ${TYPES.map((t, i) => `<label><input type="radio" name="bldt" value="${i}" ${i === 0 ? 'checked' : ''}> ${E(t)}</label>`).join('')}
      <textarea id="bldNote" placeholder="Not (isteğe bağlı): doğrusu ne olmalı, kaynağı nedir…"></textarea>
      <div class="bld-btns"><button class="pri" data-a="mail">E-posta ile gönder</button><a data-a="gmail" href="#" target="_blank" rel="noopener">Gmail'de aç</a><button data-a="copy">Metni kopyala</button><button data-a="add">Listeye ekle</button><button data-x="close">Kapat</button></div>
      <div class="bld-msg" id="bldMsg" aria-live="polite"></div>
      <div class="bld-hint">“E-posta ile gönder” bilgisayarındaki/telefonundaki e-posta uygulamasını açar. Açılmazsa “Gmail'de aç”ı ya da “Metni kopyala”yı kullan. Adres: ${MAIL}. Birden çok hata bulacaksan “Listeye ekle” deyip sonra üstteki “Bildirimlerim” ile hepsini tek e-postada gönderebilirsin.</div>`);
    const get = () => Object.assign({}, r, {type: TYPES[+box.querySelector('input[name=bldt]:checked').value], note: box.querySelector('#bldNote').value.trim()});
    const msg = box.querySelector('#bldMsg'), q = a => box.querySelector(`[data-a=${a}]`);
    q('mail').onclick = () => { const x = get(); try { navigator.clipboard && navigator.clipboard.writeText(body1(x)).catch(() => {}); } catch (e) {} location.href = mailto(subj(x), body1(x)); msg.textContent = 'E-posta uygulaman açılıyor… Metin ayrıca panoya kopyalandı: mesaj boş ya da bozuk görünürse içini silip yapıştırabilirsin.'; };
    q('gmail').onclick = function () { const x = get(); this.href = gmail(subj(x), body1(x)); };
    q('copy').onclick = () => copy(body1(get()), msg);

    drag={y:kY, t:Date.now(), tut:!!(e.target.closest('.gab-grab,.gab-hd') && !e.target.closest('.gab-x')), on:false, dy:0};
  }, {passive:true});
  document.addEventListener('touchmove', function(e){
    if(!sh.classList.contains('open')) return;
    if(!sh.contains(e.target)){ e.preventDefault(); return; }
    var dy=e.touches[0].clientY-kY;
    if(drag && (drag.on || drag.tut || (sh.scrollTop<=0 && dy>0))){
      e.preventDefault(); drag.on=true; drag.dy=dy;
      sh.classList.remove('gab-anim');
      sh.style.transform='translateY('+(dy>0 ? dy : dy/4)+'px)';
      return;
    }
    var ust=sh.scrollTop<=0, alt_=sh.scrollTop+sh.clientHeight>=sh.scrollHeight-1;
    if(sh.scrollHeight<=sh.clientHeight || (ust&&dy>0) || (alt_&&dy<0)) e.preventDefault();
  }, {passive:false});
  function birak(){
    if(!drag||!drag.on){ drag=null; return; }
    var d=drag.dy, hiz=d/Math.max(1,Date.now()-drag.t); drag=null;
    sh.classList.add('gab-anim');
    if(d>120 || (d>40 && hiz>0.6)){ sh.style.transform='translateY(100%)'; setTimeout(close,180); return; }
    if(d<-40) sh.classList.add('full');
    else if(d>40) sh.classList.remove('full');
    sh.style.transform='';
  }
  sh.addEventListener('touchend', birak); sh.addEventListener('touchcancel', birak);
  dim.onclick=close; document.getElementById('gabX').onclick=close;
  addEventListener('keydown', function(e){ if(e.key==='Escape') close(); });
  function gitUrl(u){ close(); setTimeout(function(){ location.href=u; }, 30); }

  bar.addEventListener('click', function(e){
    var b=e.target.closest('.gab-b'); if(!b) return;
    var k=b.dataset.k;
    if(k==='ana'){ if(APP==='ana'){ e.preventDefault(); if(openK) close(); scrollTo({top:0,behavior:'smooth'}); } return; }
    e.preventDefault();
    if(k==='devam'){ devam(); return; }
    if(openK===k) close(); else open(k);
  });
  B.addEventListener('click', function(e){
    if(e.target.closest('[data-cur]')){ e.preventDefault(); close(); return; }
    var a=e.target.closest('[data-u]'); if(a){ e.preventDefault(); gitUrl(a.dataset.u); }
  });

  function sonYer(){ // en son çalışılan yer; bulunduğunuz programın dışındakiler önce
    var all=rd('ga_ozet',{}), L=[];
    GA_PROGS.forEach(function(p){ var o=all[p.k]; if(o&&o.yer&&o.t) L.push({p:p,o:o}); });
    L.sort(function(a,b){ return b.o.t-a.o.t; });
    return L.filter(function(x){ return x.p.k!==APP; })[0] || null;
  }
  function devam(){
    var s=sonYer();
    if(s){ gitUrl(s.o.yer.url); return; }
    toast(APP==='ana' ? 'Henüz bir programda çalışmadınız. Bir ders seçin.' : 'Başka bir programda kaldığınız yer yok.');
    open('dersler');
  }
  var tt;
  function toast(m){ var d=document.createElement('div'); d.className='gab-toast'; d.textContent=m; document.body.appendChild(d); clearTimeout(tt); tt=setTimeout(function(){ d.remove(); }, 2600); }

  function dersler(){
    var all=rd('ga_ozet',{});
    return GA_PROGS.map(function(p){
      var o=all[p.k], cur=p.k===APP, u=(o&&o.yer&&o.yer.url)||p.url;
      var alt = cur ? '' : (o&&o.yer ? 'Kaldığınız yer: '+esc(o.yer.ad) : '');
      return '<a class="gab-li'+(cur?' cur':'')+'" href="'+esc(p.url)+'" '+(cur?'data-cur="1"':'data-u="'+esc(u)+'"')+'><span class="gab-pm">'+svg(p.i)+'</span><span class="gab-tx"><b>'+esc(p.ad)+'</b>'+(alt?'<small>'+alt+'</small>':'')+'</span>'+(cur?'<span class="gab-tag">buradasınız</span>':'')+'</a>';
    }).join('') + '<p class="gab-note">Diğer dersler hazırlanıyor; hazır oldukça bu listeye eklenecek.</p>';
  }
  function seri(){
    var g=rd('ga_gunler',[]); if(!g.length) return 0;
    var set={}; g.forEach(function(x){ set[x]=1; });
    var d=new Date(), n=0; if(!set[gun(d)]) d.setDate(d.getDate()-1);
    while(set[gun(d)]){ n++; d.setDate(d.getDate()-1); }
    return n;
  }
  function karne(){
    var all=rd('ga_ozet',{}), D=0, Y=0, K=0, var_=false;
    var rows = GA_PROGS.map(function(p){
      var o=all[p.k];
      if(!o) return '<button class="gab-kr bos" type="button" data-u="'+esc(p.url)+'"><span class="nm"><b>'+esc(p.ad)+'</b><small>Henüz başlanmadı</small></span><span class="n gab-g e">—</span><span class="n gab-g e">—</span></button>';
      var_=true; var d=o.d||0, y=o.y||0; D+=d; Y+=y; K+=o.kart||0;
      var b=Math.round((o.bitti||0)*100), q=d+y?Math.round(d/(d+y)*100):null;
      var c=q===null?'e':(q>=75?'':(q>=50?'o':'z'));
      return '<button class="gab-kr" type="button" data-u="'+esc((o.yer&&o.yer.url)||p.url)+'"><span class="nm"><b>'+esc(p.ad)+'</b><small>'+esc(o.etiket||'')+'</small></span><span class="n">%'+b+'</span><span class="n gab-g '+c+'">'+(q===null?'—':'%'+q)+'</span><span class="gab-bar"><i style="width:'+b+'%"></i></span></button>';
    }).join('');
    var S=D+Y, P=S?Math.round(D/S*100):null, sr=seri();
    return '<div class="gab-st"><div><b>'+S+'</b><span>soru çözüldü</span></div><div><b>'+(P===null?'—':'%'+P)+'</b><span>doğru</span></div><div><b>'+K+'</b><span>kart biliniyor</span></div></div>'
      + (sr>1 ? '<div class="gab-streak">🔥 '+sr+' gündür aralıksız çalışıyorsunuz</div>' : (sr===1 ? '<div class="gab-streak">🔥 Bugün çalıştınız. Yarın da gelirseniz seri başlar.</div>' : ''))
      + '<div class="gab-k"><div class="gab-kr gab-kh"><span>Ders</span><span class="n">Bitti</span><span class="n">Doğru</span></div>'+rows+'</div>'
      + '<p class="gab-note">'+(var_?'Bir derse dokunursanız kaldığınız yere gidersiniz. ':'')+'İlerlemeniz yalnızca bu cihazda, bu tarayıcıda saklanır.</p>'
      + '<a class="gab-mail" href="mailto:'+MAIL+'?subject='+encodeURIComponent('[Giray Akademi] Öneri / soru')+'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>İletişim · öneri ve soru gönderin</a>';
  }
})();
</script>

<script>
const UNITELER = [{"t":"Giriş ve Hıtbe (Nişanlanma)","intro":"Evliliğin meşruiyetinin ve teşvik edilmesinin hikmeti, zevac ve nikâh kavramları, icab ve kabul, kadına talip olmanın caiz olduğu ve olmadığı durumlar, talip olunan kadına bakma ve nişan hediyeleri.","s":[{"h":"Evliliğin meşruiyetinin hikmeti","b":[{"k":"p","x":"İnsan fıtratının evliliğe ihtiyacı vardır. Neslin devamı ve yeryüzünü imar etmek için bu gereklidir. Eğer Allah Teala insanı diğer canlıları bıraktığı gibi tabiatı üzere bırakmış olsaydı, bu düzenin yerini zulüm, hased, kin ve nefret alırdı. Cehalet yaygınlaşır, ahlakın bozulması ile kötü ve iğrenç adetlerin önü açılırdı."},{"k":"p","x":"Yüce Allah Peygamberlerinin diliyle erkek ve kadın arasında bağın kurulması; birinin diğerinin hakkının garantörü olabilmesi ve aralarındaki sınırların belirlenmesi için evliliği meşru kılmıştır. Eğer evlilik olmasaydı kadın ve erkek arasındaki olmayan sınırların sonucu olarak hadde tecavüz meydana gelirken zulüm ve düşmanlık da yardımlaşma ve muhabbetin yerini alırdı. Nitekim bu konuda Yüce Allah şöyle buyurmaktadır:"},{"k":"ar","a":"وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُمْ مِنْ أَنْفُسِكُمْ أَزْوَاجًا لِتَسْكُنُوا إِلَيْهَا وَجَعَلَ بَيْنَكُمْ مَوَدَّةً وَرَحْمَةً إِنَّ فِي ذَلِكَ لَآيَاتٍ لِقَوْمٍ يَتَفَكَّرُونَ","x":""}]},{"h":"İslam şeriatinin evliliğe teşvik etmesinin hikmeti","b":[{"k":"p","x":"İslam şeriati \"Kimin evlenmeye gücü yetiyorsa evlensin. Çünkü evlilik, gözü haramdan alıkoyar ve iffeti en iyi şekilde korur, gücü yetmeyen kimse ise oruç tutsun. Çünkü oruç, şehveti kıran bir şeydir.\", \"Size dünyanın en kıymetli hazinesinin ne olduğunu haber vereyim mi? Saliha kadındır. Saliha kadın odur ki, kocası kendisine baktığı zaman onu hoşnut eder, emrettiği zaman itaat eder, evinden uzaklaştığı zaman malını ve namusunu korur!\" gibi hadislerle evliliği teşvik ederken ruhbanlık ve bekarlıktan da nehyetmiştir."},{"k":"p","x":"Evliliği teşvikle ilgili iki büyük sebep zikredilmiştir:"},{"k":"n","n":1,"x":"Evlilik, beşerî (insanî) tabiatı tahkim ve takviye ederek, helal ve mübah yollarla ihtiyacını gidermesi mümkün olan insanı haramları çiğnemekten uzak tutar."},{"k":"n","n":2,"x":"Neslin çoğalmasını temin eder. Sevgili Peygamberimiz (sav) şöyle buyurmaktadır: \"Evleniniz, çoğalınız, çünkü ben kıyamet gününde sizin çokluğunuzla iftihar edeceğim.\""}]},{"h":"Bazı anahtar kavramlar","b":[{"k":"d","t":"Zevac","x":"İki şeyden birini diğerine bağlamak demektir. İki şeyden her birinin tek iken çifte intikal etmesidir."},{"k":"p","x":"Zevc kelimesinin Kur'an'da kullanımı şöyledir: «احْشُرُوا الَّذِينَ ظَلَمُوا وَأَزْوَاجَهُمْ وَمَا كَانُوا يَعْبُدُونَ»"},{"k":"d","t":"Nikah","x":"Lügatte, katmak, birleştirmek, eklemek (Dammu) anlamındadır."},{"k":"d","t":"Zevac ve nikahın şer'i manası","x":"Meşru (yasal) bir şekilde eşlerden her birine diğerinden faydalanma (istimta') hakkı veren akittir."}]},{"h":"Evlilik akdi ve bölümleri","b":[{"k":"p","x":"Akdin bütünlüğü ile kastedilen şey icab ve kabuldür."},{"k":"d","t":"Îcâb","x":"Taraflardan birisinden ilk olarak çıkan sözdür (tekliftir). Bu sözün zevcten, zevceden veya bu ikisini vekalet, velayet gibi yollarla temsil edecek kişilerden çıkması arasında da fark yoktur."},{"k":"d","t":"Kabûl","x":"Kendisine teklif yapılan ikinci taraftan çıkan sözdür."},{"k":"p","x":"**İcab ve kabulü iki kişi üstlenmelidir:** Hanefilere göre evlilik akdinde bir kişi bir tarafın velisi diğer tarafın da vekili olmakla veya sadece kendisinin veli olduğu amcasının küçük kızını kendisine nikahlamakla her iki tarafı da (icab ve kabul ile) temsil edebilir. Şafiilerin cumhuru ise buna katılmaz."},{"k":"sc","q":"Şer'an muteber (geçerli) akid nedir?","x":"Eşlerden birinin diğerinden faydalanmasını helal kılan akittir. Buna göre kız kardeş, kardeşlerin kızları gibi haram kılınmış kadınlarla, iddeti dolmamış kadınlarla, evli kadınlarla yapılan akitler muteber değildir."}]},{"h":"Îcâb ve kabulün gerçekleşmesi","b":[{"k":"li","x":"Akitlerde asıl olan şey tarafların iradesini yansıtmasıdır. Bu iradenin sözlü veya sözsüz (fiili) olmasında, tarafların muhatap oldukları (konuştukları) dilde sahih bir söz olup olmaması arasında da fark yoktur. Çünkü İslam şeriatinde muteberlik lafızlar ve formlar (biçem, üslup) değil mana ve maksatlardır. Bununla beraber mazi ve sahih lafızlarla icab ve kabulün yerine getirilmesi efdaldir. \"Senin zevcen şudur\", \"kabul ettim\" gibi."},{"k":"li","x":"Akdin Arapça ibarelerle yapılması şart olmayıp şahitlerin huzurunda, akdin anlaşılabileceği herhangi bir dil ile akdin kurulması kafidir."},{"k":"li","x":"Akdi yerine getirecek kişinin din görevlisi olması da şart değildir."},{"k":"li","x":"Dilsiz yazı yazmayı bilmiyorsa işareti caizdir. Yazı yazmayı bilen dilsiz hakkında Hanefi mezhebinde ihtilaf edilmiştir. Çoğunluğa ve tercih edilen görüşe göre (müftabih) bu durumda olan kişinin işaretine itibar edilmez, yazı ile iradesini bildirmesi gerekmektedir."},{"k":"li","x":"Taraflar aynı mecliste hazır değillerse kitabet, konuşma yerine geçer. O halde eşler aynı mecliste hazır bulunmuşlarsa mükâleme gerekir."},{"k":"li","x":"Mukatebenin biçimine gelince erkek kadına \"Benimle evlen\" veya buna benzer ifadeler ile yazar. Bu hitap (mektup) kadına ulaştığında bunu iki şahit huzurunda okur veya başkasına okutur. Sonra da erkeğin teklifini kabul ettiğini ifade eder. Bunları yapmaksızın falanca ile evlendiğini söylerse akit sahih olmaz. Çünkü şahitlerin, tarafların sözlerini işitmeleri gerekmektedir."},{"k":"not","x":"Yazı iki şahit huzurunda yazılacak, iki şahit huzurunda okunacak; sadece şahitlerin huzurunda onların işitebileceği şekilde okumak da yeterlidir."},{"k":"li","x":"Elçi göndermek de kitabet gibidir. Elçi erkeğin teklifini iki şahit huzurunda kadına bildirse kadın da aynı şekilde cevabını o mecliste bildirse akit geçerli olur."}]},{"h":"Kadına talip olmanın caiz olduğu ve olmadığı yerler","b":[{"k":"d","t":"Hıtbe","x":"Erkeğin kadını evlenmek için istemesidir."},{"k":"p","x":"Bu talep, ya sarih lafızlarla (ör. \"Seninle evlenmek istiyorum.\") ya da sarih olmayan (ta'riz / çıtlatma / üstü kapalı söz) lafızlarla (ör. \"Ben güzel bir kadınla evlenmek istiyorum.\") meydana gelebilir. Ancak bu kadın, iddet bekliyor olabileceği gibi iddet beklemiyor da olabilir. Durum buna göre değişecektir. Aşağıdaki tabloda bunu ayrıntılı bir şekilde görebiliriz:"},{"k":"tbl","r":[["Kadının durumu","Hıtbenin hükmü"],["**Evli olmayan**","Belirli şartlarla caizdir."],["**Evli olan · boşanmayan**","Başka bir adamla evli olan kadını ne tasrih ne de ta'riz yoluyla talep caiz değildir."],["**Boşanan · iddet beklemeyen · mahrem olmayan**","Caizdir. Eğer kadına başkası tarafından evlilik teklifi yapılmış kendisi de bu teklife razı olmuşsa bu kadına hiç bir yolla evlilik teklif edilemeyeceği hadis ile sabittir."],["**Boşanan · iddet beklemeyen · mahrem**","Caiz değildir. Evlenilmesi haram olan kadınlara hiç bir surette evlilik teklif edilemez."],["**İddet bekleyen · vefat sebebiyle**","Ta'riz yoluyla caizdir. «لَا جُنَاحَ عَلَيْكُمْ فِيمَا عَرَّضْتُمْ بِهِ مِنْ خِطْبَةِ النِّسَاءِ أَوْ أَكْنَنْتُمْ فِي أَنْفُسِكُمْ»"],["**İddet bekleyen · ric'i talak**","Caiz değildir. Çünkü ne istimta' ne de kocanın yeni bir nikah veya mehir olmaksızın karısına dönmesi haram değildir. Burada kadının rızası aranmaz. İddet bekleyen kadın evli kadın gibi olduğu için evlilik teklif edilemez."],["**İddet bekleyen · bain talak · beynûnet-i suğrâ**","İstimta' haram ama yeni bir nikah caizdir. Kadın iddetini beklemesi gerekir. Tasrih veya ta'riz yoluyla evlilik teklifi yapılamaz."],["**İddet bekleyen · bain talak · beynûnet-i kübrâ**","İstimta' ve nikah haramdır. Kadının iddetini beklemesi gerekir. Tasrih veya ta'riz yoluyla evlilik teklifi yapılamaz. Şafiilerde ta'riz yoluyla caizdir."]]},{"k":"agac","t":"Hıtbe","a":"الخطبة","r":{"q":"Kadın evli mi?","a":"إن كانت متزوجة؟","o":[{"x":"Evli değil","n":{"s":"caiz","x":"Açıkça da üstü kapalı da talip olunabilir.","a":"تجوز الخطبة تصريحا وتعريضا","not":""}},{"x":"Evli","n":{"q":"Boşanmış mı?","a":"إما مطلقة / إما غير مطلقة","o":[{"x":"Boşanmamış","n":{"s":"degil","x":"Ne üstü kapalı ne açıkça talip olunabilir.","a":"لا تجوز تعريضا ولا تصريحا","not":"Açık ve gizli caiz değil."}},{"x":"Boşanmış","n":{"q":"İddet bekliyor mu?","a":"إما معتدة / أو غير معتدة","o":[{"x":"İddeti yok","n":{"s":"caiz","x":"Mahrem değilse ittifakla her iki yolla da talip olunabilir.","a":"وهذه تجوز خطبته مطلقا بالاتفاق إن لم تكن محرما","not":"Tasrih de ta'riz de caiz."}},{"x":"İddetli","n":{"q":"İddetin sebebi nedir?","a":"إما بالوفاة / إما بالطلاق","o":[{"x":"Vefat","n":{"s":"caiz","x":"İttifakla üstü kapalı (ta'riz) talip olunabilir.","a":"تجوز الخطبة تعريضا بالاتفاق","not":"Vefat: kapalı (ta'riz) caiz; açık (tasrih) yok. Delil: «وَلَا جُنَاحَ عَلَيْكُمْ فِيمَا عَرَّضْتُمْ بِهِ…» (البقرة، ٢/٢٣٥)"}},{"x":"Talak","n":{"q":"Talak türü nedir?","a":"إما رجعي / إما بائن","o":[{"x":"Ric'i","n":{"s":"degil","x":"İttifakla caiz değildir.","a":"غير جائز اتفاقا","not":"Açık yok, kapalı yok; koca mehir ve nikah olmadan dönebilir."}},{"x":"Bain","n":{"q":"Beynûnet hangisi?","a":"بائن بينونة صغرى / بائن بينونة كبرى","o":[{"x":"Beynûnet-i suğrâ (1–2 talak)","n":{"s":"degil","x":"Caiz değildir.","a":"غير جائز","not":"Yeni bir mehir, yeni bir nikah gerekir; tasrihle de ta'rizle de caiz değil."}},{"x":"Beynûnet-i kübrâ (3 talak)","n":{"s":"ihtilaf","x":"Cumhura göre üstü kapalı talip olunabilir; Hanefiler buna muhaliftir.","a":"تجوز خطبتها تعريضا عند الجمهور خلافا للأحناف","not":"3 talak, dönüş yok. Hanefilerde tasrih de ta'riz de caiz değil; cumhura göre ta'riz caiz."}}]}}]}}]}}]}}]}}]}},{"k":"d","t":"الخطبة تصريحا","x":"«الكلام الذي لا يحتمل غير الزواج» Evlilikten başka bir anlama gelmeyen sözdür."},{"k":"d","t":"الخطبة تعريضا","x":"«الكلام الذي يحتمل الرغبة في الزواج وعدم الرغبة فيه» Evlilik isteğine de evlilik isteğinin olmamasına da ihtimali olan sözdür."}]},{"h":"Evlilik teklifi yapılacak kadına bakma meselesi","b":[{"k":"n","n":1,"x":"**Cumhur ulema:** Yüzü ve ellerine bakılabilir."},{"k":"n","n":2,"x":"**Hanefilerin bir kısmı:** Yüzü, elleri ve ayaklarına bakılabilir."},{"k":"n","n":3,"x":"**Davud ez-Zahiri:** Edeb yerleri hariç bedeninin tamamına bakılabilir."},{"k":"n","n":4,"x":"**İmam Malik:** Kadının izni ile caiz olur. Aksi mekruhtur."}]},{"h":"Nişanlılıkta verilen hediyelerin hükmü ve nişanlılıktan dönme durumu","b":[{"k":"tbl","r":[["Verilen","Hükmü"],["**Mehir olarak verilenler**","Sebebi ne olursa olsun verilen mehrin iade edilmesi hususunda alimler ittifak halindedirler."],["**Hibe olarak verilenler · Şafiiler**","Nişanı hangi taraf bozarsa bozsun erkeğin verdiği şeylerin hepsini almaya hakkı vardır, verdiği şeyler mevcutsa aynen alır, değilse kıymetini alır."],["**Hibe olarak verilenler · Malikiler**","Erkek tarafından bozulmuşsa geri alamaz. Kadın tarafından bozulmuşsa geri alır."],["**Hibe olarak verilenler · Hanefiler**","Hediye olarak verilen giyecek, yiyecek vb. şeylerin hükmü hibe'nin hükmü gibidir. Bunları veren kişinin, hibeden rücû hakkı olduğu gibi, hediyeleri vermekten de rücû etmesi câizdir. Ancak hediyeler tüketilmişse bu hibeden rücûun mânilerinden sayıldığı için hediyenin geri alınmasında da mani sayılmıştır."],["**Hibe olarak verilenler · Hanbeliler**","Erkek verdiği hediyelerin hiç birisini geri alamaz. İster bu hediyeler mevcut olsun, isterse olmasın durum böyledir, çünkü bunlar hibe hükmündedir."]]}]}],"ht":[{"s":0,"x":"Evliliğin meşruiyetinin hikmeti: neslin devamı ve yeryüzünün imarı; evlilik olmasaydı zulüm, hased, kin ve nefret, yardımlaşma ve muhabbetin yerini alırdı."},{"s":1,"x":"Evliliği teşvikin iki büyük sebebi: insanı haramlardan uzak tutması ve neslin çoğalmasını temin etmesi. İslam ruhbanlık ve bekârlıktan nehyetmiştir."},{"s":2,"x":"Zevac: iki şeyden birini diğerine bağlamak; nikah: lügatte katmak, birleştirmek (damm). Şer'i manası: eşlerden her birine diğerinden meşru şekilde faydalanma (istimta') hakkı veren akit."},{"s":3,"x":"İcab: ilk çıkan söz (teklif), kimden çıktığına bakılmaz; kabul: teklif yapılan ikinci taraftan çıkan söz."},{"s":3,"x":"Hanefilere göre bir kişi hem icabı hem kabulü üstlenebilir (bir tarafın velisi, diğerinin vekili olarak); Şafiilerin cumhuru katılmaz."},{"s":4,"x":"Muteber olan lafız ve form değil mana ve maksattır; yine de mazi ve sarih lafızla icab-kabul efdaldir. Arapça şart değildir, akdi yapanın din görevlisi olması şart değildir."},{"s":4,"x":"Yazı bilmeyen dilsizin işareti caizdir; yazı bilen dilsizin işaretine (müftâbih görüşe göre) itibar edilmez, yazmalıdır."},{"s":4,"x":"Taraflar aynı mecliste değilse kitabet (mektup) ve elçi konuşma yerine geçer; mektup iki şahit huzurunda okunur, kabul o mecliste bildirilir."},{"s":5,"x":"Hıtbe: erkeğin kadını evlenmek için istemesi; sarih (tasrih) ya da üstü kapalı (ta'riz) olur."},{"s":5,"x":"Evli kadına hiçbir yolla talip olunmaz; boşanmış ve iddeti bitmiş, mahrem olmayan kadına talip olunur; başkasının teklifine razı olmuş kadına talip olunmaz."},{"s":5,"x":"Vefat iddeti: ta'riz caiz (Bakara 2/235). Ric'i talak iddeti ve beynûnet-i suğrâ: hiçbir yolla caiz değil. Beynûnet-i kübrâ: Hanefilere göre caiz değil, cumhur ve Şafiilere göre ta'riz caiz."},{"s":6,"x":"Talip olunan kadına bakma: cumhur yüz ve eller; Hanefilerin bir kısmı yüz, eller ve ayaklar; Dâvûd ez-Zâhirî edep yerleri hariç bütün beden; İmam Mâlik kadının izniyle (izinsiz mekruh)."},{"s":7,"x":"Nişan bozulunca mehir olarak verilen ittifakla iade edilir."},{"s":7,"x":"Hediyeler: Şafiî — kim bozarsa bozsun erkek hepsini (yoksa kıymetini) alır; Mâlikî — erkek bozduysa alamaz, kadın bozduysa alır; Hanefî — hibe gibidir, rücû caiz ama tüketilmişse geri alınamaz; Hanbelî — hiçbirini geri alamaz."}]},{"t":"Nikâhın Şartları ve Şahitlik","intro":"Evlilik akdinin dört grup şartı: in'ikad (kuruluş), sıhhat, nefaz ve lüzum şartları; şahitliğin şartları ve evlilik akdinde ayıp sebebiyle fesih muhayyerliği.","s":[{"h":"Evliliğin in'ikad (yürürlük) şartları","b":[{"k":"p","x":"Akdi gerçekleştireni ve akit meclisini ilgilendiren olmak üzere iki nev'i vardır:"},{"k":"h","x":"1. Akdi yapanı ilgilendiren şartlar"},{"k":"p","x":"Bunun tek şartı vardır o da âkidin akıllı olmasıdır. Eğer âkid mecnun veya aklını kullanamaz bir çocuk ise tasarruf ehliyetine sahip olmadığı için taraflar bağ kuramayacaktır. Büluğ şartı \"nefâz\" şartıdır."},{"k":"h","x":"2. Akit meclisini ilgilendiren şartlar"},{"k":"p","x":"Üç tanedir:"},{"k":"h5","x":"a. Meclis birliği"},{"k":"p","x":"İcab ve kabul aynı mecliste gerçekleşmelidir. Taraflar mecliste hazır bulunduğunda meclis birliğine halel getirecek herhangi bir söz ve davranış bu birliği ortadan kaldırır."},{"k":"li","x":"Taraflardan biri mecliste yoksa, örneğin adamın yaptığı teklifi aynı mecliste bulunmayan kadın kendisine teklifin ulaştığı başka bir mecliste kabul ederse akdin diğer şartları yerine getirildiği takdirde akid yürürlüğe girmiş olur."},{"k":"li","x":"Ebu Hanife'ye göre kabulün icabtan, örfen, nikah akdi ile ilgili bir şey ile ayrılması caizdir. Şafiiler ise fevri şart koşmuşlardır."},{"k":"h5","x":"b. Tarafların birbirinin sözünü işitip anlaması gerekir"},{"k":"p","x":"Taraflardan biri sağır ise veya ifadelerden kastedilenin neyle ilgili olduğunu bilmiyorsa akit yürürlüğe girmez. Eğer ifadelerin evlilikle ilgili olduğunu biliyorsa kelimelerin ve cümlelerin manasını anlamasa da akid sahihtir."},{"k":"h5","x":"c. Kabul icaba uygun olmalıdır"},{"k":"p","x":"Örnekler aşağıdaki gibidir."},{"k":"ornek","x":"**Tüm cüzlerde muvafakat olursa sahihtir:** Örneğin Ahmet, Esma'yı velisinden 100 TL mehir ile talep etse, veli de Esma'yı 100 TL mehir ile Ahmet'e verse bu sahihtir."},{"k":"ornek","x":"**Tüm cüzlerde muhalefet olursa sahih değildir:** Örneğin Ahmet'in babası, Esma'yı babasından 50 TL mehir ile istese, Esma'nın babası da \"80 TL mehir ile Ayşe'yi oğlun Mehmet'e verdim\" derse bu sahih değildir."},{"k":"ornek","x":"**Cüzlerden bazısında muhalefet olursa sahih değildir:** Örneğin Ahmet'in babası Esma'yı babasından 50 TL mehir ile istese de, Esma'nın babası sadece mehri artırarak söylese veya Esma değil de Ayşe dese veya kızını değil de kardeşinin kızını kastetse veya damat adayı Ahmet'i değil de onun kardeşi Mehmet'i kastetse bu tek cüzün değişmesi ile de akid sahih olmaz."},{"k":"ornek","x":"**Hayır olan muhalefet caizdir:** Ahmet, Esma'ya 50 TL mehir teklifi ile gitse de Esma 10 TL yeterli derse; Esma Ahmet'e 100 TL mehir ile varacağını iletse ama Ahmet Esma'ya \"olmaz 200 TL mehir veriyorum\" dese bu muhalefet sahihtir. Esma aksini istemediği müddetçe Ahmet bu iki mehirden az olanı verir."},{"k":"tbl","r":[["Kabulün icaba uygunluğu","Hükmü"],["**Tüm cüzlerde muvafakat**","Sahih"],["**Tüm cüzlerde muhalefet**","Sahih değil"],["**Bazı cüzlerde muhalefet**","Sahih değil"],["**Hayır olan muhalefet**","Caiz (sahih)"]]}]},{"h":"Evliliğin sıhhat şartları","b":[{"k":"p","x":"Evliliğin sıhhati için genel şartlara gelince -Hanefiler nezdinde- iki şartı vardır:"},{"k":"n","n":1,"x":"**Kadının akid vaktinde evlenmeye engelinin bulunmaması:** Örneğin kadının kız kardeşi gibi müebbed haram veya karısının kız kardeşi gibi muvakkat haram olması; başkasıyla nikahlı olması ya da başkasından boşandığı için iddet beklemesi bu engellerdendir. Ulema bu konuda ittifak halindedir."},{"k":"n","n":2,"x":"**Akdin şahitlik şartlarını taşıyan iki şahit huzurunda gerçekleşmesi:** Evlilik akdi asırların geçmesiyle değişmeyecek olan nesebin sübutu, hürmet-i musahara, miras gibi hükümlerin çoğu ile ilintilidir. Bundan dolayı bu akdin insanlar arasında ilan edilmesi gereklidir. Bu da şahitler yolu ile olur. Sevgili Peygamberimiz (sav) şöyle buyurmuşlardır: «لَا نِكَاحَ إِلَّا بِشُهُودٍ»"}]},{"h":"Şahitliğin şartları","b":[{"k":"p","x":"Dört şart vardır: Hürriyet, Büluğ, Akıl, Akdin taraflarının icab ve kabulü işitmesi."},{"k":"li","x":"Hanefilere göre şahitlerin ikisi erkek olabileceği gibi biri erkek iki kadın da olabilir. Şahitlerin görüyor olmaları, adil olmaları şart olmadığı gibi dünürlerin tanımadığı kişiler olmaları da şart değildir. Bilakis âmâ, fasık, gelin ile damatın anne veya babası şahit olabilir."},{"k":"li","x":"Şahitlerden biri veya ikisi akid anında köle, çocuk, mecnun, sağır, sarhoş, uyuyan vb. olursa akit geçersiz olur."},{"k":"li","x":"Eşler müslüman olduğunda şahitlerin de müslüman olması gerekir. İkisi de zımmi ise şahitlerin zımmi olması caizdir. Damat Müslüman olup gelin zımmi ise Ebu Hanife ve Ebu Yusuf'a göre şahitlerin ikisi de zımmi olabilir. Gelin için şahitlerin aynı dinden olmaları ya da olmamaları arasında bir fark yoktur. İmam Şafii, Muhammed ve Züfer'e göre damat Müslüman ise şahitlerin zımmi olması caiz olmaz."},{"k":"kart","t":"Şahitliğin şartları","a":"شروط الشهادة","g":[{"h":"Üzerinde ittifak edilen şartlar","a":"شروط متفق عليه","m":["«الإسلام إن كان الزوجان مسلمين» Eşler Müslümansa İslam — Taraflar Müslümansa şahitlerin de Müslüman olması lazım.","«الحرية» Hürriyet","«البلوغ» Bulûğ","«السماع» İşitme","Kenar notu: beşinci şart akıl."]},{"h":"İhtilaflı şartlar","a":"شروط مختلف فيه","m":["«الذكورة في الجمع عند الشافعي وأحمد» Şâfiî ve Ahmed'e göre şahitlerin ikisinin de erkek olması","«الذكورة في واحد عند أبي حنيفة» Ebû Hanîfe'ye göre birinin erkek olması"]}]}]},{"h":"Veli şartı","b":[{"k":"p","x":"İmam Şafii, Ahmed b. Hanbel gibi bazı alimler üçüncü bir şart ilave etmişlerdir. Bu da gelinin asabeden en yakın erkek akrabasının nikahta hazır bulunmasıdır. Neseben asabe yoksa sebeben asabe hazır bulunmalıdır. Buna göre kadının tek başına evlenmesi de başka bir kadın tarafından evlendirilmesi de caiz değildir. Onlar bu görüşlerini «فَلَا تَعْضُلُوهُنَّ أَنْ يَنْكِحْنَ أَزْوَاجَهُنَّ» ayetine dayandırmaktadırlar. Bu konuyla ilgili hadisler de mevcuttur."},{"k":"p","x":"Ebu Hanife'ye göre velayet büyük kadın için evliliğin sıhhat şartlarından değildir. Akıl - baliğ olan kadın kendisi evlenebilir. O, bu görüşünü «وَامْرَأَةً مُؤْمِنَةً إِنْ وَهَبَتْ نَفْسَهَا لِلنَّبِيِّ إِنْ أَرَادَ النَّبِيُّ أَنْ يَسْتَنْكِحَهَا» ayetine dayandırmıştır. Yine \"Dul konusunda velinin bir yetkisi yoktur\"; \"Dul kendisini evlendirmeye velisinden daha layıktır\" gibi hadisleri delil getirmiştir. Aksi görüş sahipleri bu hadisleri hüccet olarak kabul etmemişlerdir."},{"k":"tbl","r":[["","Şâfiî, Ahmed b. Hanbel","Ebû Hanîfe"],["**Veli (asabeden en yakın erkek akraba) nikahta bulunmalı mı?**","Evet, sıhhat şartıdır; kadın kendini de başka kadını da evlendiremez.","Hayır, büyük kadın için sıhhat şartı değildir; akıl-baliğ kadın kendisi evlenebilir."],["**Delil**","«فَلَا تَعْضُلُوهُنَّ أَنْ يَنْكِحْنَ أَزْوَاجَهُنَّ» ayeti ve hadisler","«وَامْرَأَةً مُؤْمِنَةً إِنْ وَهَبَتْ نَفْسَهَا لِلنَّبِيِّ…» ayeti; \"Dul kendisini evlendirmeye velisinden daha layıktır\" hadisi"]]}]},{"h":"Evliliğin nefaz şartları","b":[{"k":"d","t":"Nefaz","x":"Akdin kurulmasıyla birlikte derhal işlerlik kazanması anlamına gelir. Zıttı \"mevkuf\"tur."},{"k":"d","t":"Mevkuf akid","x":"Yetki eksikliği veya üçüncü şahısların haklarının bulunması sebebiyle hükümlerini meydana getirmesi askıya alınmış akid."},{"k":"p","x":"Taraflar açısından akid dört türlü kurulabilir:"},{"k":"n","n":1,"x":"Kendileri akid yaparlar."},{"k":"n","n":2,"x":"Vekil tayin edebilirler."},{"k":"n","n":3,"x":"Birisi kendi diğeri vekil tayin ederek akdi kurabilir."},{"k":"not","x":"Bu üçünde tarafların akıl, bâliğ ve hür olmaları şarttır. Bu şartlar yoksa nikah velinin izni ile mevkuf olur."},{"k":"not","x":"Taraflar köle veya cariye ise vekil olmaları veya vekil tayin etmeleri hususunda efendisi, mümeyyiz çocuk ise velisi devreye girer. Taraflar şartları haiz olmalarına rağmen akdi Fuzuli yerine getirdiğinde bu, Şafiilere göre batıl, Hanefilere göre mün'akid olmakla beraber mevkuftur."},{"k":"n","n":4,"x":"Gelin ve damat nakıs ehliyetli iseler akdi velileri kurabilir. Bu velide bulunması gereken şartlar ise dört tane olup, akıl, bâliğ, hürriyet şartları ehliyeti nakıs olana velayet edecek olan kişinin tam ehliyetli olduğunu gösterir. Din birliği (muvafakatü fi'd-din) şartına gelince, örneğin gelinin iki kardeşi olup biri Müslüman diğeri Hıristiyan ise, gelin Müslüman ise Müslüman olan kardeşi, Hıristiyan ise Hıristiyan olan kardeşi gelinin velisi olur."}]},{"h":"Evliliğin lüzûm şartları","b":[{"k":"d","t":"Lüzûm","x":"Akdin bağlayıcılığı, taraflardan birinin tek taraflı iradesiyle feshedilemeyecek nitelikte olması anlamındadır."},{"k":"li","x":"Akdi taraflar kendileri yaparlarsa, lüzum şartları iki olup yalnızca kadın için aranır: 1. **Kefâet:** Koca denk olmalıdır. 2. **Mehr-i Misil:** Mehir bundan az olmamalıdır. Veliler bu iki şartın yerine getirildiğine kanî olmazlarsa akdi feshedebilirler."},{"k":"li","x":"Akdi tarafların velileri olan baba veya dede yaparsa, bu durumda veliler gelin ile damadın kötülüğünü istemeyecekleri için gerek büluğdan önce gerekse büluğdan sonra tarafların itiraz etmeye hakları yoktur. Bu durumda lüzum şartının gerçekleşmesi için başka şarta da gerek yoktur."},{"k":"li","x":"Akdi tarafların baba veya dedesinden başka veliler yaparsa, bu durumda çocukların velayet sebebi ortadan kalktığında (baliğ olduklarında) bu vekalete itiraz etme ve nikahın feshini isteme hakları vardır."},{"k":"d","t":"Bulûğ muhayyerliği","x":"Baba veya dedesi dışındaki bir veli tarafından evlendirilen küçüğün bulûğa erdiğinde evliliği feshetme hakkına sahip olması."}]},{"h":"Şema: nikâhın şartları","b":[{"k":"kart","t":"Nikâhın şartları","a":"شروط الزواج","g":[{"h":"İn'ikad şartları · eksikse batıl olur","a":"شروط الانعقاد","m":["«ما يرجع إلى العاقد: أن يكون عاقلا» Âkidle ilgili: akıllı olmak","«ما يرجع إلى مجلس العقد: اتحاد المجلس» Meclisle ilgili: meclis birliği","«أن يسمع كل من العاقدين كلام الآخر ويفهم ما يراد به» Âkidlerin birbirinin sözünü işitip kastedileni anlaması","«ألا يخالف القبول الإيجاب» Kabulün icaba aykırı olmaması","Kenar notu: 1- Akıllı 2- Meclis birliği 3- Tarafların birbirini anlaması 4- İcap ve kabule uygun olması."]},{"h":"Sıhhat şartları · eksikse fasit olur","a":"شروط الصحة","m":["«أن تكون الزوجة محلا قابلا للزواج» Kadının evlenmeye elverişli olması — Kenar notu: evliliğe uygun olması (mahrem olmayacak).","«أن يكون العقد بحضرة الشاهدين» Akdin iki şahit huzurunda olması","«أن يكون للزوجة ولي ذكر (ش-أ)» Kadının erkek velisinin bulunması (Şâfiî ve Ahmed) — Kenar notu: Hanefîde yok, Şâfiî ve Hanbelî'de var."]},{"h":"Nefaz şartları · eksikse mevkuf olur","a":"شروط النفاذ","m":["«الحرية» Hürriyet","«البلوغ» Bulûğ","«العقل» Akıl"]},{"h":"Lüzum şartları · eksikse feshe kabil olur","a":"شروط اللزوم","m":["«إن كان المباشر الزوجين: بالنسبة للزوج لم يشترط للزوم العقد شيء أصلا» Akdi eşler kendileri yaptıysa: koca için lüzumda hiçbir şart aranmaz.","«بالنسبة للزوجة يشترط للزومه شرطان: أن يكون الزوج كفئا لها، أن يكون المهر الذي عقدت عليه مهر مثلها» Kadın için iki şart: koca ona denk olmalı; mehir mehr-i misil olmalı. — Kenar notu: değilse feshe kabildir.","«إن كان المباشر ولي الزوجين (الأب-الجد) لم يشترط للزوم الزواج شيء» Akdi baba ya da dede yaptıysa hiçbir şart aranmaz. — Kenar notu: baba ve dede evlendirirse geçerlidir; baba ve dede dışındakiler evlendirirse hıyâr-ı bulûğ vardır; baba ve dede daha şefkatlidir."]}]}]},{"h":"Evlilik akdinde muhayyerlik var mıdır?","b":[{"k":"p","x":"Hanefilerin meşhur görüşüne göre üç sebeple ayıp muhayyerliği meydana gelir:"},{"k":"n","n":1,"x":"**Mecbub:** Erkeğin edeb mahallinin kesik olması."},{"k":"n","n":2,"x":"**Hasiyy:** Erkeğin hadım olması."},{"k":"n","n":3,"x":"**İnnîn:** Erkeğin iktidarsızlığı."},{"k":"d","t":"Fesih muhayyerliği","x":"Erkekte bu üç ayıptan (mecbub, hasiyy, innîn) biri bulunursa kadının evliliğin feshini isteyebilmesidir."}]}],"ht":[{"s":0,"x":"İn'ikad şartları: âkidle ilgili tek şart akıllı olmak (bulûğ nefaz şartıdır); meclisle ilgili üç şart: meclis birliği, tarafların birbirinin sözünü işitip anlaması, kabulün icaba uygunluğu."},{"s":0,"x":"Ebû Hanîfe'ye göre kabulün icaptan nikahla ilgili bir şeyle ayrılması caizdir; Şafiiler fevriyyet şart koşar."},{"s":0,"x":"Kabul icaba bütün cüzlerde ya da bir cüzde muhalifse akit sahih olmaz; hayır olan (lehte) muhalefet caizdir, az olan mehir verilir."},{"s":1,"x":"Hanefilere göre sıhhat şartları iki: kadında evlenme engeli bulunmaması ve şahitlik şartlarını taşıyan iki şahit («لا نكاح إلا بشهود»)."},{"s":2,"x":"Şahitliğin dört şartı: hürriyet, bulûğ, akıl, icab ve kabulü işitmek; eşler Müslümansa şahitlerin de Müslüman olması gerekir."},{"s":2,"x":"Hanefilere göre iki erkek ya da bir erkek iki kadın şahit olur; görme, adalet ve tanınmamış olmak şart değildir (âmâ, fâsık, gelin ve damadın anne-babası şahit olabilir)."},{"s":2,"x":"Damat Müslüman, gelin zimmî ise Ebû Hanîfe ve Ebû Yûsuf'a göre şahitler zimmî olabilir; Şâfiî, Muhammed ve Züfer'e göre olamaz."},{"s":3,"x":"Şâfiî ve Ahmed b. Hanbel'e göre veli (asabeden en yakın erkek) sıhhat şartıdır; Ebû Hanîfe'ye göre akıl-baliğ kadın kendisi evlenebilir."},{"s":4,"x":"Nefaz: akdin kurulur kurulmaz işlerlik kazanması; zıttı mevkuf (hükmü askıya alınmış) akittir."},{"s":4,"x":"Taraflar kendileri, vekilleri ya da biri kendi diğeri vekili eliyle akit yaparsa akıl, bulûğ ve hürriyet şarttır; yoksa nikah velinin iznine mevkuftur."},{"s":4,"x":"Fuzûlînin yaptığı nikah Şafiilere göre batıl, Hanefilere göre mün'akid ama mevkuftur."},{"s":5,"x":"Lüzum: akdin tek taraflı iradeyle feshedilememesi. Taraflar kendileri akdederse yalnız kadın için iki şart: kefâet ve mehr-i misil; yoksa veliler feshedebilir."},{"s":5,"x":"Baba veya dede evlendirirse itiraz hakkı yoktur; başka veli evlendirirse bulûğda fesih hakkı (bulûğ muhayyerliği) vardır."},{"s":6,"x":"Şartlar eksik olunca: in'ikad → batıl, sıhhat → fasit, nefaz → mevkuf, lüzum → feshe kabil."},{"s":7,"x":"Hanefilere göre ayıp muhayyerliğinin üç sebebi: mecbûb (edep mahalli kesik), hasiyy (hadım), innîn (iktidarsız); kadın feshi isteyebilir (fesih muhayyerliği)."}]},{"t":"Sîgalar; Müt'a, Muvakkat ve Şiğar Nikâhları","intro":"Nikah akdinde kullanılan sîgalar (müneccez, muallak ve şart izafe edilen akit) ve hükümleri; müt'a, muvakkat (geçici) ve şiğar nikâhları.","s":[{"h":"Nikah akdinde kullanılan sigalar ve hükümleri","b":[{"k":"h","x":"1. Akd-i müneccez"},{"k":"d","t":"Akd-i müneccez","x":"İcab ve kabulün meydana gelmesinde kullanılan ifadelere ilave yapılmadan mutlak siga ile gerçekleştirilen şartsız bir akid çeşididir."},{"k":"not","x":"Akit esnasında, taraflar akdi ilerideki bir olaya bağlamamışsa ya da belli bir vakte izafe etmemişse bu akide müneccez akit denir. Kesinlik içerir, muhayyerliğe yer yoktur."},{"k":"ornek","x":"Erkeğin, kıza \"Şu miktar mehre benimle evlen\" diye veya mehir zikretmeden yaptığı teklife kızın \"kabul ettim\" vb. lafızları kullanmasıdır."},{"k":"p","x":"Evliliğin şartlarını taşıyorsa bu akid sahih olup, mehir zikredilmişse, mehr-i müsemma, zikredilmemiş ise mehr-i misil geçerli olur."},{"k":"h","x":"2. Akd-i muallak"},{"k":"d","t":"Akd-i muallak","x":"İcab veya kabulün veya da ikisinin meydana gelmesi bir şarta ve o şartın gerçekleşmesine bağlı olan akid çeşididir."},{"k":"ornek","x":"Bir kişinin \"eğer bana filan yere yolculuğumda arkadaşlık yaparsan kızımı seninle evlendiririm\" şeklindeki şartlı teklifine muhatabın \"kabul ettim\" derse akid \"eğer\" şart edatı ile şarta bağlanmış olur."},{"k":"li","x":"**Şart akid esnasında var:** Örneğin erkeğin kıza, \"Eğer bakireysen seninle evlenirim\" demesine karşılık kız da \"kabul ettim\" dese ve o sırada da bakire olsa akit sahih ve tamdır. Çünkü burada ta'lik (şart) sûri olup biçimseldir. Ayrıca uygulamada akid müneccez gibidir."},{"k":"li","x":"**Şart akid esnasında yok:** Taraflar akid meclisinden ayrılmadan evvel şart gerçekleşirse örneğin, erkeğin kıza \"şu kadar mehre seninle evlenmek istiyorum\" demesi üzerine kızın \"eğer abim bu mehre razı olursa evlenirim\" demesi; bunun sonucunda da abinin aynı mecliste bu teklife \"bu mehri kabul ettim\" diyerek onay vermesi ile akid sahih ve tam olur. Bu durumda da akid müneccez akid gibidir."},{"k":"li","x":"**Şart akid esnasında da taraflar meclisten ayrılmadan önce de yok:** Eğer bu şart gelecekte vukuu mümkün olanlardan ise (esasen bu şartın gerçeklemesi kadar gerçekleşmemesi de ihtimal dahilindedir), örneğin, erkek kıza \"bahar gelip yağmur yağdığı zaman seninle şu kadar mehre evlenmek isterim\" deyip kız da \"kabul ettim\" derse bu akid sahih değildir."},{"k":"not","x":"Bu şart gerçekleşebilir olsa da diğer ihtimalin yani bahar gelse de yağmurun yağmama ihtimalinin de varlığı göz ardı edilmemelidir."},{"k":"li","x":"**Şart gelecek zamana bağlı:** Örneğin, erkek \"Falan ay geldiği zaman seninle evlenirim\" dese de kız \"kabul ettim\" derse bu akid de sahih değildir."},{"k":"dikkat","x":"Bu son ikisinin sahih olmamasının gerekçesi şu kuraldır: \"Temlik akidleri (evlilik akdi de bundandır) tehlikeli ta'liği kabul etmezler.\""},{"k":"h","x":"3. Akd-i muzâf / şartın izafe edildiği akid"},{"k":"d","t":"Akd-i muzâf","x":"Akid gerçekleştikten sonra kendisine şart ilave edilmiş akittir."},{"k":"ornek","x":"Erkeğin kadına \"seninle harcamaman şartıyla şu kadar mehre evlendim\" demesine kadının \"kabul ettim\" demesidir. Dikkat edilirse şart akdin sonuna eklenmiştir."},{"k":"p","x":"Bu durumda akd-i muzafın akd-i muallaktan farkı akid esnasında akdin var olmasıdır. Bu akdin sahih olması akde eklenen şartın durumuna göre değişir:"},{"k":"li","x":"Eğer izafi şart, akdin iktizası (gereği), mülaimi (uygunluğu), şer'i oluşu, örfe münasipliğinden ise sahihtir, şart yerine getirilmelidir. Örneğin, erkek \"Evinden izinsiz veya özürsüz çıkmaman şartı ile seninle evlendim\" diye akde şart izafe etse kadın bu şartı yerine getirmek zorundadır. Çünkü bu akdin gereklerindendir."},{"k":"li","x":"Eğer izafi şart yukarıdaki gibi değilse akid sahih şart batıldır yerine getirilemez. Örneğin erkek \"Senin nafakanı vermemem şartı ile seninle evlendim\" diye akde şart izafe etse bu şart yerine getirilmez."},{"k":"tbl","r":[["Sîga","Durum","Hükmü"],["**Müneccez**","Şartsız, mutlak sîga","Sahih (mehir zikredilmişse mehr-i müsemma, edilmemişse mehr-i misil)"],["**Muallak**","Şart akid esnasında var","Sahih; müneccez gibi"],["**Muallak**","Şart meclis dağılmadan gerçekleşti","Sahih; müneccez gibi"],["**Muallak**","Şart ne akid esnasında ne meclis dağılmadan var","Sahih değil"],["**Muallak**","Şart gelecek zamana bağlı","Sahih değil"],["**Muzâf**","Şart akdin gereği, uygun, şer'i ya da örfe münasip","Akit de şart da sahih"],["**Muzâf**","Şart böyle değil","Akit sahih, şart batıl"]]},{"k":"agac","t":"Sîganın çeşitleri","a":"أنواع صيغة الزواج","r":{"q":"Sîga nasıl çıktı?","a":"","o":[{"x":"Hiçbir şeyle kayıtlanmadan, mutlak (müneccez)","n":{"s":"caiz","x":"Sîga âkidlerden hiçbir şeyle kayıtlanmadan mutlak olarak çıkmıştır; hükmü sahihtir.","a":"العقد المنجز: هو صدور الصيغة عن العاقدين مطلقة غير مقيدة بشيء أصلا. حكمه: صحيح","not":""}},{"x":"Şart edatıyla bir şarta bağlandı (muallak)","n":{"q":"Bağlanılan şart akit anında gerçekleşmiş mi?","a":"العقد المعلق","o":[{"x":"Akit anında fiilen var","n":{"s":"caiz","x":"Akit sahihtir.","a":"إن كان الشرط الذي علقت الصيغة عليه واقعا بالفعل حين العقد فالعقد صحيح","not":"Örnek: \"İhtisas okursan evlenirim\" (zaten okuyor). Akit esnasında var olan şart. Meclis dağılmadan haber gelirse yine geçerlidir."}},{"x":"Gelecekte gerçekleşecek","n":{"s":"degil","x":"Akit sahih değildir.","a":"وإن كان الشرط الذي علقت الصيغة عليه مستقبلا فالعقد غير صحيح","not":"Örnek: \"İhtisas okuyacaksan evlenirim\" (henüz okumuyor). Önce şart, sonra akit. Kaide: «عقود التمليكات لا تقبل التعليق على الخطر» Temlik akitleri, gerçekleşip gerçekleşmeyeceği belli olmayan bir şarta bağlanmayı kabul etmez."}}]}},{"x":"Önce şartsız çıktı, sonra şart eklendi (muzâf)","n":{"q":"Eklenen şart akdin gereği, ona uygun, şer'î ya da örfî mi?","a":"العقد الذي أضيف إليه شرط","o":[{"x":"Evet","n":{"s":"caiz","x":"Akit de şart da sahihtir.","a":"العقد والشرط صحيح معا إن كان الشرط مما يقتضيه العقد أو مما يلائمه أو مما ورد به الشرع أو مما جرى عليه العرف","not":"Önce akit, sonra şart. Muktezaya uygunsa şart da akit de geçerli."}},{"x":"Hayır","n":{"s":"ihtilaf","x":"Şart batıl, akit sahihtir; Şâfiî'ye göre akit de batıldır.","a":"وإن لم يكن كذلك فالشرط باطل والعقد صحيح، وعند الشافعي العقد باطل أيضا","not":"Akdin muktezasına uygun değilse (ör. \"çalışmayacaksın\" gibi) akit geçerli, şart batıl."}}]}}]}}]},{"h":"Müt'a nikahı","b":[{"k":"d","t":"Müt'a nikahı","x":"Bir kadını belli bir mehir karşılığı geçici bir süre için nikahlamak demektir."},{"k":"ornek","x":"Erkeğin kadına \"Seninle iki dinara bir kaç gün istifade etmek (istimta') istiyorum\" demesine kadının \"kabul ettim\" demesidir."},{"k":"p","x":"Bu nikahta sürenin belirlenmesi ve şahitlerin varlığı şart değildir. Bilakis mübhem bir zamanın zikredilmesi yeterlidir. Ayrıca istimta' lafzı kullanılır."},{"k":"not","x":"İslam'ın ilk yıllarında bu nikah caiz olsa da daha sonra ittifak-ı ulema ile nehyedilmiştir. Şia bu nikahı caiz görür ve belirli kurallar dahilinde halen uygular."}]},{"h":"Muvakkat (geçici) nikah","b":[{"k":"d","t":"Muvakkat (geçici) nikah","x":"Şahitler huzurunda belli bir süre için evlilik ifade eden sözlerle yapılan nikâha denir."},{"k":"ornek","x":"Erkeğin kadına \"Seninle şu kadar mehre, bir ay süreyle evlenmek istiyorum\" demesi üzerine kadının \"kabul ettim\" demesidir."},{"k":"p","x":"Bu evliliğin şahitlerin huzurunda, belirli bir süre belirtilerek; ayrıca nikah ve zevac lafızları kullanılarak gerçekleşmesi onu müt'a nikahından ayıran özellikleridir. (şahit + süre + lafız)."},{"k":"p","x":"Hanefilere göre muvakkat nikah müt'a gibi batıldır. Eşlerden biri ölse diğeri varis olamaz. İmam Züfer ise bu nikahı kendisine şart izafe edilip mülaim ve şer'i olmayan akde benzetir. Yani akid sahih, şartı batıldır. Birbirlerine mirasçı olurlar."},{"k":"tbl","r":[["","Müt'a nikahı","Muvakkat nikah"],["**Şahit**","Şart değil","Şahitler huzurunda"],["**Süre**","Belirlenmesi şart değil, mübhem zaman yeter","Belirli süre"],["**Lafız**","İstimta' lafzı","Nikah ve zevac lafızları"],["**Hükmü**","Batıl (ittifakla nehyedildi)","Hanefilere göre batıl, miras yok; Züfer'e göre akit sahih şart batıl, mirasçı olurlar"]]}]},{"h":"Şiğar nikahı","b":[{"k":"d","t":"Şiğar nikahı","x":"İki kadının mehirsiz olarak biri diğerine mukabil olmak üzere iki erkeğe nikahlanmasına denir."},{"k":"ornek","x":"İki erkeğin bacılarını mehirsiz olarak değiş tokuş yoluyla birbirlerine nikah etmeleri gibi."},{"k":"p","x":"İşte nikahı haram kılan da mehir yerine ikame edilen kadınlardan faydalanma amacıdır. İslam şeriati bunu nehyetmiştir."},{"k":"li","x":"**İttifak var:** Mehir belirlenmese de akid geçerlidir. Mehrin hiç belirlenmediği akitler gibi mehr-i misil lazımdır."},{"k":"li","x":"**İhtilaf var:** Mehir yerine ikame edilen kadından faydalanma hususu tartışmalıdır. İmam Şafii'ye göre duhul öncesi ve sonrası farketmez böyle bir evlilik batıldır. İmam Malik'e göre duhulden önce feshedilir ama sonra feshedilmez. Ebu Hanife ve ona tabi olanlara göre bu muzaf akde benzer ki eklenen şart akde uygun değilse akid sahih şart batıldır. Eşlerden her biri için mehr-i misil gerekir. Bunun gerekçesi şudur: Mehir olarak zikredilen kadından istimta' mehre elverişli bir şey değildir. Bilakis mehir mütekavvim maldan olmalıdır. İstimta' ise mal değildir. Zira insan mübadele konusu olmayacak ölçüde değerlidir."},{"k":"d","t":"Mütekavvim mal","x":"Mali değeri olan şey. Dinen yararlanılması mubah olan veya bilfiil ihraz edilmiş mal anlamında fıkıh terimi."},{"k":"tbl","r":[["Mezhep","Şiğar nikahının hükmü"],["**İmam Şâfiî**","Duhulden önce de sonra da batıl"],["**İmam Mâlik**","Duhulden önce feshedilir, sonra feshedilmez"],["**Ebû Hanîfe ve ona tabi olanlar**","Muzâf akde benzer: akit sahih, şart batıl; her biri için mehr-i misil gerekir"]]}]}],"ht":[{"s":0,"x":"Müneccez akit: şartsız, mutlak sîga; sahihtir."},{"s":0,"x":"Muallak akit: şart akit anında varsa ya da meclis dağılmadan gerçekleşirse sahih; gelecekte gerçekleşecekse ya da gelecek zamana bağlıysa sahih değil (temlik akitleri tehlikeli ta'liki kabul etmez)."},{"s":0,"x":"Muzâf akit (şart sonradan eklenir): şart akdin gereği/uygun/şer'i/örfî ise ikisi de sahih; değilse akit sahih, şart batıl; Şâfiî'ye göre akit de batıl."},{"s":1,"x":"Müt'a: belli mehirle geçici süre için nikah; süre belirlemek ve şahit şart değil, istimta' lafzı kullanılır. İlk yıllarda caizdi, sonra ittifakla nehyedildi; Şia caiz görür."},{"s":2,"x":"Muvakkat nikahı müt'adan ayıran: şahit + süre + nikah/zevac lafzı. Hanefilere göre batıldır; Züfer'e göre akit sahih şart batıldır."},{"s":3,"x":"Şiğar: iki kadının mehirsiz olarak birbirine karşılık iki erkeğe nikahlanması. Mehir belirlenmese de akit geçerli, mehr-i misil lazım (ittifak)."},{"s":3,"x":"Şiğarın hükmü: Şâfiî — her durumda batıl; Mâlik — duhulden önce feshedilir; Ebû Hanîfe — akit sahih şart batıl, her birine mehr-i misil (istimta' mal değildir, mehir mütekavvim mal olmalıdır)."}]},{"t":"Nikâh Akdinin Hükmü","intro":"Hükmün iki anlamı: evliliğin şer'i vasfı (farz, vacip, haram, mekruh, mubah) ve nikah akdinin doğurduğu sonuçlar (sahih-nafiz, sahih-mevkuf, fasit ve batıl evlilik).","s":[{"h":"Hükmün iki anlamı","b":[{"k":"p","x":"Hüküm iki anlamdadır:"},{"k":"n","n":1,"x":"**Şer'i vasıf anlamında kullanılır:** Namazın hükmü vücubiyet, zinanın hükmü hürmet ifade eder."},{"k":"n","n":2,"x":"**Bir şeyin üzerine şer'an gerekli olan sonuç (eser) anlamında kullanılır:** Bey'in hükmü malın mülkiyetinin müşteriye naklidir. Şimdi evliliğin hükmünü, hükmün bu iki anlamı ile konuşacağız."}]},{"h":"Şer'i vasıf anlamında nikah akdinin hükmü","b":[{"k":"p","x":"Bu konuda alimler derin ihtilaflara düşmüşlerdir. Müellife göre pratikte tüm mükellefler için tek bir hüküm konulamaz aksine evlilik vücub, nedb, kerahet, tahrim ve ibaha olmak üzere beş hükme de ihtimallidir. Bu hükümler kişinin mali, bedeni ve ahlaki durumuna göre değişiklik arzeder."},{"k":"d","t":"Farz evlilik","x":"Mükellefin mehir ve nafakayı verebilmesi, eşine iyilikle davranacak olgunlukta olması, evlenmediği zaman zinaya düşme korkusu yaşaması gibi sebeplerin bir araya gelmesi ile o evlilik terkedilemez, farzdır."},{"k":"d","t":"Vacip evlilik","x":"Yukarıdaki şartları haiz olmakla beraber evliliği terk ettiği zaman zina bataklığına düşme ihtimali hem olan hem olmayan, bu konudaki sabır eşiği güven vermeyen kişilere evlenmek vaciptir. Bu derece olarak farzdan bir tık daha aşağıdadır."},{"k":"d","t":"Haram evlilik","x":"Mükellefin mehir ve nafakayı vermeye güç yetirebilecek malı yok, evlendiği zaman eşine iyi davranacak bir olgunluğa sahip olmadığı da belli oluyorsa bu kişinin evlenmesi haramdır. Çünkü bu kişinin evliliği nikahladığı kızcağız için bir travmadır."},{"k":"d","t":"Mekruh evlilik","x":"Mükellefin malı var, dengeli bir ahlaki çizgiye sahip olduğu için zina bataklığına düşme gibi bir korkusu da yok ama eşine kötü davranmaktan çekiniyorsa bu kişinin evlenmesi mekruhtur."},{"k":"d","t":"Mubah evlilik","x":"Mükellefin malı var, bekar kalsa zina yapmıyor, evlense eşine kötülük yapmıyor bu kişinin evlenmesi sünnettir."},{"k":"not","x":"Kitaptaki \"mubah\" lafzı sünnet olarak alınmıştır (dersten)."},{"k":"tbl","r":[["Hüküm","Malı var mı?","Zinaya düşme korkusu","Eşine kötü davranma endişesi"],["**Farz**","Var","Var (evlenmezse zinaya düşer)","Yok, iyilikle davranır"],["**Vacip**","Var","İhtimal var (sabır eşiği güven vermiyor)","Yok"],["**Haram**","Yok (ya da eşinin hakkını veremeyeceği belli)","—","Eşine iyi davranamayacağı belli"],["**Mekruh**","Var","Yok","Var"],["**Mubah (sünnet)**","Var","Yok","Yok"]]},{"k":"agac","t":"Evliliğin şer'i vasfı","a":"الوصف الشرعي","r":{"q":"Mehri ve evliliğin diğer masraflarını karşılayacak malı var mı?","a":"","o":[{"x":"Yok","n":{"s":"bilgi","x":"**Haram** — Malı olmayan için evlenmek haramdır.","a":"حرام: لمن لا يجد المال","not":""}},{"x":"Var","n":{"q":"Eşinin hakkını verip ona iyilikle davranabilecek mi?","a":"","o":[{"x":"Hayır, veremeyeceğini görüyor","n":{"s":"bilgi","x":"**Haram** — Malı olsa da eşinin hakkını veremeyeceğini ve ona iyilikle davranamayacağını görüyorsa evlenmesi haramdır.","a":"حرام: لمن يجد ويرى في نفسه أنه لا يؤدي حق الزوجة وأنه لا يستطيع أن يعاشرها بالمعروف","not":""}},{"x":"Evet","n":{"q":"Evlenmezse zinaya düşer mi?","a":"","o":[{"x":"Kesin düşer","n":{"s":"bilgi","x":"**Farz** — Malı olan, eşine iyilikle davranacağından emin olan ve evlenmezse zinaya düşecek olan için farzdır.","a":"فرض: لمن يجد المال ويثق أنه سيعاشرها بالمعروف وأنه إن لم يتزوج وقع في الزنا","not":""}},{"x":"Düşme ihtimali var","n":{"s":"bilgi","x":"**Vacip** — Malı olan, eşine iyilikle davranacağından emin, bedeni sağlam fakat zinaya düşme ihtimali olan için vaciptir.","a":"واجب: لمن يجد المال ويثق أنه سيعاشرها بالمعروف وهو سليم البدن ولكن يحتمل أن يقع في الزنا","not":""}},{"x":"Korkusu yok","n":{"q":"Eşine kötülük etmekten korkuyor mu?","a":"","o":[{"x":"Korkuyor","n":{"s":"bilgi","x":"**Mekruh** — Malı olan, zinaya düşmekten korkmayan fakat eşine kötülük etmekten korkan için mekruhtur.","a":"مكروه: لمن يجد المال ولا يخشى الوقوع في الزنا ولكن يخشى أن يسيء إليها","not":""}},{"x":"Korkmuyor","n":{"s":"bilgi","x":"**Mubah** — Malı olan, zinaya düşmekten de eşine kötülük etmekten de korkmayan için mubahtır.","a":"مباح: لمن يجد المال ولا يخشى الوقوع في الزنا ولا يخشى أن يسيء إليها","not":""}}]}}]}}]}}]}},{"k":"ar","a":"ملاحظة: المراد بالمال هنا أن يجد مالا يقوم بالمهر وسائر نفقات الزوجية","x":"Buradaki \"mal\"dan maksat, mehri ve evliliğin diğer masraflarını karşılayacak mala sahip olmaktır."}]},{"h":"Sonuç (eser) anlamında nikah akdinin hükmü","b":[{"k":"p","x":"Nikah akdini, sahih nafiz, sahih mevkuf, fasid ve batıl olmak üzere dörde taksim ederiz. Bu taksimatın doğurduğu sonuçlar aşağıdaki gibidir:"},{"k":"h","x":"a. Sahih - nâfiz evlilik"},{"k":"d","t":"Sahih - nâfiz evlilik","x":"İn'ikad, sıhhat ve nefaz şartlarının tamamının yerine getirildiği nikah akdidir."},{"k":"p","x":"Bunun sonuçları üç kısımda incelenir:"},{"k":"h5","x":"Kocanın sorumlulukları"},{"k":"p","x":"Dört tanedir: Mehir, nafaka, adalet, eziyet etmemek."},{"k":"li","x":"**Nafaka:** it'am, kisve, mesken ve hizmetçi varsa ücret-i hâdim."},{"k":"li","x":"**Adalet:** Birden fazla eşle evli olan erkek eşler arasında adaleti tesis etmelidir."},{"k":"li","x":"**Eziyet etmemek:** Şeriatin kendisine izin verdiği ölçünün dışına taşarak sözlü ve fiili eziyet etmek yasaklanmıştır."},{"k":"h5","x":"Kadının sorumlulukları"},{"k":"p","x":"Dört tanedir: Kadın \"kocaya itaat etmeli ve kendisi için hazırlanan evde oturmalı\", \"izinsiz evden çıkmamalı\", \"şeriatin engel koymadığı konularda kocaya uymalı\", \"kocanın te'dip hakkını kabul etmek.\""},{"k":"not","x":"Kadının (kocası için hazırlanan evde oturma) şartını yerine getirebilmesi için üç şart gereklidir: (1) Oturacağı evin kadına layık olması. (2) Mehr-i muacceli almış olması. (3) Kocanın kadının canı ve malı hususunda güvenilir olması."},{"k":"not","x":"İzinsiz evden çıkmama: Şeriatin izin verdiği durumlar hariç."},{"k":"h5","x":"Ortak sorumluluklar"},{"k":"p","x":"Beş tanedir. Nesebin sübûtu, veraset, hurmet-i musahara, istimta' hakkı, geçim ehli olmak."},{"k":"h","x":"b. Sahih - mevkuf (bağlı) evlilik"},{"k":"p","x":"Mevkuf nikah, ğayr-i nafiz (yürürlülük kazanmayan) bir akiddir."},{"k":"d","t":"Mevkuf nikah","x":"Sıhhat şartlarını tam olarak bulundurmakla birlikte, nikah sahibinin veya velisinin icazetine bağlı olan nikahtır."},{"k":"p","x":"Eğer duhul icazetten evvel meydana gelmişse fasid nikah hükümlerine tabi olur. Duhul, bu nikahın reddi hususundaki velinin hakkını düşürmez. Yani veli nikahı feshedebilir."},{"k":"p","x":"Bununla fasid akidde meydana gelecek tüm sonuçlar ortaya çıkar: İstimta' ile had gerekmez, mehir gerekir; nesebin sübutu, hürmet-i musahara gerçekleşir, boşadığı zaman kadına iddet gerekir."},{"k":"h","x":"c. Fâsid evlilik"},{"k":"d","t":"Fâsid nikah","x":"Sıhhat şartlarını tam olarak bulundurmayan nikahtır. Şahitsiz akdedilen nikah gibi."},{"k":"p","x":"Fasid akitte in'ikad şartları bulunur. Aynı şekilde ikrah altında yapılan akitlerde fasittir. Yine muvakkat akitler de fasittir."},{"k":"p","x":"Fasid evlenme akdinde tarafların evliliği sürdürmeleri caiz değildir. Aksine derhal ayrılmaları gerekir. Eğer kendiliklerinden ayrılmazlarsa adli makamlar bu evliliğe derhal son verirler. Çünkü Müslümanların dini ve dünyevi maslahatları bunu gerektirir."},{"k":"p","x":"Taraflar duhulden evvel ayrılmışlarsa veya hakim kararıyla ayrılmışlarsa bu akid asla hiç bir sonuç doğurmaz. Duhulden sonra ayrılık meydana gelirse dört şey vacip olur:"},{"k":"n","n":1,"x":"Mehr-i misil ile mehr-i müsemmadan hangisi daha az ise kadın ona hak sahibi olur. Fasit akitler kıymetine göre değerlendirilir."},{"k":"n","n":2,"x":"Akid tarihinden başlamak üzere en az altı ay geçtikten sonra doğan çocuğun nesebi sabit olur."},{"k":"n","n":3,"x":"Hürmet-i musahara meydana gelir."},{"k":"n","n":4,"x":"Eğer ayrılma olursa iddet ve iddet süresince nafaka da gerekir."},{"k":"dikkat","x":"Fasid akid üzerine sahih akid üzerine doğan neticeler terettüp etmez. Bunlar kısaca şunlardır: \"Kadının nafakası, tarafların veraseti, karşılıklı istimta', kadının kocasına itaati.\""},{"k":"h","x":"d. Bâtıl evlilik"},{"k":"d","t":"Bâtıl evlilik","x":"İn'ikad şartlarında bir eksiklik bulunan akde denir."},{"k":"ornek","x":"Birbiriyle evlenmesine mani bulunan kişilerin evlenmesi ile bir çocuğun ya da akıl hastasının kendi başına evlenmesi böyle bir evliliktir."},{"k":"p","x":"Kusur ana unsurlarda olduğu için bu akid hiç bir hüküm ifade etmez. Duhulün varlığı veya yokluğu eşittir. Taraflar derhal ayrılmalıdır. Ayrılmazlarsa kadı ayırmalıdır. Bile bile bu işe devam edenler zina yapmış olurlar. Ebu Hanife dışındaki imamlara göre had uygulanır. Ebu Hanife'ye göre akid şüphesi vardır."},{"k":"p","x":"Batıl akdin neticesi ile kadın iddet beklemez, neseb sabit olmaz, taraflar birbirlerine mirasçı olamazlar, ne mehir, ne nafaka ve ne de itaat gerekli değildir."},{"k":"not","x":"Anne ile çocuk arasında miras ilişkisi bulunur. Çocuk veled-i zina da olsa böyledir."},{"k":"tbl","r":[["Evlilik","Eksik olan","Sonuç"],["**Sahih - nâfiz**","Hiçbiri (in'ikad, sıhhat, nefaz tam)","Büt
