ün hükümler: kocanın, kadının ve ortak sorumluluklar"],["**Sahih - mevkuf**","Nefaz şartı (icazete bağlı)","İcazetten önce duhul olursa fasit hükümleri; veli feshedebilir"],["**Fâsid**","Sıhhat şartı (ör. şahitsiz)","Derhal ayrılırlar; duhulden sonra: az olan mehir, neseb (6 ay), hürmet-i musahara, iddet ve nafakası"],["**Bâtıl**","İn'ikad şartı","Hiçbir hüküm yok; iddet, neseb, miras, mehir, nafaka, itaat yok"]]}]},{"h":"Şema: nikâhın sonuçları","b":[{"k":"kart","t":"Nikâhın hükmü (eser anlamında)","a":"الأثر الذي يترتب شرعا على ذلك الشيء","g":[{"h":"Sahih-nâfiz evlilik","a":"الزواج الصحيح النافذ","m":["«هو الذي استوفى جميع شروط الانعقاد والصحة والنفاذ» İn'ikad, sıhhat ve nefaz şartlarının hepsini taşıyan evliliktir. — Kenar notu: in'ikad, nefaz ve sıhhat şartları tam ise nikah tam geçerlidir.","«آثار تجب للزوجة على الزوج: المهر والنفقة والعدل وعدم الإيذاء» Kocanın kadına karşı yükümlülükleri: mehir, nafaka, adalet, eziyet etmemek.","«آثار تجب للزوج على الزوجة: الطاعة في كل أمور لا تخالف الشرع» Kadının kocaya karşı yükümlülüğü: şer'e aykırı olmayan her işte itaat.","«آثار تجب لكل واحد منهما للآخر: ثبوت النسب والتوارث وحرمة المصاهرة والاستمتاع بالآخر وحسن المعاشرة» Her birinin diğerine karşı: nesebin sübûtu, mirasçılık, hürmet-i musahara, birbirinden faydalanma, iyi geçinme."]},{"h":"Sahih-mevkuf evlilik","a":"الزواج الصحيح الموقوف","m":["«هو الذي فقد شرطا من شروط النفاذ» Nefaz şartlarından birini taşımayan evliliktir.","«فلو دخل بها قبل الإجازة فكالفاسد بعد الدخول» İcazetten önce duhul ederse, duhulden sonraki fasit evlilik gibidir."]},{"h":"Fasit evlilik","a":"الزواج الفاسد","m":["«هو الذي اختل فيه شرط من شروط الصحة» Sıhhat şartlarından biri bozuk olan evliliktir.","«إن افترقا قبل الدخول لا يجب شيء» Duhulden önce ayrılırlarsa hiçbir şey vacip olmaz.","«إن افترقا بعد الدخول يجب بهذا العقد ثبوت النسب وحرمة المصاهرة والعدة، ومهر المثل إن لم يسم المهر، والأقل من المهر المسمى والمثل إن سمي» Duhulden sonra ayrılırlarsa: neseb, hürmet-i musahara, iddet; mehir belirlenmemişse mehr-i misil, belirlenmişse müsemma ile misilden azı."]},{"h":"Batıl evlilik","a":"الزواج الباطل","m":["«هو الذي فقد شرطا من شروط الانعقاد، لا يترتب عليه أثر لأن وجوده كعدمه» İn'ikad şartlarından birini taşımayan evliliktir; varlığı yokluğu gibi olduğu için hiçbir sonuç doğurmaz."]}]}]},{"h":"Nikahın kısımları","b":[{"k":"agac","t":"Nikâhın kısımları","a":"أقسام النكاح","r":{"q":"İn'ikad şartları tam mı?","a":"","o":[{"x":"Hayır","n":{"s":"bilgi","x":"**Bâtıl nikâh** — İn'ikâd şartları noksan; üzerine nikâh hükümleri terettüp etmeyen nikâh.","a":"النكاح الباطل","not":""}},{"x":"Evet","n":{"q":"Sıhhat şartları tam mı?","a":"","o":[{"x":"Hayır","n":{"s":"bilgi","x":"**Fâsid nikâh** — Sıhhat şartları noksan; şahitsiz kıyılan nikâh.","a":"النكاح الفاسد","not":""}},{"x":"Evet (sahih nikâh)","n":{"q":"Nikâh sahibinin ya da velisinin icâzetine bağlı mı?","a":"النكاح الصحيح","o":[{"x":"Evet","n":{"s":"bilgi","x":"**Gayr-i nâfiz (mevkuf) nikâh** — Nikâh sahibinin veya velisinin icâzetine bağlı.","a":"غير نافذ (موقوف)","not":""}},{"x":"Hayır (nâfiz)","n":{"q":"Feshe kâbil mi?","a":"نافذ","o":[{"x":"Hayır","n":{"s":"bilgi","x":"**Lâzım nikâh** — Feshe kâbil olmayan nikâh.","a":"لازم","not":""}},{"x":"Evet","n":{"s":"bilgi","x":"**Gayr-i lâzım nikâh** — Feshe kâbil olan nikâh (ör. hıyâr-ı bulûğ).","a":"غير لازم","not":""}}]}}]}}]}}]}}]}],"ht":[{"s":0,"x":"Hükmün iki anlamı: şer'i vasıf (namaz → vücub, zina → hürmet) ve şer'an gerekli olan sonuç/eser (bey' → mülkiyetin müşteriye nakli)."},{"s":1,"x":"Evliliğin beş hükmü kişinin mali, bedeni ve ahlaki durumuna göre değişir: farz (mal var + zina korkusu kesin), vacip (zina ihtimali), haram (mal yok ya da eşine iyi davranamayacak), mekruh (eşine kötü davranma endişesi), mubah/sünnet (ne zina korkusu ne kötülük endişesi)."},{"s":1,"x":"Buradaki \"mal\": mehri ve evliliğin diğer nafakalarını karşılayacak mal."},{"s":2,"x":"Sahih-nâfiz: kocaya 4 sorumluluk (mehir, nafaka, adalet, eziyet etmemek); kadına 4 (itaat ve evde oturma, izinsiz çıkmama, şer'e aykırı olmayanda uyma, te'dip hakkını kabul); ortak 5 (neseb, veraset, hürmet-i musahara, istimta', geçim ehli olmak)."},{"s":2,"x":"Mevkuf: sıhhat şartları tam, nikah sahibinin ya da velinin icazetine bağlı; icazetten önce duhul olursa fasit hükümleri işler, veli feshedebilir."},{"s":2,"x":"Fasit: duhulden sonra ayrılınca 4 şey vacip: mehr-i misil ile müsemmadan azı, (en az 6 ay sonra doğan çocuğun) nesebi, hürmet-i musahara, iddet ve iddet nafakası."},{"s":2,"x":"Batıl: hiçbir hüküm doğurmaz; Ebû Hanîfe dışındakilere göre had uygulanır, Ebû Hanîfe'ye göre akit şüphesi vardır."},{"s":4,"x":"Nikahın kısımları: sahih (nafiz → lazım / gayr-i lazım; mevkuf), fasit (sıhhat şartı eksik, ör. şahitsiz), batıl (in'ikad şartı eksik)."}]},{"t":"Ebedî Evlilik Engelleri","intro":"Nikahlanması haram olan kadınlar ve haram olma sebepleri; ebedî (müebbed) engeller: karabet (neseb), musahara (sıhriyyet) ve rada' (süt emme).","s":[{"h":"Nikahlanması haram olan kadınlar ve haram olma sebepleri","b":[{"k":"p","x":"Erkeğe haram olan kadınlar ya müebbed ya muvakkat haram olur. Müebbed haramlık, karabet (neseb), musahara (sıhriyyet, evlilikle) ve rada' (süt emme) ile gerçekleşirken muvakkat haramlık, mahrem iki kadının bir nikahta bulunması, kadının başkası ile evli olması, kadının üç talakla boşanmış olması, erkeğin dört eşe sahip olması, kadının semavi bir dine mensup olmaması olmak üzere beş şey ile gerçekleşir. Şimdi bu sekiz maddeyi tek tek konuşacağız:"},{"k":"not","x":"Geçici haramlık ile ilgili mecelle kaidesi şöyledir: \"Mani zail olunca memnu' avdet eder.\""},{"k":"tbl","r":[["Müebbed (ebedî) haramlık","Muvakkat (geçici) haramlık"],["Karabet (neseb)","Mahrem iki kadının bir nikahta bulunması"],["Musahara (sıhriyyet, evlilikle)","Kadının başkası ile evli olması"],["Rada' (süt emme)","Kadının üç talakla boşanmış olması"],["","Erkeğin dört eşe sahip olması"],["","Kadının semavi bir dine mensup olmaması"]]}]},{"h":"Ebedi evlilik engelleri","b":[{"k":"p","x":"Bunlar Nisa Suresi 23. ayette zikredilen on iki kısım kadındır."}]},{"h":"Karabet - neseb","b":[{"k":"ar","a":"حُرِّمَتْ عَلَيْكُمْ أُمَّهَاتُكُمْ وَبَنَاتُكُمْ وَأَخَوَاتُكُمْ وَعَمَّاتُكُمْ وَخَالَاتُكُمْ وَبَنَاتُ الْأَخِ وَبَنَاتُ الْأُخْتِ","x":""},{"k":"p","x":"Neseb bakımından erkeğe haram olan kadınlar dört nev'idir."},{"k":"n","n":1,"x":"**Usul:** Anne, baba, yukarı doğru... «حُرِّمَتْ عَلَيْكُمْ أُمَّهَاتُكُمْ»"},{"k":"n","n":2,"x":"**Furu':** Çocuk, torun, aşağı doğru... «وَبَنَاتُكُمْ»"},{"k":"n","n":3,"x":"**Anne ve babanın furu'u:** Kardeşler, kardeşlerin furu'u. «وَأَخَوَاتُكُمْ»، «وَبَنَاتُ الْأَخِ وَبَنَاتُ الْأُخْتِ»"},{"k":"n","n":4,"x":"**Dede ve ninenin furu'u:** Hala ve teyze ile usulünün hala ve teyzeleri. Dedeler bir dereceden ayrılmıştır. Ancak iki dereceden ayrılanlar haram olmazlar. Amca, hala, teyzenin kızları ile annenin ve babanın halasının kızları böyledir."}]},{"h":"Musahara - sıhriyyet","b":[{"k":"p","x":"Evlilik sebebiyle meydana gelen yakınlık sebebiyle oluşan ebedi haramlık dört nev'idir."},{"k":"h","x":"a. Kadının furu'u"},{"k":"p","x":"Erkeğin evlendiği eşinin önceki kocasından olan kızları (üvey kızlar) ile ilgili hüküm şöyledir. Eğer erkek bu kadına duhul etmişse kızlar ve bu kızların kızları ile bu oğulların kızları erkeğe haram olur. Ayette şöyle buyrulur: «وَرَبَائِبُكُمُ اللَّاتِي فِي حُجُورِكُمْ مِنْ نِسَائِكُمُ اللَّاتِي دَخَلْتُمْ بِهِنَّ»"},{"k":"p","x":"Eğer duhul gerçekleşmemişse (duhulden önce erkek bu kadından boşandı veya öldü) bu kadının kızları adama haram olmaz. Ayette şöyle buyrulur: «فَإِنْ لَمْ تَكُونُوا دَخَلْتُمْ بِهِنَّ فَلَا جُنَاحَ عَلَيْكُمْ»"},{"k":"h","x":"b. Kadının usulü"},{"k":"p","x":"Burada duhula bakılmaz, nikah yeterlidir. Örneğin kadının annesi veya ninesi nikahtan ötürü erkeğe haram olur. «وَأُمَّهَاتُ نِسَائِكُمْ»"},{"k":"h","x":"c. Usulünün eşleri"},{"k":"p","x":"Üvey anneler, üvey nineler haramdır. Mücerred akid yeterlidir. Duhul şartı aranmaz."},{"k":"ar","a":"وَلَا تَنْكِحُوا مَا نَكَحَ آبَاؤُكُمْ مِنَ النِّسَاءِ إِلَّا مَا قَدْ سَلَفَ إِنَّهُ كَانَ فَاحِشَةً وَمَقْتًا وَسَاءَ سَبِيلًا","x":""},{"k":"h","x":"d. Furu'unun eşleri"},{"k":"p","x":"Gelinler haramdır. «وَحَلَائِلُ أَبْنَائِكُمُ الَّذِينَ مِنْ أَصْلَابِكُمْ» Burada kendi sulblerinizden kaydı ile evlatlıkların eşlerinin haram olmadığı ortaya çıkmıştır. Başka bir deyişle evlatlık evlat olmadığı için onun boşadığı eşi ile erkek (babalık) evlenebilir. Ayet-i kerime buna delildir:"},{"k":"ar","a":"فَلَمَّا قَضَى زَيْدٌ مِنْهَا وَطَرًا زَوَّجْنَاكَهَا لِكَيْ لَا يَكُونَ عَلَى الْمُؤْمِنِينَ حَرَجٌ فِي أَزْوَاجِ أَدْعِيَائِهِمْ إِذَا قَضَوْا مِنْهُنَّ وَطَرًا","x":""},{"k":"d","t":"Evlatlık","x":"Erkeğin hakiki babası olmadığı halde çocuğu kendisine nispet etmesidir."},{"k":"tbl","r":[["Musahara nev'i","Kimler","Şart"],["**Kadının furu'u**","Üvey kızlar, onların ve üvey oğulların kızları","Anneye duhul etmiş olmak"],["**Kadının usulü**","Kayınvalide, kadının ninesi","Nikah yeterli, duhule bakılmaz"],["**Usulünün eşleri**","Üvey anne, üvey nine","Mücerred akid yeterli"],["**Furu'unun eşleri**","Gelinler (sulbden olan oğulların eşleri)","Evlatlığın eşi haram değildir"]]},{"k":"sc","q":"Zina ile sıhriyyet doğar mı?","x":"Ebu Hanife'ye göre zina yapılan kadın nikahlanmış kadın gibidir. Dolayısıyla sıhriyyet oluşur. Ahmed b. Hanbel ile İmam Malik bunu benimsemiştir. İmam Şafii ile Malik'in başka bir görüşüne göre sıhriyyet oluşmaz. İmam Şafii'ye göre evlilik kerahatle beraber caizdir. Ona göre zina haramından dolayı evlilik de haram olmaz. Osmanlı Aile Hukuk kararnamesi de zinanın sıhriyyet oluşturmayacağı görüşünü benimsemiştir."}]},{"h":"Rada' (süt emme)","b":[{"k":"p","x":"Kişiye neseb yoluyla haram olanlar süt emme yoluyla da haram olurlar. Kaide şöyledir: \"Emenin emzirene nefsi, emzirenin emene nesli haramdır.\" Bu iki cümle istisnalarla beraber genel bir fikir vermektedir. Kur'an-ı Kerim süt anne ve süt kız kardeş ile evlenmenin haramlığını va'zetmiş «وَأُمَّهَاتُكُمُ اللَّاتِي أَرْضَعْنَكُمْ وَأَخَوَاتُكُمْ مِنَ الرَّضَاعَةِ» geri kalanlar ise hadislerle bildirilmiştir."},{"k":"p","x":"Süt hısımlığının evlenme engeli teşkil etmesindeki ölçü ve sınırları belirleyen bu naslar ışığında şu kimselerle evlenilemez."},{"k":"n","n":1,"x":"Süt yönünden üst soy (usûl): Süt anne, süt baba, süt nine ve daha yukarısı"},{"k":"n","n":2,"x":"Süt yönünden alt soy (furû): Süt kızı, süt oğlu ve bunların daha aşağısı"},{"k":"n","n":3,"x":"Süt anne babanın kan veya süt yoluyla olan furûu."},{"k":"n","n":4,"x":"Süt dede ninenin birinci dereceden furûu, yani sadece çocukları: Süt teyze, hala, amca ve dayı"},{"k":"n","n":5,"x":"Eşinin süt usûlü: Eşinin süt anne ve ninesi"},{"k":"n","n":6,"x":"Eşinin daha önceki bir evliliği sırasında emzirdiği süt çocukları"},{"k":"n","n":7,"x":"Süt usûlünün eşi: Süt anne babanın eşleri"},{"k":"n","n":8,"x":"Süt furûunun eşi. Süt çocuğu veya süt torununun eşleri."},{"k":"not","x":"Süt oğlun öz kız kardeşi, süt kız veya erkek kardeşin annesi, süt oğul veya kızın ninesi, süt erkek veya kız kardeşinin kız kardeşi ile evlenilebilir."},{"k":"not","x":"Hanefîler, bu sayılan süt akrabalardan şu iki sınıfı istisna etmişlerdir: a. Süt kardeşin asıl annesi ve asıl kardeşi b. Süt oğul veya kızın asıl kardeşi."},{"k":"p","x":"İmam Şafii'ye (Hanbeliler de aynı) göre fasılalı 5 emme, Hanefiler mideye ulaşan bir damla, Malikilere göre en az üç emme, süt hısımlığının oluşması için yeterlidir. Emmenin zamanı hususunda cumhur 2 yıl, Ebu Hanife 2,5 yıl, İmam Züfer 3 yıl, Hanefi mezhebi 2 yıl derken Zahiriler ve Hz. Aişe'ye göre yaşın bir önemi yoktur. Emilen sütün sahibi kadın ve canlı olmalıdır. Süt başka bir süte karışmışsa ondan çok olmalı, pişirilmemelidir. Bir kaba sağılan süt memeden emilen süt gibi haramlık doğurur."},{"k":"not","x":"Çocuğun memeyi bırakması 1 fasıladır."},{"k":"tbl","r":[["Görüş sahibi","Süt hısımlığı için yeterli emme"],["**İmam Şâfiî (Hanbeliler de aynı)**","Fasılalı 5 emme"],["**Hanefiler**","Mideye ulaşan bir damla"],["**Mâlikîler**","En az üç emme"]]},{"k":"p","x":"Emmenin zamanı:"},{"k":"tbl","r":[["Görüş sahibi","Emmenin zamanı"],["**Cumhur**","2 yıl"],["**Ebû Hanîfe**","2,5 yıl"],["**İmam Züfer**","3 yıl"],["**Hanefi mezhebi**","2 yıl"],["**Zâhirîler ve Hz. Âişe**","Yaşın önemi yok"]]}]},{"h":"Şema: ebedî evlilik engelleri","b":[{"k":"kart","t":"Ebedî haramlık sebepleri","a":"أسباب المحرمة المؤبدة","g":[{"h":"Neseb (karabet) · erkeğe dört nevi kadın haramdır","a":"النسب (القرابة)","m":["«أصوله» Usulü — «حرمت عليكم أمهاتكم…»","«فروعه» Furu'u — «… وبناتكم…»","«فروع أبويه» Anne-babasının furu'u — «… وأخواتكم» / «وبنات الأخ» / «وبنات الأخت»","«فروع أجداده وجداته بدرجة واحدة» Dede ve ninelerinin bir derece furu'u — Kenar notu: hala-teyze, amca-dayı."]},{"h":"Rada' (süt emme)","a":"الرضاع","m":["«وأمهاتكم اللاتي أرضعنكم…»","«يحرم من الرضاع ما يحرم من النسب» Neseb yoluyla haram olan süt yoluyla da haram olur."]},{"h":"Musahara","a":"المصاهرة","m":["«فروع زوجته التي دخل بها» Duhul ettiği eşinin furu'u — «وربائبكم اللاتي في حجوركم من نسائكم اللاتي دخلتم بهن»","«أصول زوجته» Eşinin usulü — «…وأمهات نسائكم…» — Kenar notu: kaynana.","«زوجات أصوله» Usulünün eşleri — «ولا تنكحوا ما نكح آباؤكم…» — Kenar notu: üvey anne.","«زوجات فروعه» Furu'unun eşleri — «…وحلائل أبنائكم…» — Kenar notu: gelin."]},{"h":"Kaide","a":"ملاحظة / القاعدة","m":["«دخول الأمهات يُحَرِّمُ البنات، ونِكاح البنات يُحَرِّمُ الأمهات» Annelere duhul kızları haram kılar; kızları nikahlamak anneleri haram kılar."]}]}]}],"ht":[{"s":0,"x":"Haramlık müebbed (3 sebep: karabet, musahara, rada') ya da muvakkattır (5 sebep: iki mahremi cem', kadının evli olması, üç talak, dört eş, kadının semavi dine mensup olmaması). Toplam sekiz madde."},{"s":0,"x":"Geçici haramlıkta Mecelle kaidesi: \"Mani zail olunca memnu' avdet eder.\""},{"s":2,"x":"Neseb yoluyla dört nev': usul (anne, nine…), furu' (kız, torun…), anne-babanın furu'u (kardeşler ve onların furu'u), dede-ninenin birinci derece furu'u (hala, teyze); amca, hala, teyze kızları haram değildir."},{"s":3,"x":"Musaharanın dört nev'i: kadının furu'u (anneye duhul şartıyla), kadının usulü (nikah yeterli), usulün eşleri (akid yeterli), sulbden furu'un eşleri (evlatlığın eşi haram değil — Zeyd ayeti)."},{"s":3,"x":"Zina ile sıhriyyet: Ebû Hanîfe, Ahmed b. Hanbel ve (bir görüşte) Mâlik'e göre oluşur; Şâfiî ve Mâlik'in diğer görüşüne göre oluşmaz (Şâfiî: evlilik kerahetle caiz). Osmanlı Aile Hukuku Kararnamesi oluşmaz görüşünü benimsedi."},{"s":4,"x":"Rada' kaidesi: \"Emenin emzirene nefsi, emzirenin emene nesli haramdır.\" Süt anne ve süt kız kardeş ayetle, diğerleri hadislerle haram kılındı."},{"s":4,"x":"Yeterli emme: Şâfiî ve Hanbelî fasılalı 5 emme; Hanefî mideye ulaşan bir damla; Mâlikî en az 3 emme. Süre: cumhur 2 yıl, Ebû Hanîfe 2,5, Züfer 3, Hanefî mezhebi 2; Zâhirîler ve Hz. Âişe'ye göre yaş önemsiz."},{"s":4,"x":"Süt sahibi kadın ve canlı olmalı; başka süte karışmışsa çok olmalı, pişirilmemeli; kaba sağılan süt de haramlık doğurur."},{"s":5,"x":"Kaide: annelere duhul kızları, kızlarla nikah anneleri haram kılar."}]},{"t":"Geçici Evlilik Engelleri ve Ehl-i Kitapla Evlilik","intro":"Muvakkat (geçici) evlilik engelleri: iki mahremi bir nikahta cem', başkasının nikahındaki kadın, üç talak, dört eş, semavi dine mensup olmayan kadın ve cariye ile evlilik; Ehl-i Kitapla evlilik ve gayrimüslimlerin kendi aralarında evlenmesi.","s":[{"h":"İki mahremi bir nikahta cem' etmek","b":[{"k":"p","x":"Bu konuda ayette şöyle buyrulmaktadır: «وَأَنْ تَجْمَعُوا بَيْنَ الْأُخْتَيْنِ إِلَّا مَا قَدْ سَلَفَ» Bu ibare ile iki kız kardeşin bir arada nikahlanması haram kılınmıştır."},{"k":"not","x":"Bir kadın, teyzesi veya halası ile de aynı erkeğin nikahında bulunamaz. Bu konuda hadisler vardır."},{"k":"p","x":"Ancak bu geçici bir haramlıktır. Bu haramlığın kalkması için nikahlı olan kadının ölmesi ya da boşanıp iddetinin bitmesi gerekir ki kız kardeşi helal olsun."},{"k":"p","x":"Böyle bir yasaklık aile kurumunda bulunması gereken bazı hasletleri yok edecektir. Şayet bu caiz olsaydı o zaman aile bağları zarar görür, meveddet ve rahmetin yerini kargaşa alırdı (kat-ı rahm). Kur'an'da şöyle buyrulmaktadır: «وَجَعَلَ بَيْنَكُمْ مَوَدَّةً وَرَحْمَةً» Sevgili Peygamberimiz de \"Siz bunu yaptığınızda sıla-ı rahmi kesersiniz\" buyurmuşlardır."},{"k":"p","x":"Bu konuda önemli konulardan üç şeye dikkat çekmek istiyoruz:"},{"k":"h","x":"a) Süt yoluyla mahremiyet"},{"k":"p","x":"Bilindiği gibi süt emme yolu ile olan mahremiyet neseb yoluyla mahremiyet gibidir. Böyle olunca rada' sebebiyle de kardeş olan iki kadın bir nikahta toplanamaz. Yine kadının süt teyzesi ve halası, süt erkek veya kız kardeşinin kızları ile bir nikahta bulunması yasaktır."},{"k":"h","x":"b) Genel kural"},{"k":"p","x":"Birbirine çok yakın akrabaları (el-cânibeyn) aynı nikahta toplama yasağının kapsamı konusunda fakihler tarafından şöyle bir genel kural kabul edilmiştir:"},{"k":"dikkat","x":"\"Aynı nikah altında toplanmak istenen iki kadından birisi erkek farzedildiği takdirde; bunlar arasındaki süt veya nesep akrabalığının derecesi, birbirleriyle evlenmeye engel teşkil ediyorsa, üçüncü kişinin bu kadınların ikisini nikahlaması mümkün değildir. Aksi takdirde herhangi bir nikah engeli sözkonusu olmamaktadır.\""},{"k":"ornek","x":"Birbirine hala-yeğen durumunda olan iki kadından herhangi birisinin erkek olduğu varsayıldığında (hala-amca olarak kabul edildiği takdirde), erkeğin kendi kızkardeşinin kızı ile evlenmesi sözkonusu olmaktadır. Halbuki bunun yasaklığı Kur'an ile sabittir. Buna karşılık amca çocukları arasında evlenme engeli sözkonusu olmadığı için, iki amca kızını aynı nikahta toplamak da nikah engeli oluşturmamaktadır."},{"k":"h","x":"c) Mahremi ile evlenmenin hükmü"},{"k":"p","x":"Kişi bir kadınla evliyken bir de bu kadının mahremi ile evlense hüküm nedir? Bu çeşitli açılardan ele alınmıştır. Bu nikahlar ya tek akitte ya da iki ayrı akitte meydana gelmiştir."},{"k":"li","x":"Bir kimse, iki kız kardeşi, bir akidle nikahlamış olsa; hemen bunlar ayrılırlar. Bu ayrılma, duhûlden önce olursa, ikisine de bir şey lâzım gelmez. Ancak, bunlar duhulden sonra ayrılırlarsa, bu kız kardeşlerden her birine, mehr-i müsemmânın, misli itibari ile en azı verilir."},{"k":"li","x":"Bu kimse, iki kız kardeşi ayrı ayrı nikahlamış olursa; ikinci kız kardeşin nikâhı sahih olmaz. Şayet, durumu kadı bilirse, bunları derhal ayırır. Duhulden önce ayrılmış olurlarsa, hiç bir hüküm sabit olmaz. Fakat bunlar, duhulden sonra ayrılırlarsa, mehr-i mislin en azı gerekir; kadına ise, iddet lâzım gelir. Böylece, nesep açığa çıkıp sabit olur. Bu şahıs da, ayrılan kız kardeşin iddeti bitene kadar, önceki karısı olan kız kardeşin yanına varıp cimâ'da bulunamaz."},{"k":"li","x":"Bir kimse, iki kız kardeşi ayrı ayrı nikahlamış olsa ve fakat hangisinin önce nikahlanmış olduğu bilinmese; bu durumda, kocaya gerekli açıklamada bulunması emredilir. Bir açıklamada bulunursa, beyana göre hareket edilir. Bir açıklamada bulunmazsa; bu hususta bir araştırma yapılmaz ve bu iki kız kardeş de, o kocadan ayırılır."},{"k":"li","x":"Bu durumda, bu iki kız kardeşe akid esnasında konuşulan mehirleri müsâvî ise ve talâk duhûlden önce vuku bulmuşsa, yarım mehir verilir; eğer mehirleri değişikse, her birine kendi mehirlerinin dörtte biri verilir. Eğer, ayrılık duhûlden sonra olursa, bu durumda, bu kız kardeşlerden her birine, tam mehir vermek gerekir."},{"k":"agac","t":"Aralarını cem' etmek haram olan iki kadınla evlenmek","a":"إذا أقدم الرجل على الجمع بين امرأتين يحرم الجمع بينهما فما الحكم","r":{"q":"Onlarla nasıl evlendi?","a":"","o":[{"x":"Tek akitle","n":{"q":"İkisi de onunla evlenmeye elverişli mi?","a":"إذا يتزوجهما بعقد واحد","o":[{"x":"İkisi de elverişli","n":{"s":"degil","x":"Akit ikisi için de fasittir; fasit evlilik hükümleri işler.","a":"فالعقد فاسد بالنسبة لهما جميعا وتجري عليه أحكام الزواج الفاسد","not":"Akit fasit; iki fasit evlilik."}},{"x":"Biri elverişli değil (ör. kocanın süt kız kardeşi)","n":{"s":"ihtilaf","x":"Engeli olan için nikah fasit, engeli olmayan için sahihtir.","a":"فهذا النكاح فاسد بالنسبة لهذه يجري عليه جميع أحكام الزواج الفاسد، وصحيح بالنسبة لمن لا مانع لها","not":"Fasit olur, süt kardeş gibi."}}]}},{"x":"Ayrı akitlerle","n":{"q":"İki akit de sıhhat şartlarını taşıyor mu?","a":"إن يتزوجهما بعقدين مختلفين","o":[{"x":"Biri taşıyor, biri taşımıyor","n":{"s":"ihtilaf","x":"Şartları taşıyan sahih, taşımayan fasittir; önce, birlikte ya da sonra olması fark etmez.","a":"فالذي استوفى جميع الشروط هو الصحيح والذي لم يستوفها فاسد سواء كان متقدما على المستوفي أم كان مقارنا له أم كان متأخرا عنه","not":""}},{"x":"İkisi de taşıyor","n":{"q":"Hangisinin önce olduğu biliniyor mu?","a":"أو كلاهما يستوفيان جميع الشروط","o":[{"x":"Biliniyor","n":{"s":"ihtilaf","x":"Önceliği bilinen sahih, sonralığı bilinen fasittir.","a":"فالذي علمت أسبقيته صحيح والذي علم تأخره فاسد","not":""}},{"x":"Bilinmiyor ya da unutuldu","n":{"s":"degil","x":"İki akit de fasittir.","a":"وإذا لم نعلم أسبقية واحد منهما أو علمت ثم نسيت فكلا العقدين فاسد","not":"Fasit, fasit."}}]}}]}}]}}]},{"h":"Başkasının nikahındaki kadınla evlenmek","b":[{"k":"p","x":"İslam Hukuku erkeğin, birden fazla evliliğine (taaddüd-i zevcat) cevaz vermiş fakat kadının birden fazla erkekle evlenmesini yasaklamıştır. Bu nedenle başkası ile halen evli olmaktan doğan evlenme engeline hakku'l-ğayr (başkasına aidiyet) de denilmektedir."},{"k":"p","x":"Olayın esası şudur: \"Bir erkekle evli olmak, hatta boşandığı halde iddet bekleme sürecinde olmak, boşanmış kadın açısından evlenme engeli sayılmakta, iddetin bitmesiyle de nikah engeli ortadan kalkmaktadır. Boşanmasına rağmen eski kocası ile evliliğin bazı sonuçları devam edebileceği için iddet, bu kadınla evlenmek isteyen diğer erkekler açısından da bir evlenme engeli oluşturmaktadır.\""},{"k":"not","x":"Çünkü kadının iddet beklemesi \"hükmi evlilik\" olarak değerlendirilmiştir."},{"k":"p","x":"Bu cümlelerden iki şey ortaya çıkmıştır: hakku'l-ğayr ve iddet süresi. «وَالْمُحْصَنَاتُ مِنَ النِّسَاءِ»، «وَالْمُطَلَّقَاتُ يَتَرَبَّصْنَ بِأَنْفُسِهِنَّ ثَلَاثَةَ قُرُوءٍ» ve «وَلَا تَعْزِمُوا عُقْدَةَ النِّكَاحِ حَتَّى يَبْلُغَ الْكِتَابُ أَجَلَهُ» ayeti kerimeler delildir."},{"k":"not","x":"Buradaki muhsanat, evli kadınlar demektir."},{"k":"p","x":"Zina yapan kadınla evlenmeye gelince, bu kadın Ebu Hanife, Muhammed ve Şafii'ye göre zina yaptığı erkekle veya başkasıyla evlenebilir. Başkası ise, zifaf için çocuğun doğumunu bekler. Malik ve Hanbel'e göre başkası ise evlilik için iddet beklemesi gerekir. Ebu Yusuf ve Züfer'e göre kadın hamile ise başkası ile evlenemez. Çocuk doğduktan sonra evlenebilir."},{"k":"tbl","r":[["Görüş sahibi","Zina yapan kadınla evlenme"],["**Ebû Hanîfe, Muhammed ve Şâfiî**","Zina yaptığı erkekle de başkasıyla da evlenebilir; başkası zifaf için doğumu bekler."],["**Mâlik ve Hanbel**","Başkası ise evlilik için iddet beklemesi gerekir."],["**Ebû Yûsuf ve Züfer**","Hamile ise başkasıyla evlenemez; çocuk doğduktan sonra evlenebilir."]]}]},{"h":"Üç talakla boşadığı kadınla evlenmek","b":[{"k":"p","x":"Üçlü boşamadan doğan evlenme engeli Kur'an-ı Kerim'de şu şekilde ifadesini bulmaktadır: «فَإِنْ طَلَّقَهَا فَلَا تَحِلُّ لَهُ مِنْ بَعْدُ حَتَّى تَنْكِحَ زَوْجًا غَيْرَهُ» Bu ayetten anlaşılmaktadır ki, üçlü talak ile evliliğin sona erdiği durumlarda kocanın, boşadığı kadın ile yeniden evlenebilmesi için beş şart aranır."},{"k":"steps","x":["**İddet:** Kadının iddet beklemesi.","**Nikah:** Başka bir erkek ile hukuka uygun olarak evlenmesi.","**Duhul:** Evliliğin fiilen gerçekleşmiş olması gerekir. Evlenmenin ca'li olması halinde bu şartın gerçekleşmediği kabul edilmektedir. Bu sebeple nikah akdi gerçekleşmesine rağmen henüz fiili birleşme (zifaf) olmadan önce kocanın ölmesi durumunda bain talaktan doğan evlenme engeli, devam etmektedir.","**Boşama:** Bu son evliliğin, kocanın boşaması, vefat etmesi veya evliliği sona erdiren diğer sebeplerden birisi ile sona ermiş olması.","**İddet:** Kadının yeniden iddet beklemesi gerekir."]},{"k":"p","x":"Aranan bu şartların hepsinin usulüne uygun olarak gerçekleşmesinden sonra, bu kadın ile kendisini boşayan ilk kocasının karşılıklı irade beyanında bulunarak yeni bir evlenme akdi yapmaları mümkündür."},{"k":"h","x":"Lian"},{"k":"not","x":"Lian hakkında da bir iki cümle aktaracak olursak şunları not edebiliriz: \"Lianın geçici bir evlenme engeli olduğu, sadece İmam Ebu Hanife ve İmam Muhammed tarafından kabul edilmektedir. Çünkü bunlara göre kocanın liandan dönmesi ile lian hükümsüz olmaktadır.\""},{"k":"p","x":"Şafii, Maliki, Hanbeli, Zahiri ve İmamiyye mezhepleri ile Hanefilerden Ebu Yusuf ve İmam Züfer'e göre lian, doğrudan evliliği sona erdiren ve taraflar arasında sürekli bir evlenme engeli doğuran bir sebep kabul edilmektedir. Bunun için yargı kararı şartı aranmamaktadır. Bu kanaatte olanlar \"lian yoluyla ayrılanlar, ebediyyen birleşemezler\" hadisini esas almışlardır."},{"k":"p","x":"Buna karşılık İmam Ebu Hanife ve Muhammed ise karı-koca arasındaki evlilik bağının sona ermesi için, lian işlemini yeterli görmemekte, ayrıca liandan sonra yargı kararı şartını aramaktadırlar. Yani bu imamlara göre karı-kocanın lianından sonra, hakimin tefrik kararı gereklidir. Karı-koca karşılıklı itham ve lanetleşmeye (mülaane) devam ettikleri sürece aralarında bir evlenme engeli söz konusudur. Çünkü bunlar, yukarıda zikrettiğimiz hadis'in devamında \"mülaaneye devam ettikleri sürece ...\" şeklinde bir ilave olduğunu kabul etmektedirler."},{"k":"p","x":"Ancak lian sırasında veya lian işleminden sonra (ancak hakimin tefrik kararından önce) kocanın kendisini yalanlaması durumunda, kendisine kazf haddi uygulanmakla beraber aralarındaki evlenme engeli kalkar ve mevcut evlilik devam eder. Fakat liandan ve mahkeme kararından sonra, koca evliliğe devam etmek istediği takdirde, bu ancak yeni bir evlenme akdi ve mehir ile mümkün olabilmektedir."},{"k":"tbl","r":[["","Ebû Hanîfe ve İmam Muhammed","Şâfiî, Mâlikî, Hanbelî, Zâhirî, İmâmiyye; Ebû Yûsuf ve Züfer"],["**Lianın evlenme engeli**","Geçici (koca liandan dönünce kalkar)","Sürekli (ebedî)"],["**Yargı kararı**","Gerekir (hakimin tefrik kararı)","Aranmaz"],["**Dayanak**","Hadisin devamı: \"mülaaneye devam ettikleri sürece...\"","\"Lian yoluyla ayrılanlar, ebediyyen birleşemezler\" hadisi"]]}]},{"h":"Erkeğin halihazırda dört kadınla evli olması","b":[{"k":"p","x":"Aynı anda dört kadınla evli olan erkek, ancak eşlerinden birisinin ölmesi ya da birisini boşaması durumunda onun yerine yeni bir eş ile evlenebilmektedir. Bu yeni evlilik de, boşadığı kadının iddetini tamamlamasına bağlıdır. Yani boşanan kadın iddetini tamamlamadıkça koca beşinci kadın ile evlenememektedir."},{"k":"p","x":"Çünkü iddet bekleyen kadının evliliğinin (nikahının) bazı hukuki sonuçları hükmen devam ettiği için, boşanan dördüncü kadının iddeti içinde beşinci kadınla evlenmek de, hükmen beşinci kadınla evlenmek olarak kabul edilmektedir. Ancak İmam Şafii, ayırıcı (bain) talaktan sonra, karı-koca arasındaki evlilik bağının tamamen kesildiği ve evliliğin sona erdiği kanaatinde olduğu için bu tür evlilikleri caiz görmüştür."}]},{"h":"Kadının semavi bir dine mensup olmaması","b":[{"k":"p","x":"Semavi dinler, İslamiyet, Hıristiyanlık ve Yahudilik olmak üzere üçtür. Ebu Hanife'ye göre Sabiiler de ehl-i kitap olup Hıristiyanlığın bir koludur. Cumhur bu görüşün hilafınadır. Semavi olmayan dinler ise, Mecusilik, Putperestlik ve Sabiiliktir."},{"k":"p","x":"Müslüman erkek Müslüman bir kadınla veya da ehl-i kitaptan bir kadınla evlenebilir."},{"k":"ar","a":"الْيَوْمَ أُحِلَّ لَكُمُ الطَّيِّبَاتُ وَطَعَامُ الَّذِينَ أُوتُوا الْكِتَابَ حِلٌّ لَكُمْ وَطَعَامُكُمْ حِلٌّ لَهُمْ وَالْمُحْصَنَاتُ مِنَ الْمُؤْمِنَاتِ وَالْمُحْصَنَاتُ مِنَ الَّذِينَ أُوتُوا الْكِتَابَ مِنْ قَبْلِكُمْ","x":"Bu ayetteki muhsanat, iffetli demektir."},{"k":"p","x":"Müslüman erkek bunların dışındakilerle evlenemez:"},{"k":"ar","a":"وَلَا تَنْكِحُوا الْمُشْرِكَاتِ حَتَّى يُؤْمِنَّ وَلَأَمَةٌ مُؤْمِنَةٌ خَيْرٌ مِنْ مُشْرِكَةٍ وَلَوْ أَعْجَبَتْكُمْ","x":""},{"k":"p","x":"Müslüman kadına gelince, o, ister semavi ister semavi olmayan dine mensup olsun Müslüman olmayan bir erkekle evlenemez. Yani dışarıya kız verilmez."},{"k":"ar","a":"وَلَا تُنْكِحُوا الْمُشْرِكِينَ حَتَّى يُؤْمِنُوا وَلَعَبْدٌ مُؤْمِنٌ خَيْرٌ مِنْ مُشْرِكٍ وَلَوْ أَعْجَبَكُمْ أُولَئِكَ يَدْعُونَ إِلَى النَّارِ","x":""},{"k":"ar","a":"يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا جَاءَكُمُ الْمُؤْمِنَاتُ مُهَاجِرَاتٍ فَامْتَحِنُوهُنَّ اللَّهُ أَعْلَمُ بِإِيمَانِهِنَّ فَإِنْ عَلِمْتُمُوهُنَّ مُؤْمِنَاتٍ فَلَا تَرْجِعُوهُنَّ إِلَى الْكُفَّارِ لَا هُنَّ حِلٌّ لَهُمْ وَلَا هُمْ يَحِلُّونَ لَهُنَّ","x":""},{"k":"p","x":"Müslüman kadının bu evlilikleri yapamamasının gerekçesi olarak erkeğin otorite olması gösterilmektedir. Bu durumda erkek kadını etkileyecektir. Ancak Karadavi'ye göre bugün durum tam tersinedir. Bundan dolayı Müslüman erkek de gayr-i müslim olan bir kadınla evlenmemelidir."}]},{"h":"Erkeğin hür kadından sonra cariye ile evliliği meselesi","b":[{"k":"p","x":"İslam şeriati cariye ile evliliğe cevaz vermiştir: «وَمَنْ لَمْ يَسْتَطِعْ مِنْكُمْ طَوْلًا أَنْ يَنْكِحَ الْمُحْصَنَاتِ الْمُؤْمِنَاتِ فَمِنْ مَا مَلَكَتْ أَيْمَانُكُمْ مِنْ فَتَيَاتِكُمُ الْمُؤْمِنَاتِ» Bununla beraber meselenin tafsilatında ihtilaflar görülür."},{"k":"li","x":"**Ebu Hanife:** İbtidaen cariye ile evlenmek caizdir. Bu cariyenin kitabi veya müslim olması arasında da fark yoktur. Ancak hür bir kadından sonra evlenmesi haramdır. Allah Resulü (sav) şöyle buyurmuştur: \"Hür kadının üzerine cariye kuma getirilmez.\""},{"k":"li","x":"**İmam Şafii:** Müslim olan cariye ile evlenmek caizdir dedikten sonra iki şart koşar. Birincisi kendisini zinadan koruması ikincisi hür bir kadınla evlenmeye mali kudretinin olmamasıdır."},{"k":"li","x":"**Malikiler:** Erkek, hür kadının mehrine kudreti yoksa ve zinadan da korkuyorsa, bu iki şart ile müslim veya kitabi olan cariye ile evlenmeyi caiz görür. Hür kadınla evli olan erkeğin karısı çocuk doğuramıyor olup erkek doktora gitse ve kadının kısır olduğunu öğrense bu durumda cariye ile evlenebilir."}]},{"h":"Şema: geçici evlilik engelleri","b":[{"k":"kart","t":"Geçici haramlık sebepleri","a":"أسباب المحرمة المؤقتة","g":[{"h":"Sebepler","a":"","m":["«الجمع بين محرمين» İki mahremi bir nikahta toplamak — Kenar notu: iki mahremi bir nikâhta.","«تعلق حق الغير بمن يراد العقد عليها» Evlenilmek istenen kadına başkasının hakkının taalluk etmesi — Kenar notu: başkasının varlığı (evli olması).","«زواج الرجل بمن طلقها طلقة ثالثة» Üçüncü talakla boşadığı kadınla evlenmesi","«زواج الرجل بالخامسة» Beşinci kadınla evlenmesi","«زواج الرجل بامرأة لا تدين بدين سماوي» Semavi bir dine mensup olmayan kadınla evlenmesi — Kenar notu: ateist, Mecusi.","«الزواج بالأمة على الحرة» Hür kadın üzerine cariye ile evlenmek — Kenar notu: hür kadın varken cariyeyi kuma getirmek.","«زواج المُحرم عند الشافعي» Şâfiî'ye göre ihramlının evlenmesi — Kenar notu: Hanefilere göre evlenebilir ama ilişkiye giremez."]},{"h":"Kaide","a":"ملاحظة / القاعدة","m":["«لو فُرِضَتْ إحداهما رجلا لحَرُمَتِ الأخرى عليه» İki kadından biri erkek farz edilse diğeri ona haram olurdu (o hâlde ikisi bir nikahta toplanamaz)."]}]}]},{"h":"Ehl-i Kitab'la evlilik hakkında görüşler","b":[{"k":"p","x":"Evlilik şu dört suretten biri ile olur:"},{"k":"n","n":1,"x":"Kocanın ve kadının Müslüman olması."},{"k":"n","n":2,"x":"Kocanın Müslüman kadının gayr-i müslim olması."},{"k":"n","n":3,"x":"Kocanın ve kadının gayr-i müslim olması."},{"k":"n","n":4,"x":"Kadının Müslüman ve kocanın gayr-i müslim olması. Ulemanın icma'ıyla bu batıldır."},{"k":"p","x":"Ulema Müslüman erkeğin kitabi harbi bir kadınla çocuğunun korkusundan dolayı evlenmesini kerih görürler. Eğer kitabi kadının Müslüman olması ümit ediliyorsa bu mendubtur."},{"k":"p","x":"Müslüman erkek kitabi bir kadınla evlense ve kadın büyük, âkil ise akid sahih olur. Yok küçük veya da büyük olup mecnun ve ma'tuh ise akid sadece kadının dini üzere olan bir vekil ile sahih olur."},{"k":"p","x":"Şahitlik, veraset ve din konusundaki tüm meseleler dört ana başlıkta toplanmıştır:"},{"k":"n","n":1,"x":"Karı - koca müslümansa şahitleri de Müslüman olmalıdır. Eğer kadın kitabi ise bu şart değildir."},{"k":"n","n":2,"x":"Karı - koca müslüman olup evlilik devam ederken birisi ölse birbirlerine varis olurlar. Eğer kadın kitabi ise birbirlerine varis olamazlar. Erkeğin kitabi kadına vasiyette bulunması irsin engellerinden değildir. Aksi mümkün değildir."},{"k":"n","n":3,"x":"Çocuklar din konusunda babalarına muvafakat ederler. Onlar babaları gibi Müslümandırlar. Onlardan birisinin malı olsa da ölse varisi babasıdır. Annesi mirasçı olamaz. Aynı şekilde kitabi olan anneye de çocuklar mirasçı olamaz."},{"k":"n","n":4,"x":"Müslüman bir erkek ile evli olan kitabi kadın dininden çıkıp başka bir semavi dine girse bu durumda evlilikleri fesholmaz. Yok eğer gitse de müşrik olsa akid fesholunur."},{"k":"kart","t":"Ehl-i kitapla evlilik","a":"زواج الكتابيات","g":[{"h":"Evliliğin dört sureti","a":"","m":["«أن يكون الزوج مسلما والزوجة مسلمة» Koca Müslüman, kadın Müslüman","«أن يكون الزوج مسلما والزوجة غير مسلمة» Koca Müslüman, kadın gayrimüslim","«أن يكون الزوج غير مسلم والزوجة غير مسلمة» Koca gayrimüslim, kadın gayrimüslim","«أن يكون الزوج غير مسلم والزوجة مسلمة» Koca gayrimüslim, kadın Müslüman — Kenar notu: caiz değil."]},{"h":"Müslüman erkeğin kitabî kadınla evliliğinde farklar","a":"إلا في الأمور الآتية","m":["«جميع الأحكام والحقوق والواجبات المترتبة على عقد زواج المسلم بالمسلمة تترتب بنفسها على عقد زواج المسلم بالكتابية إلا في الأمور الآتية» Müslüman erkeğin Müslüman kadınla evliliğine bağlanan bütün hüküm, hak ve vecibeler kitabî kadınla evliliğine de aynen bağlanır; şu hususlar hariç:","«يجوز أن يكون شهود هذا العقد من المسلمين أو من أهل الكتاب خلافا للشافعية» Bu akdin şahitleri Müslümanlardan da Ehl-i kitaptan da olabilir; Şâfiîler buna muhaliftir. — Kenar notu: Şâfiî: Müslüman olmalı.","«إذا مات أحدهما لا يرثه الآخر» Biri ölürse diğeri ona mirasçı olmaz.","«الأولاد يوافقون أباهم في دينه» Çocuklar dinde babalarına tabidir.","«إذا خرجت المرأة الكتابية المتزوجة بمسلم من دينها إلى دين سماوي آخر لم ينفسخ زواجها» Müslümanla evli kitabî kadın başka bir semavi dine geçerse nikahı bozulmaz. — Kenar notu: karı Hristiyan iken Yahudiliğe geçse boşanmaz."]}]}]},{"h":"Gayr-i müslimlerin birbiri ile evlenmesi","b":[{"k":"p","x":"Burada gayr-i müslim ile müşrik birdir. Buradaki maksat bunların medeni hukuku ile ilgili verilecek kararların ne olduğu hususudur. İslam şeriati kendi himayesinde yaşayan gayr-i müslimlerin muamelatı ve özel durumları hakkında onlara müdahele etmemiştir. Yalnız şu üç durumda İslam hukukuna göre yargılanırlar:"},{"k":"n","n":1,"x":"Müslümanlardan birinin hakkına tecavüz varsa buna Müslüman mahkeme karar verir. Örneğin boşadığı kitabi kadın iddeti bitmeden (kitabilerde mümkündür) başka biri ile evlense Müslüman koca mahkemeye başvurabilir."},{"k":"n","n":2,"x":"Ehl-i kitap evliler İslam mahkemesine İslam şeriatinin hükümlerine göre evliliklerinin durumunu öğrenmek için istekte bulunsalar, Müslüman hakim bu evlilik akdini inceler, İslam'a uygun ise onaylar. Eğer İslam'a değil de kitabilerin kendi şeriatlerine uygun ise yine onaylar. İster kendi dinlerine uysun isterse uymasın kadın mahremi ile evliyse Müslüman hakim müdahele eder. Yine Müslüman erkeğin boşadığı kitabi kadın iddet günlerinde gidip evlense erkeğin hukuku çiğnendiği için hakim buna da müdahale edecektir. Akidler batıl olur."},{"k":"n","n":3,"x":"Karı-kocanın her ikisi veya da birisi Müslüman olsa burada üç suret vardır (aşağıda)."},{"k":"p","x":"Hakime başvuru yapması gereken kişilere gelince, Ebu Hanife'ye göre her ikisidir, İmam Muhammed'e göre ise karı-kocadan birisinin başvurması kafidir."},{"k":"h","x":"Karı-kocanın her ikisi veya birisi Müslüman olursa"},{"k":"li","x":"**Her ikisi de Müslüman oldu:** Bu durumda akitte İslam'a aykırı bir durum yoksa evlilikleri devam eder. Mahremle evlilik veya iddet içerisinde evlilik gibi durumlarda ayrılırlar."},{"k":"not","x":"Eğer şartlar tamamsa yeni bir nikaha gerek yoktur. Ama gönül hoşnutluğu için bir nikah yapılabilir (dersten)."},{"k":"li","x":"**Yalnızca koca Müslüman oldu:** Bu durumda kadının durumuna bakılır, eğer kitabi ise evlilik devam eder, değilse öncelikle İslam tebliğ edilir veya semavi bir dine bağlanması teklif edilir. Eğer bunları yaparsa o hali üzerine bırakılır ve ayrılmazlar. Yok aksine müşrikliğe devam ederse ayrılırlar."},{"k":"not","x":"Kaide: \"İbtidaen caiz olmayan bekaen de caiz değildir\". Tabi istisnaları çoktur (dersten)."},{"k":"li","x":"**Yalnızca kadın Müslüman oldu:** Koca baliğ, âkil, mümeyyiz ise kendisine İslam tebliğ edilir kabul ederse devam etmezse ayrılırlar. Eğer koca mecnun ise ebeveynine İslam tebliğ edilir. Kabul ederlerse evlilik devam etmezlerse ayrılırlar. Eğer koca gayr-i mümeyyiz ise temyiz yaşı beklenir, İslam tebliğ edilir kabul ederse devam etmezse ayrılırlar."},{"k":"not","x":"Adamın kitabi olması ile olmaması arasında fark yoktur. Çocukta temyiz yaşı belli olduğu için beklenir ama mecnunda aklı başına gelme zamanı belli olmadığı için beklenmez."},{"k":"tbl","r":[["Müslüman olan","Sonuç"],["**İkisi birden**","Akitte İslam'a aykırılık yoksa evlilik devam eder; mahremle ya da iddette evlilikte ayrılırlar."],["**Yalnız koca**","Kadın kitabî ise devam; değilse İslam ya da semavi bir din teklif edilir; kabul etmezse ayrılırlar."],["**Yalnız kadın**","Kocaya İslam tebliğ edilir (mecnunsa ebeveynine; gayr-i mümeyyizse temyiz yaşı beklenir); kabul etmezse ayrılırlar."]]}]}],"ht":[{"s":0,"x":"İki kız kardeşi (ya da kadınla halasını/teyzesini) bir nikahta toplamak haramdır; geçicidir: nikahlının ölümü ya da boşanıp iddetinin bitmesiyle kalkar. Süt kardeşlik de neseb gibidir."},{"s":0,"x":"Genel kural: iki kadından biri erkek farz edildiğinde aralarında evlenme engeli varsa ikisi bir nikahta toplanamaz (hala-yeğen olmaz, iki amca kızı olur)."},{"s":0,"x":"Tek akitte iki kız kardeş: ayrılırlar; duhulden sonra her birine mehr-i müsemma ile misilden azı. Ayrı akitlerde ikinci nikah sahih olmaz. Hangisinin önce olduğu bilinmezse ikisi de ayrılır; duhulden önceyse mehirler eşitse yarım mehir, farklıysa her birine kendi mehrinin dörtte biri; duhulden sonraysa tam mehir."},{"s":1,"x":"Hakku'l-ğayr: kadın evliyken ya da iddet beklerken evlenemez (iddet \"hükmî evlilik\"tir)."},{"s":1,"x":"Zina yapan kadın: Ebû Hanîfe, Muhammed ve Şâfiî'ye göre evlenebilir (başkası zifaf için doğumu bekler); Mâlik ve Hanbel'e göre başkası için iddet gerekir; Ebû Yûsuf ve Züfer'e göre hamileyse doğumdan önce başkasıyla evlenemez."},{"s":2,"x":"Üç talakla boşanan kadına dönmenin beş şartı: iddet → başka erkekle sahih nikah → duhul (zifaftan önce koca ölürse engel sürer) → boşama ya da ölüm → yeniden iddet."},{"s":2,"x":"Lian: Ebû Hanîfe ve Muhammed'e göre geçici engel, hakimin tefrik kararı gerekir; diğer mezhepler ile Ebû Yûsuf ve Züfer'e göre ebedî engel, yargı kararı aranmaz."},{"s":3,"x":"Dört eşli erkek, birinin ölümü ya da boşanmasıyla, boşananın iddeti bitince evlenebilir; Şâfiî bain talaktan sonra iddet içinde de caiz görür."},{"s":4,"x":"Semavi dinler: İslam, Hristiyanlık, Yahudilik; Ebû Hanîfe'ye göre Sâbiîler de Ehl-i kitaptır (cumhur aksi görüşte). Semavi olmayanlar: Mecusilik, putperestlik, Sâbiîlik."},{"s":4,"x":"Müslüman erkek Müslüman ya da kitabî kadınla evlenebilir, müşrik kadınla evlenemez; Müslüman kadın hiçbir gayrimüslim erkekle evlenemez (gerekçe: erkeğin otoritesi). Karadâvî'ye göre bugün durum tersine döndüğü için erkek de gayrimüslimle evlenmemeli."},{"s":5,"x":"Cariye ile evlilik: Ebû Hanîfe — ibtidaen caiz (kitabî ya da Müslim), hür kadın üzerine haram; Şâfiî — Müslim cariye, iki şartla (zinadan korunma ihtiyacı, hür kadına mali kudret olmaması); Mâlikîler — iki şartla Müslim ya da kitabî cariye, kadın kısırsa da caiz."},{"s":6,"x":"Şemadaki geçici sebepler ayrıca: hür kadın üzerine cariye ile evlenmek ve (Şâfiî'ye göre) ihramlının evlenmesi."},{"s":7,"x":"Ehl-i kitapla evlilikte dört suret; Müslüman kadının gayrimüslim erkekle evliliği icmayla batıldır. Harbî kitabî kadınla evlilik mekruh; Müslüman olması umuluyorsa mendub."},{"s":7,"x":"Müslüman–kitabî evliliğinde farklar: şahitlerin Müslüman olması şart değil (Şâfiîlere göre şart), birbirlerine mirasçı olmazlar (vasiyet engel değil), çocuklar dinde babaya tabidir, kadın başka semavi dine geçerse nikah bozulmaz, müşrik olursa bozulur."},{"s":8,"x":"Gayrimüslimlerin evliliğine üç durumda müdahale edilir: Müslümanın hakkına tecavüz, kendileri İslam mahkemesine başvurursa (Ebû Hanîfe'ye göre ikisi, Muhammed'e göre biri), eşlerden biri ya da ikisi Müslüman olursa."},{"s":8,"x":"İkisi Müslüman olursa evlilik devam eder; yalnız koca Müslüman olursa kadın kitabî ise devam; yalnız kadın Müslüman olursa kocaya İslam tebliğ edilir, kabul etmezse ayrılırlar."}]},{"t":"Evlilikte Velayet","intro":"Nikahta velayetin tanımı ve nev'ileri; velayet-i icbar ve velayet-i nedb; bulûğ muhayyerliği; velide aranan şartlar; velayetin sabit olduğu yollar, velilerin tertibi ve velinin azli (adl).","s":[{"h":"Nikahta velayet","b":[{"k":"d","t":"Nikahta velayet","x":"Bir kişinin evlenmesi konusunda diğer birinin sahip olduğu yetki demektir."},{"k":"p","x":"Velayetin acziyet ve ehliyetin noksanlığı olmak üzere iki sebebi vardır. Velayetin üç nev'isi vardır:"},{"k":"li","x":"Velayet-i ale'n-nefs"},{"k":"li","x":"Velayet-i ale'l-mâl"},{"k":"li","x":"Velayet-i ale'n-nefs ve'l-mâl"},{"k":"p","x":"Velayet-i ale'n-nefs de velayet-i nedb ve velayet-i icbâr olmak üzere iki kısımdır. Burada nikahla ilintili olduğu için velayet-i ale'n-nefsi inceleyeceğiz."},{"k":"kart","t":"Velayetin nevileri","a":"أنواع الولاية","g":[{"h":"Tanım","a":"الولاية","m":["«هي حق تنفيذ القول على الغير رضي أو لم يرض» Velayet: Bir kimsenin söz ve tasarruflarının başkası namına geçerli olmasına denir."]},{"h":"Mal üzerinde velayet","a":"ولاية على المال","m":["«فهي للأب والجد ووصيهما أو وصي القاضي» Baba, dede, bunların vasisi ya da hâkimin tayin ettiği vasiye aittir."]},{"h":"Nefis üzerinde velayet","a":"ولاية على النفس","m":["«ولاية ندب (استحباب)» Velayet-i nedb (istihbab)","«ولاية الإجبار» Velayet-i icbar"]},{"h":"İkisi üzerinde birden","a":"ولاية عليهما جميعا","m":["«فهي للأب وحده فقط» Yalnızca babaya aittir."]}]}]},{"h":"Velayet-i icbarın sebepleri","b":[{"k":"d","t":"Velayet-i icbar","x":"Velayeti altında bulunan bir şahsı, onun rızasına bakmaksızın evlendirebilme yetkisine sahip olma."},{"k":"p","x":"Çocuklar, deliler, bunaklar bu tür bir velayet altındadırlar. Bu velayet türü üç sebepten biri ile sabit olur:"},{"k":"n","n":1,"x":"**Küçüklük (Sığar):** Küçük ister bekar isterse dul olsun eşittir."},{"k":"n","n":2,"x":"**Delilik (Cünûn):** Delilik aslen de târien (arızi) de olabilir."},{"k":"n","n":3,"x":"**Bunaklık (Ateh):** Aslen ve târien olabilir."},{"k":"not","x":"Asli mecnun buluğ çağına deli olarak ulaşmış kimsedir. Arızi mecnun ise buluğ çağına kadar akıllı olup daha sonra delilik isabet etmiş kişidir."},{"k":"p","x":"İmam Şafii iki konuda muhalefet etmiştir. Küçük dul için velayet-i icbarın sabit olmaması ile büyük bekar kız için velayet-i icbarın sabit olmasını savunur."}]},{"h":"Velayet-i icbara sahip olan kişiler","b":[{"k":"p","x":"Kişiler hakkında mezheplerin görüşleri farklıdır:"},{"k":"li","x":"**Malikiler:** Küçüğün velisi sadece babadır. Ancak buluğa erdiğinde evlilik için veli olacak kimseye izin verebilir."},{"k":"li","x":"**Şafiiler:** Küçüğün velisi baba ve dededir. Bu ikisinin dışındakiler velayet sahibi olmaz. Bu ikisi yoksa buluğa kadar bekler."},{"k":"li","x":"**Ahmed b. Hanbel:** İki rivayet vardır. Birisinde Malikiler gibi diğerinde Şafiiler gibi düşünür."},{"k":"li","x":"**Hanefiler:** En sahih görüş budur. Önce babadır, o yoksa dededir, o da yoksa velayete en yakın kim ise velayete o geçer. Babanın velayetine dair delil Hz. Aişe'nin evliliğidir. Dede ise hüküm bakımından baba gibidir. Bu ikisi dışındakilerin velayetine dair delil ise Hz. Peygamber'in amcasının kızı Ümame'yi, Seleme ile evlendirmesidir. Sevgili Peygamberimiz şöyle buyurmuştur: \"Nikâh, asabeden olan veliye aittir.\""},{"k":"not","x":"Kısaca Hanefiler küçük kızın evlendirilmesinde asabe sırasını esas alır."},{"k":"tbl","r":[["Mezhep","Küçüğün icbar velisi"],["**Mâlikîler**","Yalnız baba"],["**Şâfiîler**","Baba ve dede; bunlar yoksa bulûğa kadar beklenir"],["**Ahmed b. Hanbel**","İki rivayet: Mâlikîler gibi ve Şâfiîler gibi"],["**Hanefiler**","Önce baba, sonra dede, sonra (asabe sırasıyla) en yakın veli"]]},{"k":"h","x":"Bulûğdan sonra muhayyerlik"},{"k":"p","x":"İmam-ı Azam ve İmam Muhammed'e göre küçüğü baba veya dede evlendirmişse bunlar ileri görüşlü ve şefkatli olduklarından dolayı buluğdan sonra küçük için muhayyerlik hakkı yoktur. Eğer bu ikisi dışında bir veli evlendirmişse küçük buluğa erdikten sonra dilerse evliliği devam ettirir dilerse fesheder. Ebu Yusuf'a göre ise kim evlendirirse evlendirsin küçüğün buluğa erdikten sonra muhayyerlik hakkı yoktur. Müftabih olan tarafeynin görüşüdür. Zira Hz. Peygamber amcasının kızı Ümame'yi evlendirdiği zaman \"Buluğa erdiği zaman ona muhayyerlik hakkı vardır\" buyurmuşlardır. Çünkü baba ve dede dışındaki velilerin yakınlığı nakıstır."},{"k":"p","x":"Büyük mecnun ve büyük matuhun oğullarına gelince bunların velayeti evladır. Oğullar baba ve dededen öncelikli hakka sahiptirler. Diyelim ki oğulları mecnun ve matuhu evlendirdi ve sonra da bunlar ayıldı, bunlar artık fesih hakkına sahip değillerdir."},{"k":"not","x":"Mecnun ve matuhun oğullarının velayeti de aynı bunlar gibidir. Mecnun ve matuhun durumu asli ise bulûğ ile velayet kaybolmaz. Yok eğer arızi ise velayetin sabit olması için cünun ve ateh durumunun tam bir ay sürmesi gerekir. Mecnun ve atehin aklı başına geldiğinde fesih hakkını kullanırlarsa iki şahit bulundurmaları gerekir. Bundan sonra hakime başvurulması gerekir. Mahkemenin sonunda ancak hakimin fesih kararı ile evlilik fesholunur."},{"k":"p","x":"Denklik olsun veya olmasın, mehir misil veya daha az olsun baba ve dedenin evlendirdiği küçüğün buluğdan sonra muhayyerlik hakkı yoktur. Yalnız şöyle bir incelik de vardır:"},{"k":"li","x":"**Su-i ihtiyar (zararlı tercihi / düşük profili) bilinmiyorsa:** Velayetten önce zannediliyor ki baba ve dede muhtar insanlar. Bu durumda yapılan akid geçerlidir."},{"k":"li","x":"**Su-i ihtiyar biliniyorsa:** Bu durumda kocanın kefaeti ve mehrin misil olup olmaması durumlarına bakılır. Eğer bunlarda fahiş bir aldatma varsa yapılan akid geçersizdir."},{"k":"tbl","r":[["Görüş sahibi","Baba/dede evlendirdiyse","Başka veli evlendirdiyse"],["**İmam-ı Âzam ve İmam Muhammed (müftâbih)**","Bulûğdan sonra muhayyerlik yok","Bulûğdan sonra muhayyerlik var"],["**Ebû Yûsuf**","Muhayyerlik yok","Muhayyerlik yok"]]}]},{"h":"Şema: velayet-i icbar","b":[{"k":"kart","t":"Velayet-i icbar","a":"ولاية الإجبار","g":[{"h":"Sebepleri","a":"أسبابها","m":["«١- الصغر (بكرا كانت أو ثيبا) عند الأحناف، والبكارة عند الشافعية» Küçüklük (bakire de olsa dul da) Hanefilere göre; bekâret Şâfiîlere göre","«٢- الجنون» Delilik","«٣- العته» Bunaklık — «أصليين كانا أم طارئين» aslî de olsalar arızî de"]},{"h":"Kimin icbar velayeti var?","a":"من له ولاية الإجبار","m":["**Mâlik:** «تثبت على الصغيرة للأب وحده» Küçük kız üzerinde yalnız babaya ait — Kenar notu: sadece baba.","**Şâfiî:** «تثبت على الصغيرة لكل من الأب والجد» Küçük kız üzerinde baba ve dedeye ait — Kenar notu: bakireyi baba zorla evlendirebilir; dul olanı rızası olmadan evlendiremez.","**Ahmed b. Hanbel:** «روايتان: أحدهما كمالك والآخر كالشافعي» İki rivayet: biri Mâlik gibi, diğeri Şâfiî gibi","**Hanefiler:** «تثبت للأب والجد عند فقد الأب ولكل ولي عند فقد من هو أولى منه، وتثبت لابني المعتوهة والمجنونة قبل الأب والجد» Babaya, baba yoksa dedeye, daha evlâ olan yoksa her veliye; bunak ve deli kadının oğullarına baba ve dededen önce — Kenar notu: küçük kızı baba ve dede evlendirebilir."]}]}]},{"h":"Buluğdan sonra küçük kız veya erkeğin evliliğinin feshi","b":[{"k":"p","x":"Baba ve dedenin dışındaki velinin evlendirdiği küçüklerin nikahı sahih, lazım olup ğayr-i nafizdir. Bunun manası buluğdan sonra hıyar-ı buluğa sahip olmalarıdır. Dilerse bu evliliği kabul ederler dilerse kabul etmezler. Ebu Yusuf'un her halükarda muhayyerliğin bulunmadığına dair görüşünü de biraz evvel okumuştuk."},{"k":"sc","q":"Fesih talebinin vakti ne zamandır?","x":"Baba ve dede dışındaki velilerin evlendirdiği küçükler eğer buluğdan evvel evlendiklerini biliyorlarsa fesih vakti buluğa erme vaktidir. Yok bilmiyorlarsa ve daha sonra öğrenmişler ise fesih vakti öğrendikleri vakittir."},{"k":"p","x":"Ebu Hanife ile İmam Muhammed, buluğdan evvel nikahı bilen küçüklerin \"razı oldum\" gibi sözlü bir beyanları ile veya \"öpmek, giydirmek, harcama yapmak\" gibi fiili bir eylemleri ile evlilik akdinin sahih feshin ise sakıt olduğu görüşündedirler."},{"k":"sc","q":"Sukûta itibar edilir mi?","x":"Buluğdan sonra veya evliliği bildikten sonra susmak erkek için itibara alınmaz. Bunun duhulden önce olması ile sonra olması arasında da fark yoktur. Kıza gelince, buluğdan sonra fesih için bakire olanın sükut etmesi beyandır. Ancak dul olanın sükutu itibara alınmaz. Dul bu konuda erkek gibidir."},{"k":"p","x":"**Buluğ muhayyerliği hakkındaki cehalet:** Buluğdan sonra feshin yapılabileceğine dair bilgisizlik özür değildir. Aynı şekilde muhayyerlik hakkının kullanılma hakkının bilinmemesi de özür değildir. Esasen her insana gerekli olan şey gerek ibadet gerekse muamelat noktasında ihtiyacı olan hükümleri bilmesidir."}]},{"h":"Velayet-i nedb / istihbab ve ne zaman sabit olur","b":[{"k":"d","t":"Velayet-i nedb","x":"Ergen ve akıl hastası olmayan bir kadının sırf hicabdan dolayı ve kendisini hayasızlığa nispet olunmaktan koruma için evlendirme işini velisine bırakma hali."},{"k":"p","x":"Tanımdan da anlaşılacağı üzere bu velayet âkil, hür ve büyük kadın için sabit olur. Bu görüş Ebu Hanife, Züfer ve bir rivayette Ebu Yusuf'un görüşüdür. Büyük olan kadının bakire olması ile dul olması arasında da fark yoktur."},{"k":"h","x":"Kadın kendi başına evlenebilir mi?"},{"k":"p","x":"Ebu Hanife, Züfer ve bir rivayette Ebu Yusuf'a göre kadının kendi ihtiyarı ile evlenebilmesi için kefaet ve mehr-i misil gerekir. Bu şartlarla kendisi evlenebilen kadının veli tayin etmesi müstehap olmakla beraber bu evliliğe velilerin itirazı da geçerli değildir. Bakirenin veliye verdiği izin sükut ile seyyibenin izni irade beyanı veya fiille sabit olur."},{"k":"p","x":"İmam Şafii, Ahmed b. Hanbel ve bir rivayette de Ebu Yusuf cevaz vermezler. Kadının âkil, hür ve büyük olmasının bir önemi yoktur, veli gereklidir."},{"k":"p","x":"İmam Malik ise kadının şeref, güzellik gibi her erkeğin beğendiği özelliklere sahip olup olmamasına göre hüküm verir. Sahipse veli şarttır, değilse kendi rızası ile bir yabancı onu evlendirebilir."},{"k":"p","x":"İmam Muhammed ise kadın kefaet ve mehr-i misil şartları ile evlense de akid mevkuftur."},{"k":"d","t":"Mevkuf","x":"Bir hüküm ifade etmesi başka birinin izin ve icazetine muhtaç olan bir fiil veya akittir."},{"k":"tbl","r":[["Görüş sahibi","Âkil, hür, büyük kadın kendi başına evlenebilir mi?"],["**Ebû Hanîfe, Züfer, bir rivayette Ebû Yûsuf**","Evet, kefâet ve mehr-i misil şartıyla; veli tayini müstehap, velinin itirazı geçersiz"],["**İmam Şâfiî, Ahmed b. Hanbel, bir rivayette Ebû Yûsuf**","Hayır, veli gereklidir"],["**İmam Mâlik**","Şeref ve güzellik sahibiyse veli şart; değilse rızasıyla bir yabancı evlendirebilir"],["**İmam Muhammed**","Kefâet ve mehr-i misille evlense de akit mevkuftur"]]},{"k":"kart","t":"Velayet-i nedb (istihbab)","a":"ولاية ندب (استحباب)","g":[{"h":"Ebû Hanîfe, Züfer, bir rivayette Ebû Yûsuf","a":"عند أبي حنيفة وزفر وفي رواية عن أبي يوسف","m":["«تثبت على المرأة الحرة الكبيرة العاقلة بكرا كانت أم ثيبا» Hür, büyük, akıllı kadın üzerinde sabit olur; bakire de olsa dul da. — Kenar notu: her akıllı, büyük kadın (bakire de dul da): veli şart değil, müstehaptır."]},{"h":"Şâfiî, Ahmed, diğer rivayette Ebû Yûsuf","a":"وذهب الشافعي وأحمد وفي رواية أخرى عن أبي يوسف","m":["«إلى أنه لا يجوز زواجها إلا بولي ذكر» Erkek veli olmadan evliliği caiz değildir. — Kenar notu: dul bile olsa velidedir."]},{"h":"Mâlik","a":"وذهب مالك","m":["«إلى أنها إن كانت ذات شرف وجمال لم يصح زواجها إلا بولي ذكر، وإن لم يكن كذلك جاز أن تتولى عقد زواجها أجنبي برضاها» Şeref ve güzellik sahibiyse erkek veli olmadan evliliği sahih olmaz; değilse rızasıyla bir yabancı onu evlendirebilir. — Kenar notu: güzelse, soyluysa erkek veli evlendirmelidir."]},{"h":"Muhammed","a":"وقال محمد","m":["«لو تولت عقد زواجها بنفسها انعقدت موقوفا مطلقا، سواء كان زوجها كفئا أم لم يكن، وسواء أكان مهرها مهر المثل أم لم يكن» Kendi nikahını kendisi kıyarsa, koca denk olsun olmasın, mehir misil olsun olmasın, akit mutlak olarak mevkuf kurulur. — Kenar notu: velinin onayına bağlı; onaylarsa sahihtir."]}]}]},{"h":"Velide aranan şartlar","b":[{"k":"p","x":"Dört şart vardır:"},{"k":"n","n":1,"x":"**Hürriyet:** Hangi tür olursa olsun kölenin velayeti caiz değildir."},{"k":"n","n":2,"x":"**Buluğ:** Mümeyyiz olsun olmasın sabinin velayeti caiz değildir."},{"k":"n","n":3,"x":"**Akıl:** Mecnun ve ma'tuhun velayeti caiz değildir."},{"k":"n","n":4,"x":"**Dinde muvafakat:** Müslümana gayr-i müslim veya zımminin velayeti caiz değildir. Diyelim ki bir kadının iki kardeşi var ve birisi Müslüman diğeri ise yahudi veya Hıristiyandır. Elbette bu kadına veli olacak Müslüman olan kardeşidir. Aksi de aynıdır."},{"k":"dikkat","x":"Bu şartların tamamının bulunması gerekir. Salah (Doğruluk) ve adalet velide aranan şartlardan değildir. Bilakis fasığın velayeti caizdir."},{"k":"kart","t":"Velinin şartları","a":"شروط الولي","g":[{"h":"Dört şart","a":"","m":["«أن يكون حرا» Hür olması","«أن يكون بالغا» Baliğ olması","«أن يكون عاقلا» Akıllı olması","«أن يكون موافقا بمولى عليه في الدين» Velayeti altındakiyle aynı dinde olması — Kenar notu: din birliği."]}]}]},{"h":"Velayet ne ile sabit olur?","b":[{"k":"p","x":"Dört durumdan birisi ile velayet sabit olur."},{"k":"n","n":1,"x":"**Milk:** Efendi, kölesini evlendirmeye maliktir. Kölenin küçük, büyük; aklı tam, nakıs ya da akılsız olması arasında da fark yoktur, köle köledir. Şu kadar var ki köle âkil ve büyük olup -erkek veya kadın olabilir- kendisini evlendirse bu akid efendinin icazetine bağlı olarak mevkuf olur. Mümeyyiz olmayan küçük ile mecnun ve ma'tuh olan büyük kölenin kendisini evlendirmesi sahih değildir."},{"k":"n","n":2,"x":"**Karabet:** Asabe ve onun dışındakileri kapsar. Yeri gelince anlatılacaktır."},{"k":"n","n":3,"x":"**Velâ:** Bununla kastedilen \"velâ-i muvâlât\"tır."},{"k":"n","n":4,"x":"**İmamet:** Bununla kastedilen sultanın veya vekilinin velayetidir. Milkiyet hariç bu üç durumu anlatacağız:"},{"k":"d","t":"Velâ-i muvâlât","x":"Nesebi meçhul olan bir şahsın şartları dahilinde başka bir şahıs ile akdetmiş olduğu bir veladan, bir dayanışma ilişkisinden ibarettir. Bu vela'da nesebi meçhul kişiye \"mevla-i esfel\", bunu kabul eden kimseye de \"mevla-i â'la\" denir."}]},{"h":"Karabet yolu ile velayet","b":[{"k":"p","x":"Ebu Hanife'ye göre karabet iki nev'idir: Asabe ve asabenin dışındaki usulü ve furu'u. İmameyn, asabenin dışında karabet yolu ile velayeti kabul etmez. İmameyn bu konuda Hz. Ali kanalıyla merfu' olarak zikredilen «الْإِنْكَاحُ إِلَى الْعَصَبَاتِ» hadisi ile istidlal ederlerken Ebu Hanife «وَأُولُو الْأَرْحَامِ بَعْضُهُمْ أَوْلَى بِبَعْضٍ فِي كِتَابِ اللَّهِ» ayetini delil olarak kullanır."},{"k":"not","x":"Ayetin meali: \"Allah'ın kitabınca, kan akrabaları birbirlerine (varis olmaya) daha layıktırlar.\""},{"k":"p","x":"Bir başka delili de Abdullah b. Mes'ud'ın kızını evlendirmesi için eşine yani kızın annesine icazet vermesidir. Malumdur ki anne, zevi'l-erham'dandır. Ve yine malumdur ki Abdullah b. Mes'ud gibi bir sahabi kendi aklıyla hareket ederek fetva vermez illa ki bunu Hz. Peygamber (sav)'den işitmiştir."},{"k":"d","t":"Zevi'l-erham","x":"Rahim veya neseb bağıyla birbirine bağlı akrabalar."},{"k":"h","x":"Asabe"},{"k":"d","t":"Asabe","x":"Lügatte \"baba tarafından olan yakına\" verilen isimdir. Böyle bir yakınlığa \"usûbe\" denir. Ashab-ı feraiz ile beraber bulundukları zaman onların sehimlerinden arta kalan kısmı alan ve ashab-ı feraizle bulunmadığı halde ise terikenin tamamını alan yakındır."},{"k":"p","x":"Asabe iki nev'idir:"},{"k":"n","n":1,"x":"**Asabe-i nesebiyye:** Ölüye neseb yoluyla yakınlığı olan kimselerdir. Bunlar dört cihettir: a) **Bünüvvet:** Oğul, oğulun oğlu ve aşağı doğru. b) **Ubüvvet:** Baba, dede ve yukarı doğru. c) **Uhuvvet:** Öz erkek kardeş, baba bir erkek kardeş, öz erkek kardeşin oğlu, baba bir erkek kardeşin oğlu vb. d) **Umûmet:** Öz amca, öz amca oğlu, baba bir amca vb."},{"k":"n","n":2,"x":"**Asabe-i sebebiyye:** Itk (azad) ve akit sebebiyle yakınlığı olan kimselerdir."},{"k":"steps","x":["**Bünüvvet:** oğul, oğlun oğlu ve aşağı doğru","**Ubüvvet:** baba, dede ve yukarı doğru","**Uhuvvet:** öz ve baba bir erkek kardeş ve oğulları","**Umûmet:** öz amca, öz amca oğlu, baba bir amca"]},{"k":"p","x":"Birden fazla asabe bulunursa alimler cihet, derece ve kuvvet (akrabalık noktasından) durumlarının dikkate alınacağında müttefiktir. İşin özeti şudur: kadının bir velisi varsa amenna ve saddakna; ancak veli iki veya daha fazla olursa cihet bakımından hangisi yakınsa veli odur. Cihet yakınlığı bakımından eşitlerse derecesi daha kuvvetli olan tercih edilir. Bu ikisinde de eşit olurlarsa kuvvet bakımından üstün olan tercih edilir. Eğer asabe-i nesebiyye bulunmazsa o zaman asabe-i sebebiyye devreye girecektir."},{"k":"tbl","r":[["Ölçü","Örnek"],["**Cihet**","Mesela, biri oğul diğeri öz erkek kardeş (oğul tercih edilir)."],["**Derece**","Mesela, babalık, oğulluk, kardeşlik, amcalık, dayılık gibi; her biri yeni basamak. Buna göre çocuklar birinci dereceyi, çocukların çocukları ikinci dereceyi oluşturur."],["**Kuvvet**","Yakınlık kuvveti. Mesela anne baba bir kardeşlerin birbirine olan yakınlığı, baba bir kardeşlerin birbirine yakınlığından daha güçlüdür."]]},{"k":"p","x":"Azad edilmiş bir cariyenin velisi kendisini azad eden kimsedir (Mu'tik: asabe-i sebebiyye). Bu kişinin erkek veya kadın olması arasında da fark yoktur. Eğer azad eden mevcut değilse o zaman yukarıdaki tertibe göre asabe-i nesebiyye cihet, derece ve kuvvet sırasına göre tecelli eder. Mesela, azad edenin oğlu, azad edenin babasına tercih edilir. Diğerleri de böyledir. Eğer asabe-i nesebiyye de bulunmazsa olay Ebu Hanife'ye göre asabenin dışındaki akrabalarına (zevi'l-erham); imameyne göre ise sultan veya vekiline intikal eder."},{"k":"p","x":"Asabenin dışındaki akrabaların evlasına gelince usul cihetinden sırasıyla, anne, babanın annesi, annenin annesi gelir. Furu'u cihetinden ise sırasıyla, kız, oğlun kızı, kızın kızı gelir. Bunlardan sonra annenin babası vardır ki o, cedd-i fasittir. Sonra asabe-i nesebiyyeye tekrar bakılırsa benzeri uygulanır; uhuvvet, umumet diye devam eder (öz halalar, öz teyzeler vb.)."}]},{"h":"Velâ yolu ile velayet","b":[{"k":"p","x":"Bir kafir bir Müslüman vesilesi ile Müslüman olduğunda onu velisi yapar ve şöyle der: \"Sen benim velimsin. Öldüğüm zaman mirasçımsın, cinayet işlediğimde akilemsin.\" İşte bu \"mevle'l-muvâlât\" diye isimlendirilmiştir. Karabet sebebiyle olan velayetten sonra, bu gelir."}]},{"h":"Sultanın velayeti ile velayet","b":[{"k":"p","x":"Bunun delili Hz. Peygamber'in şu hadisidir: \"Sultan, velisi olmayana velidir.\" Fakat sultanın işlerinin çokluğundan ötürü onun yerine hakimler vekillik yapar."}]},{"h":"Şema: velayetin sabit olduğu yollar","b":[{"k":"kart","t":"Velayet ne ile sabit olur?","a":"بم تثبت الولاية","g":[{"h":"Milk ile","a":"تثبت بالملك","m":["«ولاية السيد على عبده وأمته» Efendinin kölesi ve cariyesi üzerindeki velayeti"]},{"h":"Karabet ile","a":"تثبت بالقرابة","m":["**Ebû Hanîfe:** «تشمل عصبة وذوي الأرحام من غير العصبة \"وأولو الأرحام بعضهم أولى ببعض\"» Asabeyi ve asabe dışındaki zevi'l-erhamı kapsar.","**İmameyn:** «تثبت ولاية بالقرابة للعصبة فقط \"الإنكاح إلى العصبات\"» Karabetle velayet yalnız asabeye aittir.","Sıra: «١- بنوة» (oğulluk) › «٢- أبوة» (babalık) › «٣- أخوة» (kardeşlik) › «٤- عمومة» (amcalık)"]},{"h":"Velâ ile","a":"تثبت بالولاء","m":["«مولى الموالاة» Mevle'l-muvâlât"]},{"h":"İmamet ile","a":"تثبت بالإمامة","m":["«السلطان ولي من لا ولي له» Sultan, velisi olmayanın velisidir."]}]}]},{"h":"Velilerin tertibi","b":[{"k":"p","x":"Yukarıda da çokça işaret edildiği gibi sıralama şöyledir:"},{"k":"steps","x":["**Karabet:** Bunlar iki derecedir: a) asabe-i nesebiyye b) asabe-i sebebiyye","**Mevle'l-muvâlât**","**Sultan, vekili ya da hakimi.**"]}]},{"h":"Uzak velinin yakın veli varken velayeti","b":[{"k":"p","x":"Bu üç yerdedir:"},{"k":"n","n":1,"x":"Yakın velinin uzak veliyi evlendirmek için vekil tayin etmesi / yetki vermesi."},{"k":"n","n":2,"x":"Yakın veli hazır değilken, kadına talip olan denk kişinin (hatib) onun görüşünü almayarak beklememesi."},{"k":"n","n":3,"x":"Yakın veli eğer velayete gerekli şartları haiz değilse uzak veli veli olur."}]},{"h":"Velinin azli","b":[{"k":"d","t":"Azl","x":"Lügatte uzaklaştırma anlamına gelen azl, bir kişiye verilen yetkinin geri alınmasıdır. Konumuzla ilgili olarak azl, velinin, üzerinde velayet hakkına sahip olduğu kişinin evliliğini engellemesidir."},{"k":"p","x":"Bunu yapabilmesi için iki şartın yani kefaet ile mehr-i misil şartının yerine getirilmemesi gerekir. Bu şartlar yerine getirildiği halde yakın veli akde müdahil oluyorsa bu günahtır."},{"k":"p","x":"Mezkur iki şart yerine getirildiği halde böyle bir durumla karşılaşılması durumunda ulema bu durumun önüne geçmek için iki görüş ortaya koymuştur:"},{"k":"n","n":1,"x":"Velayet, uzak veliye intikal eder. Nitekim veli hazır değilken de hüküm böyledir."},{"k":"n","n":2,"x":"Velayet, hakime intikal eder. Bu Hanefi mezhebinin mutemed görüşüdür. Bu konudaki asli unsur iki şeydir. Birincisi bu zulümdür, insanlar arasında mezalimin kaldırılması gerekir ki bu iş hakimin işidir. İkincisi, yakın veli göz göre göre tüm şartları haiz olan hatibi bırakıp kızı başka biri ile evlendirmenin hesabı içerisindedir. Burada Hanefilerin intikali hakime vermesi ile mesele kökünden çözülmüş uzak veliye verilmesi durumunda çıkabilecek huzursuzluk önlenmiş olur."}]}],"ht":[{"s":0,"x":"Velayetin iki sebebi: acziyet ve ehliyetin noksanlığı. Üç nev'i: nefis üzerinde, mal üzerinde, ikisi üzerinde birden. Nefis üzerindeki velayet: nedb ve icbar."},{"s":1,"x":"Velayet-i icbarın üç sebebi: küçüklük (bekâr da dul da), delilik ve bunaklık (aslî ya da arızî). Şâfiî'ye göre sebep bekâretliktir: küçük dula icbar yok, büyük bekâr kıza var."},{"s":2,"x":"Velayet-i icbar: Mâlikî — yalnız baba; Şâfiî — baba ve dede; Ahmed — iki rivayet; Hanefî — baba, dede, sonra asabe sırasıyla en yakın veli (\"Nikâh asabeden olan veliye aittir\")."},{"s":2,"x":"Tarafeyne göre (müftâbih) baba ya da dede evlendirirse bulûğ muhayyerliği yok, başkası evlendirirse var; Ebû Yûsuf'a göre hiçbir durumda yok. Baba/dedenin sû-i ihtiyarı biliniyor ve kefâet ya da mehirde fahiş aldatma varsa akit geçersizdir."},{"s":2,"x":"Büyük mecnun ve ma'tûhun velayeti oğullarınındır; oğullar baba ve dededen önce gelir."},{"s":3,"x":"İcbar sebebi Hanefilere göre küçüklük (bakire ya da dul), Şâfiîlere göre bekâret; ayrıca delilik ve bunaklık."},{"s":4,"x":"Baba ve dede dışındakinin evlendirdiği küçüğün nikahı sahih, lazım, gayr-i nafizdir: hıyâr-ı bulûğ vardır. Fesih vakti bulûğ anı (nikahı biliyorsa) ya da öğrenme anıdır."},{"s":4,"x":"Sözlü (razı oldum) ya da fiilî (öpmek, giydirmek, harcamak) rıza fesih hakkını düşürür. Sükût: erkek ve dul için itibar edilmez; bakire kızın sükûtu beyandır. Bilgisizlik özür değildir."},{"s":5,"x":"Velayet-i nedb: âkil, hür, büyük (bakire ya da dul) kadın üzerinde; evlendirme işini hayâ sebebiyle velisine bırakması."},{"s":5,"x":"Kadının kendi başına evlenmesi: Ebû Hanîfe/Züfer — kefâet ve mehr-i misille caiz; Şâfiî/Ahmed — veli şart; Mâlik — şerefli ve güzelse veli şart; Muhammed — mevkuf."},{"s":5,"x":"Bakirenin izni sükûtla, seyyibenin (dulun) izni sözle ya da fiille sabit olur."},{"s":6,"x":"Velinin dört şartı: hürriyet, bulûğ, akıl, dinde muvafakat (din birliği). Adalet şart değildir; fâsığın velayeti caizdir."},{"s":7,"x":"Velayet dört şeyle sabit olur: milk (efendinin kölesi üzerinde), karabet, velâ (velâ-i muvâlât), imamet (sultan ya da vekili)."},{"s":8,"x":"Karabetle velayet: Ebû Hanîfe'ye göre asabe ve asabe dışındaki usul-furu' (zevi'l-erham) — delil: \"ulu'l-erham\" ayeti ve İbn Mes'ûd'un kızını annesine evlendirtmesi; İmameyn'e göre yalnız asabe — delil: «الإنكاح إلى العصبات»."},{"s":8,"x":"Asabe-i nesebiyyenin dört cihetinin sırası: bünüvvet → ubüvvet → uhuvvet → umûmet. Birden fazla asabede sırasıyla cihet, derece, kuvvet bakılır; asabe-i nesebiyye yoksa asabe-i sebebiyye (mu'tik)."},{"s":12,"x":"Velilerin tertibi: karabet (önce asabe-i nesebiyye, sonra sebebiyye) → mevle'l-muvâlât → sultan, vekili ya da hakim (\"Sultan velisi olmayanın velisidir\")."},{"s":13,"x":"Yakın veli varken uzak veli üç durumda veli olur: yakın veli ona yetki verirse, yakın veli hazır değilken denk talip beklemezse, yakın veli velayet şartlarını taşımıyorsa."},{"s":14,"x":"Velinin azli (engellemesi) ancak kefâet ya da mehr-i misil eksikse caizdir; şartlar tamken engellemek günahtır. Bu durumda velayet bir görüşe göre uzak veliye, Hanefilerin mutemed görüşüne göre hakime geçer."}]},{"t":"Evlilikte Vekâlet ve Kefâet","intro":"Nikahta vekâlet ve vekilin müvekkile muvafakati ya da muhalefeti; kefâet (denklik): mezheplere göre unsurları, Hanefilerin altı unsuru, kefâet hakkının sahibi, şart koşulduğu vakit ve sonuçları.","s":[{"h":"Nikahta vekalet","b":[{"k":"d","t":"Vekalet","x":"Bir kimsenin, kendisinin de yapabileceği muamelattan bir işini başkasına devretmesi, onu kendi yerine ikame etmesi."},{"k":"p","x":"Nikah akdinde vekil, elçi gibidir. Vekil tayin edecek kişi hangi konuda vekil tayin ediyorsa o konuda tasarruf hakkına sahip olmalıdır."},{"k":"d","t":"Velayet-i kasıra","x":"Kişinin (yapacağı hukuki işlemin) doğrudan kendisiyle sınırlı kaldığı velayettir; asıldır."},{"k":"d","t":"Velayet-i müteaddiye","x":"Başkaları hakkında (hukukî işlem yapma yetkisinin) bulunduğu velayettir; fer'idir."},{"k":"not","x":"\"Beyyine, hüccet-i müteaddiye ve ikrar, hüccet-i kâsıradır.\" (Mecelle, 79) Hüccet-i müteaddiye: Etkisini sadece ilgili şahısta göstermeyip, başkasının hakkına da sirayet eden delil. Hüccet-i kâsıra: Etkisini sadece ilgili şahısta gösteren başkasının hakkına sirayet etmeyen delil."},{"k":"p","x":"Şimdiye kadar evliliğin sıhhat şartlarını, akdin kendi başına yapılma şartlarını gördük. Pekiştirmek gerekirse kişi eğer küçük, mecnun, ma'tuh olursa kendi başına evlenemediği için vekil de tayin edemez. Vekile hacet kalmadan velisi evlendirir."},{"k":"p","x":"Vekil tayin etmede kitabet şart değildir. Müvekkilin şahit tutmasının şart olmadığı gibi. Bununla beraber müvekkilin, bu vekaleti, evliliğin iptalini kastetmekle inkar etmesi imkan dahilinde olduğu için müvekkilin şahid göstermesi müstehaptır."}]},{"h":"Vekilin başkasını vekil tayin etmesi","b":[{"k":"p","x":"Müvekkil, vekilin, başkasına vekalet verme iznini ya sarahaten verir ya da bu hususta onu men eder; ya onu kendi görüşüyle baş başa bırakır ya da bu sayılanlar hakkında sükut eder. İzin vermesi durumunda ya bu kişiyi tayin eder ya vekilin kendi görüşüne bırakır ya da sükut eder."},{"k":"li","x":"Müvekkil, vekilin, başkasına vekalet vermesine izin vermiş ve tayin edilen kişiyi de onamış ise bu durumda vekil, ya akdi doğrudan kendisi üstlenir ya da belirlenen kişiyi vekil yapar."},{"k":"li","x":"Müvekkil, vekilin, başkasına vekalet vermesine izin vermiş ama kişinin onanmasını vekile bırakmışsa bu durumda vekil, ihtiyarına göre hareket eder."},{"k":"li","x":"Müvekkil, vekilin, başkasına vekalet vermesini men'etmişse akdi bizzat kendisi üstlenir. Mesela \"sadece seni vekil tayin ettim\" dese artık o akdi başkası gerçekleştiremez."}]},{"h":"Vekilin sorumluluğu, muvafakati ve muhalefeti","b":[{"k":"p","x":"Yukarıda da ifade ettiğimiz gibi \"el-vekil ke'ssefir fi kulli mes'ele\" kaidesince vekil elçi gibi sorumsuzdur. Bunun istisnası, vekil, mehrin kamil olması hususunda kadına kefil olmuşsa bu konuda sorumludur. Çünkü vekil, kefil konumundadır."},{"k":"p","x":"Vekil, vekil kılındığı konuda müvekkile muhalefet de muvafakat da edebilir. Muhalefetinde ya \"muhalefe ilâ hayr\" ya da \"muhalefe ilâ şer\" olur."},{"k":"ornek","x":"**Muvafakatına dair örnek:** Müvekkil, \"Beni falanın kızı falan ile 100 dinar mehir ile evlendir\" diyor. Vekil de bunu yapıyor."},{"k":"ornek","x":"**Muhalefe ila hayr'a örnek:** Müvekkil, \"Beni falanın kızı falanca ile 100 dinar mehir ile evlendir\" diyor. Vekil de müvekkilini falanca kız ile 80 dinara evlendiriyor. Bu ikisinde akidler müvekkil adına nafizdir."},{"k":"ornek","x":"**Muhalefe ila şer'e örnek:** Vekil, müvekkilin istediği kızla değil de başkasıyla evlendirirse ya da 100 dinar mehir yerine 120 dinar mehirle evlendirirse bu akid fuzulinin akdi gibidir. Dolayısıyla müvekkilinin icazeti beklenir."},{"k":"tbl","r":[["Vekilin tutumu","Örnek","Hükmü"],["**Muvafakat**","100 dinar istendi, 100 dinara evlendirdi","Müvekkil adına nafiz"],["**Muhalefe ilâ hayr**","100 dinar istendi, 80 dinara evlendirdi","Müvekkil adına nafiz"],["**Muhalefe ilâ şer**","Başka kızla ya da 120 dinara evlendirdi","Fuzûlînin akdi gibi; müvekkilin icazeti beklenir"]]}]},{"h":"Evlilikte kefaet","b":[{"k":"d","t":"Kefaet","x":"Erkeğin kıza denk olmasıdır. Bundan dolayı da ne kızın ne de kızın ailesinin kınanmamasıdır."},{"k":"p","x":"Tanımdan da anlaşılacağı gibi kefaet kadının lehine, kadın tarafından erkekte aranan bir şarttır. Kefaet akid esnasında muteberdir."},{"k":"li","x":"**Malik b. Enes ile Süfyan es-Sevri'ye göre** kefaet din konusundadır."},{"k":"li","x":"**Ahmed b. Hanbel'e göre**, din ve san'at konusundadır."},{"k":"li","x":"**İbn-i Ebi Leyla'ya göre**, din, neseb ve mal konusundadır. Ebu Hanife'den de bu görüş rivayet edildi."},{"k":"li","x":"**İmam Şafii'ye göre**, din, neseb, san'at, hürriyet, ayıplardan hali olma, yesar (zenginlik) ve yaş konusundadır."},{"k":"li","x":"**Ebu Hanife'ye göre**, neseb, İslam, hürriyet, mal, diyanet, meslek (hirfe) konusundadır."},{"k":"not","x":"Ebû Hüreyre'nin rivayet ettiğine göre Benî Beyâza kabilesinin azatlı hacamatçısı Ebû Hind, Hz. Peygamber'i hacamat etmişti. Hz. Peygamber \"Ey Beni Beyâza, Ebû Hind'i evlendirin, onunla evlenin\" buyurdu. Hz. Peygamber, bir kabilenin azatlısı ve o zaman insanlar nazarında düşük bir mesleğe sahip bir kişinin, kendinden üst konumda bulunan bir kadın ile evlendirilmesini istemekte ve denkliğe itibar etmemektedir. Şayet kefâet muteber olsaydı, Allah resûlü bunu emretmezdi. Mâlik ve Süfyân es-Sevrî bu hadis ile kefaetin sadece din hususunda olduğuna delil getirdiler."},{"k":"tbl","r":[["Görüş sahibi","Kefâetin unsurları"],["**Mâlik b. Enes ve Süfyân es-Sevrî**","Din"],["**Ahmed b. Hanbel**","Din, san'at"],["**İbn Ebî Leylâ (Ebû Hanîfe'den de rivayet edildi)**","Din, neseb, mal"],["**İmam Şâfiî**","Din, neseb, san'at, hürriyet, ayıplardan hâlî olma, yesar (zenginlik), yaş"],["**Ebû Hanîfe**","Neseb, İslam, hürriyet, mal, diyanet, meslek (hirfe)"]]},{"k":"p","x":"Ziyade vasıflarla ilgili bazı deliller öne sürülmüştür. \"Size dini ve ahlakı güzel biri evlenmek için geldiği zaman onu evlendirin...\"; \"Allah, hiçbir şeye gücü yetmeyen ve başkasının malı olan bir köle ile, kendisine verdiğimiz güzel rızıktan gizli ve açık olarak Allah yolunda harcayan kimseyi misal verir. Bunlar hiç eşit olur mu?\"; \"Araplar birbirlerine, mevali birbirlerine denktir.\" vb."},{"k":"p","x":"Bütün bu vasıflardan maksat bir ömür boyu hayat sürecek eşlerden birinin diğerinin maslahatına nizam vermesidir. Bu da ancak muvafakat ve yakınlık ile olur. Mesela bir köle bir cariye ile evlense de cariye azad edilse, azad edilmiş bu kadının köle olan kocasından ayrılması caizdir. Bu konuda Allah Resulü'nün uygulaması vardır."}]},{"h":"Hanefilerin ziyade delillerinin beyanı","b":[{"k":"h","x":"1. Neseb"},{"k":"p","x":"Fukaha'ya göre, acem bir erkek Arap bir kızla denk değildir. Yine her Arap da bir değildir. Kureyşliler mesela Emevilere denk değildir. Nesebin kefaet için şart olması Araplar içindir. Çünkü Araplar soylarını muhafaza etmeye özen göstermiş, onu övgü vesilesi yapmışlardır. Soyu ile övünenler için de bu böyledir. Bu konuda bir çok hadise dayanmışlardır: \"Kureyşliler birbirinin dengidir. Her sülâle, diğer sülâleye denktir. Araplar birbirinin dengidir. Her kabile, diğer kabileye denktir. Arap olmayanlar da birbirlerinin dengidir. Adam adama denktir.\""},{"k":"h","x":"2. İslam"},{"k":"p","x":"Buradaki İslam şartı erkekte aranan bir şart değildir. Malumdur ki akdin sıhhat şartı Müslüman kadının evleneceği erkeğin Müslüman olmasıdır. Aksi bir durumda evlilik zaten batıl olur. Kefaet ise akdin lüzum şartıdır, sıhhat şartı değildir."},{"k":"not","x":"Kefaet, genel anlamıyla lüzum şartıdır ancak kitapları dikkatle incelediğimizde üç yerde sıhhat şartı olduğu anlaşılmaktadır (dersten notlar)."},{"k":"p","x":"Buradaki İslam'dan maksat erkeğin babasının ve dedesinin Müslüman olmasıdır. Daha öncesinin Müslüman olup olmamasının önemi yoktur. Bunun muteber olması Arap olmayanlar nezdindedir. Çünkü Arap olmayanların iftihar vesilesi İslam'dır. Araplarda öncelik neseb olduğu için sadece babası Müslüman olan erkek soyca Müslüman olan kadına denk olur."},{"k":"not","x":"Müellif burada diyor ki, sahabe-i kiramın bir çoğu babaları müşrik olan Müslüman kadınlarla evlendiler. Yine Peygamberimiz (sav)'in eşleri, bizlerin annelerinin çoğunun babaları gayr-i müslim idiler."},{"k":"h","x":"3. Hürriyet"},{"k":"p","x":"Bu da İslam sıfatı gibi acemler arasında muteberdir. Burada da baba ve dedenin hür olması yeterlidir. Babası hür ama dedesi köle olan erkek, babası ve dedesi hür bir kadına denk olmaz. Bir köle veya mu'tak bir erkek hür bir kadının dengi değildir."},{"k":"h","x":"4. Hirfe (meslek)"},{"k":"p","x":"Örfe bakılır. Şerefli bir meslek erbabının kızı ile bayağı / âdi bir meslek sahibi erkeğe denk değildir."},{"k":"not","x":"Mesleğin bayağı oluşu, zaman ve topluma göre değişiklik arz eder."},{"k":"h","x":"5. Diyane"},{"k":"p","x":"Bundan maksat salah ve istikamettir. Salih bir adamın saliha kızına ancak salih bir erkek denk olur. Bu Ebu Hanife ile Ebu Yusuf'un görüşüdür. İmam Muhammed'e göre bunların denklikle alakası yoktur. Çünkü bunlar ahirete taalluk eden kul ile rabbi arasında olan işlerdendir. Kefaet ise dünya işlerindendir..."},{"k":"h","x":"6. Mal"},{"k":"p","x":"Bundan maksat zenginlik değildir. Maksat, erkeğin, akid esnasında peşin mehri ödemeye ve bir aylık nafakayı vermeye malik olmasıdır. Hakikaten de öyle insanlar var ki Allah daha sonra kudreti ile ona dilediği kadar vermektedir. Ebu Yusuf'a ait olan ve aynı zamanda müftabih olan bu görüşe Ebu Hanife ile İmam Muhammed muhaliftirler."},{"k":"tbl","r":[["Unsur","Kimler arasında / ölçü","Not"],["**Neseb**","Araplar arasında","Acem Arap kıza denk değil; Kureyşli Emevîye denk değil"],["**İslam**","Arap olmayanlar arasında","Baba ve dedenin Müslüman olması"],["**Hürriyet**","Arap olmayanlar arasında","Baba ve dedenin hür olması; köle ya da mu'tak hür kadına denk değil"],["**Hirfe (meslek)**","Örfe göre","Bayağı meslek sahibi şerefli meslek erbabının kızına denk değil"],["**Diyanet**","Salah ve istikamet","Ebû Hanîfe ve Ebû Yûsuf'a göre; Muhammed'e göre kefâetle ilgisi yok"],["**Mal**","Peşin mehir + bir aylık nafaka","Ebû Yûsuf'un müftâbih görüşü; Ebû Hanîfe ve Muhammed muhalif"]]}]},{"h":"Kefaete hakkı olanın beyanı","b":[{"k":"li","x":"Küçüğü baba ve dede dışındaki veli dengi olmayanla evlendirse sahih değildir. Dengi olanla evlendirse küçüğün buluğdan sonra seçme hakkı doğar. Dilerse devam eder dilerse evliliği fesheder."},{"k":"li","x":"Baliğ, âkil, hür kadın kendisini denk ile evlendirse akid lazım ve nafiz olur. Denk olmayan biri ile evlendi ise müfta-bih olan görüşe göre evlilik akdi kurulmaz, batıldır. Veli akidden evvel denk olmayışa razı olmuşsa akid sahih ve lazım olur."},{"k":"li","x":"Aynı şekilde baliğ, âkil ve hür olan erkek kendisini şerefi düşük ve zengin olmayan bir kadınla evlendirse buna kimsenin itiraz hakkı yoktur. Erkeğin sefih olup olmaması arasında da fark yoktur."},{"k":"p","x":"Bu durumları özetleyecek olursak:"},{"k":"n","n":1,"x":"Denklik erkekte aranır, erkek kadına denk olmalıdır."},{"k":"n","n":2,"x":"Denklik hem kadının hem de velinin hakkıdır. Birinin hakkı düşse diğerinin ki sabittir."},{"k":"n","n":3,"x":"Kadının hakkı iki mes'elede ortaya çıkar: a) Küçük olan kızı baba ve dede dışındaki bir veli dengi olmayanla evlendirmişse b) Küçüğü su-i ihtiyar sahibi olan baba ve dede evlendirmişse ve bu halleri de maruf ise bu iki akidde batıldır."},{"k":"n","n":4,"x":"Kadın kendisi denk olmayan biri ile evlendirmişse velinin geçen iki mes'elede olduğu gibi akdi feshetme hakkı vardır."}]},{"h":"Kefaetin şart koşulduğu vakit","b":[{"k":"p","x":"Kefaet başlangıçta aranır. Bu kefaetin evlilik hayatı boyunca baki kalması şart değildir. Zira bu insanlar için meşakkattir. Zamanın değişmesi ile insanın halinin yarın ne olacağı ön görülemeyen şeylerdendir."}]},{"h":"Kefaetin kadının ve velilerin hakkı olmasının neticelerinden bazıları","b":[{"k":"li","x":"Baliğ, âkil ve hür olan kadın denk olduğunu zannederek bir erkekle kendisi evlendi. Sonra zahir oldu ki erkek denk değilmiş. Bu durumda araştırma yapmadığı için kadının hakkı sakıt olur ama velinin hakkı sakıt olmaz. Akid batıldır."},{"k":"li","x":"Kadın razı olduğu halde veli denklik şartı aramaksızın ve halini araştırmaksızın evlendirdiyse kadının hakkı düştüğü gibi velinin hakkı da düşer."},{"k":"li","x":"Eğer denkliği şart koşsalar da hem erkek hem de veli açısından erkeğin denk olmadığı açığa çıksa ikisinin de fesih hakkı vardır. Yine erkek akid esnasında denk olduğunu söylese de sonra öyle olmadığı zahir olsa fesih muhayyerlikleri vardır."},{"k":"li","x":"Erkeğin nesebi sorulsa o da söylese ama nesebin farklı olduğu anlaşılsa, söylenen neseb ile izhar olan neseb denk ise fesih yok, edna ise fesih var, a'la ise ercah kavle göre fesih yoktur."}]}],"ht":[{"s":0,"x":"Nikahta vekil elçi gibidir; vekil tayin eden o konuda tasarruf ehli olmalıdır (küçük, mecnun, ma'tûh vekil tayin edemez, velisi evlendirir). Vekâlette yazı ve şahit şart değil; şahit tutmak müstehaptır."},{"s":1,"x":"Müvekkil izin verip kişiyi belirlediyse vekil ya kendisi yapar ya o kişiyi vekil yapar; seçimi vekile bıraktıysa vekil ihtiyarına göre davranır; men ettiyse (\"sadece seni vekil tayin ettim\") akdi bizzat yapar."},{"s":2,"x":"\"El-vekil ke's-sefîr\": vekil elçi gibi sorumsuzdur; mehre kefil olmuşsa sorumludur."},{"s":2,"x":"Muvafakat ve hayra muhalefette akit müvekkil adına nafizdir; şerre muhalefette fuzûlî akdi gibi müvekkilin icazetine kalır."},{"s":3,"x":"Kefâet: erkeğin kıza denk olması; kadın lehine, erkekte aranır, akit anında muteberdir."},{"s":3,"x":"Kefâetin unsurları: Mâlik ve Sevrî — din; Ahmed — din, san'at; İbn Ebî Leylâ — din, neseb, mal; Şâfiî — din, neseb, san'at, hürriyet, ayıpsızlık, yesar, yaş; Ebû Hanîfe — neseb, İslam, hürriyet, mal, diyanet, hirfe."},{"s":4,"x":"Hanefîlere göre kefâetin altı unsuru: neseb (Araplarda), İslam ve hürriyet (Arap olmayanlarda; baba ve dedeye bakılır), hirfe (örfe göre), diyanet (Muhammed hariç), mal (peşin mehir ve bir aylık nafakaya güç; Ebû Yûsuf'un müftâbih görüşü)."},{"s":4,"x":"Kefâet lüzum şartıdır, sıhhat şartı değildir (bazı yerlerde sıhhat şartı olur)."},{"s":5,"x":"Denklik erkekte aranır; hem kadının hem velinin hakkıdır, birinin hakkı düşse diğerininki kalır."},{"s":5,"x":"Baba-dede dışındaki veli küçüğü dengi olmayanla evlendirirse sahih değil; baliğa kadın dengi olmayanla evlenirse müftâbih görüşe göre batıl (veli önceden razıysa sahih ve lazım). Erkek dengi olmayan kadınla evlenirse kimse itiraz edemez."},{"s":6,"x":"Kefâet akit başında aranır; evlilik boyunca devam etmesi şart değildir."},{"s":7,"x":"Kadın araştırmadan dengi sanıp evlenirse kendi hakkı düşer, velininki düşmez. Veli araştırmadan, kadının rızasıyla evlendirirse ikisinin hakkı da düşer. Denklik şart koşulup erkek denk çıkmazsa ya da yalan söylediyse fesih hakkı vardır."},{"s":7,"x":"Söylenen neseb ile ortaya çıkan neseb denkse fesih yok, daha aşağıysa fesih var,
